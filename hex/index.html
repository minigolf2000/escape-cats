<!--
  Hex Clicker — v1 single-player prototype.

  A deliberately faithful Cookie Clicker clone reskinned as the Escape Cats
  neon line-art world: pet Hex the cat, she bats a neon mouse toy, you collect
  MICE (the currency). Spend them on buildings that auto-generate
  mice. Classic mechanics: geometric cost curve (x1.15 per copy), per-building
  mice-per-second, big-number formatting, golden mouse bonuses, one-off
  UPGRADES with declarative unlock/effect, localStorage autosave.

  THE TWIST: buying the Catnap Hypnalysis upgrade (gated on the lab's reveal) puts
  Hex to sleep and flips the game into a NIGHT PHASE. The reveal wall from
  reveal-lab.html renders behind her: researching Counting Mice makes the first
  wall mice appear (their count is a pure function of lifetime mice earned) to
  patrol the TO THE MOON scene, and the sleep-stage upgrades (Deep Sleep, REM
  Sleep, Lucid Dreaming) grow the glowing dream-trails that ink the word — Hex's
  imagination getting more vivid. Word% is a hardcoded constant, noise
  is locked to zero. Night buildings dwarf day production; day buildings and
  mps carry over. End state per the design doc: the word is read off the wall
  to a human proctor — no win screen.

  Why raw HTML: this is a prototype (see prototypes/README.md). Zero deps, zero
  build, edit-and-refresh. The economy lives in one plain `game` object and the
  balance in one `BUILDINGS` table, so the tuned result lifts cleanly into the
  multiplayer app (apps/hex-clicker) + packages/shared/balance.ts later.

  Design decisions this honors (see hex-clicker-design.md): neon line-art skin,
  currency = mice, clicking stays relevant, golden mouse = the fun spike.
  Multiplayer / reveal-wall / eras are intentionally NOT here yet — v1 is about
  finding the core clicker fun.
-->

  :root {
    --gold: #ffd44d;
    --neon: #57e6c9;
    --ss: 1.5;  /* shop skin scale (locked) */
    /* Where the day sunburst converges inside #stage, and therefore where Hex
       is parked: #rays hangs its center here and #catWrap offsets from the same
       number. Above true center because the shop owns the bottom of the screen.
       Move this one value and cat + background travel together. */
    --sun-y: 33%;

    --ui-font: 'Baloo 2', system-ui, sans-serif;
    --page-bg:
      radial-gradient(58vh 58vh at 50% 44%, rgba(150,205,255,.34), rgba(90,160,220,.10) 45%, transparent 70%),
      repeating-linear-gradient(90deg, #2e6699 0 26px, #295c8b 26px 52px);
    --panel-bg: repeating-linear-gradient(90deg, #24537d 0 26px, #204a70 26px 52px);
    --wood: linear-gradient(#b07c45, #855427 42%, #5e3a1a);
    --wood-line: #3d240f;
    --ink: #f6f1e6;
    --muted: #cbbda4;
    --dim: #a1917a;
    --line: rgba(0,0,0,.34);
    --icon-bg: rgba(0,0,0,.26);
    --cost-ok: #7fe37f;
    --cost-no: #e2645e;
    --title-color: #fff;
    --title-shadow: 0 2px 0 rgba(0,0,0,.5), 0 0 14px rgba(0,0,0,.45);
  }
  body.night {
    --ui-font: 'Baloo 2', system-ui, sans-serif;
    /* No --page-bg here on purpose. The night sky is painted by #nightSky, which
       FADES in — two gradient stacks cannot be transitioned into one another, so
       overriding this var would snap the whole screen from day to night on one
       frame. body keeps the day background all game; #nightSky covers it. */
    --panel-bg: rgba(9,11,18,.93);
    --wood: none;
    --wood-line: #262b36;
    --ink: #b9c2d4;
    --muted: #77808f;
    --dim: #545d6c;
    --line: #262b36;
    --icon-bg: #171a21;
    --cost-ok: var(--gold);
    --cost-no: #6b5535;
    --title-color: var(--gold);
    --title-shadow: 0 0 18px rgba(255,212,77,.4);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font: 500 13px var(--ui-font); color: var(--ink);
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
    /* Kiosk lockdown: this is a proctored, locked-in escape-room game, so the
       browser's ambient gestures are noise. `overscroll-behavior: none` kills
       Android pull-to-refresh and the rubber-band bounce at the document edge
       (inner scrollers re-enable their own with `contain`, below), and
       `-webkit-touch-callout: none` stops iOS's long-press copy/share popover
       mid-tap. Pinch/double-tap zoom is already gone via the viewport's
       user-scalable=no; text selection via user-select above. */
    overscroll-behavior: none; -webkit-touch-callout: none;
  }
  body {
    background: var(--page-bg);
    display: flex; flex-direction: column;
  }
  /* The night sky, as a layer rather than a variable, so day->night can be a
     DISSOLVE instead of a cut. z-index -1 puts it above body's background and
     below every in-flow child, so it needs no cooperation from anything else.
     Fixed, not absolute: it has to cover the whole viewport including behind the
     fixed #hud and #dock, which body's background does too.
     2.2s and no delay, so it runs from the moment the twist fires and is fully
     dark at 2.2s — before the stars finish at 2.9s and well before the camera
     starts moving at 3.3s. That ordering is the point: the world goes to night
     first, THEN Hex is carried away from it. */
  #nightSky {
    position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: 0;
    background:
      radial-gradient(90vw 55vh at 50% 12%, rgba(180,140,255,0.07), transparent 62%),
      #06070c;
    transition: opacity 2.2s ease-in;
  }
  body.night #nightSky { opacity: 1; }

  /* ---- HUD ----
     An overlay, not a flow element — same reasoning as the shop tray. Before
     this, #hud sat above #stage in flex flow, so the score/mps readout ate a
     real ~70px strip that never registered a pet tap (it was never part of
     #catWrap at all). Fixed + pointer-events:none makes it float on top of a
     stage that now runs edge-to-edge, so a tap "on" the score still lands on
     the cat underneath. Nothing left inside #hud is interactive (the menu
     button was removed earlier), so blanket pointer-events:none is safe. */
  /* Cookie Clicker's signature readout, in our own units: one centered line
     reading "N 🐭", with "per second: X" tucked under it. The shop rows say
     "2.5/s" instead — terse there because it's a column competing with a name
     and a price, verbose here because this line has the room and reads as a
     sentence. #count and the coin are inline so they share a baseline rather
     than stacking. */
  #hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 6; pointer-events: none;
    padding: max(12px, env(safe-area-inset-top)) 14px 6px;
    display: flex; align-items: flex-start; justify-content: center;
  }
  #bank { min-width: 0; text-align: center; }
  #count {
    display: inline-block; vertical-align: baseline;
    color: var(--title-color); text-shadow: var(--title-shadow);
    font: 700 32px var(--ui-font); font-variant-numeric: tabular-nums; line-height: 1.1;
  }
  /* Same coin as the shop rows (see currencyIconSVG()) — set once at boot,
     never rewritten by refreshHud(), since it's static art next to a live
     number, not part of the number itself. Sits AFTER the count, standing in
     for the word "mice" rather than prefixing the number like a currency sign. */
  #countIcon { display: inline-block; vertical-align: middle; margin-left: 7px; margin-bottom: 4px; }
  #countIcon .coin { display: block; width: 28px; height: auto; }
  #cps {
    font: 400 13px var(--ui-font); color: var(--title-color);
    text-shadow: var(--title-shadow); opacity: .92;
    margin-top: 1px; font-variant-numeric: tabular-nums;
  }
  #cps b { font-weight: 700; }

  /* ---- Play area ---- */
  #stage { flex: 1 1 auto; position: relative; min-height: 0; }
  /* Cookie Clicker's slowly-turning sunburst behind the cookie. Masked to a
     soft disc so the spokes fade out before the screen edge instead of
     ending in a hard circle. Day only — hidden at night the same way #wall is
     shown at night (the theme vars are for colors; a display toggle doesn't
     need to round-trip through one). */
  #rays {
    position: absolute; top: var(--sun-y); left: 50%; width: 190vmax; height: 190vmax;
    margin: -95vmax 0 0 -95vmax; pointer-events: none; display: block;
    background: repeating-conic-gradient(from 0deg,
      rgba(255,255,255,.115) 0deg 5deg, transparent 5deg 11deg);
    -webkit-mask-image: radial-gradient(circle at center, #000 0 14%, transparent 34%);
    mask-image: radial-gradient(circle at center, #000 0 14%, transparent 34%);
    animation: raySpin 90s linear infinite;
    transition: opacity 1.8s ease-out;
  }
  @keyframes raySpin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #rays { animation: none; } }
  /* Not clickable itself — just the centering flexbox. Petting hit-tests
     against #hexCat's actual painted shapes (see its rule below), not this
     full-stage box, so a tap in the empty space around Hex (or between her
     ears) doesn't count as a pet. */
  /* Biased upward, not centered: the buildings strip is pinned to the bottom of
     the screen (see #buildingSec), so Hex sits in the upper play area to fill
     what used to be dead space and to stay clear of the pinned shop.
     A static transform on this outer box only — the JS purr/dream (#catMotion)
     and the night zoom (#catPose) live inside and compose on top of it. */
  #catWrap {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    /* Parked on the sunburst's hub (--sun-y, the same anchor #rays is positioned
       from), NOT centered in the leftover space above the shop. Both percentages
       resolve against #stage, so Hex sits exactly where the background converges
       and the two can never drift apart.

       This is deliberately a CONSTANT. It used to center her between the HUD and
       the top of the dock off measured --hud-h/--dock-h, which meant every shop
       state change — opening, collapsing to the SHOP rail, the first building
       section appearing — slid Hex up or down the screen. She's the thing you're
       tapping; the shop moving must not move the target out from under a finger. */
    transform: translateY(calc(var(--sun-y) - 50%));
  }
  /* At night the wall reveal owns Hex's position (see #catPose), so drop the day
     centering entirely. */
  body.night #catWrap { transform: none; }
  /* Four nested layers, one transform each, because they animate on wildly
     different clocks and CSS can't run two durations on one property:
       #catMotion — purr + dream twitch (JS, per-frame, NO transition)
       #catPose   — the night zoom-out (slow, one-shot, 1.8s)
       #catBreath — sleeping breath (slow loop, night only)
       #hexCat    — pet squash (fast, .1s, fires constantly)
     Flattening these into one element makes every pet squash inherit the
     1.8s night easing and feel broken.

     #catMotion sits OUTSIDE #catPose on purpose. Its moves are measured in real
     screen px, and #catPose's night transform scales everything under it to
     .25 — so a 3px dream twitch nested inside would render as 0.75px and read
     as nothing. It also carries no transition of its own: purr runs at ~14Hz,
     and any easing at all would smear a 69ms oscillation into a flat line. */
  #catMotion {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100%;
  }
  #catPose {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100%;
    transition: transform 1.8s cubic-bezier(.22, .61, .36, 1);
  }
  /* width/height:100% is load-bearing, not decoration: #hexCat sizes itself
     with `width: min(62%, 340px)`, and that 62% resolves against whatever its
     containing block is. Let this layer shrink-wrap and it collapses to the
     SVG's intrinsic 200px, silently rendering Hex at ~1/3 scale. */
  #catBreath {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100%;
  }
  /* pointer-events:none on the root svg is load-bearing, not decoration: an
     inline <svg> hit-tests its own bounding box by default (unlike its
     graphics children, which default to visiblePainted), so without this a
     tap in the gap between Hex's ears — inside the viewBox but on no
     path — would still count as a pet. none is inherited, so every child
     shape below re-enables auto (== visiblePainted for SVG content) to get
     real per-shape hit-testing back; cursor/touch-action move down with it,
     since they're meaningless on an element excluded from hit-testing. */
  #hexCat {
    width: min(55%, 300px); height: auto; max-height: 84%;
    pointer-events: none;
    /* day: sitting in the sunburst, so a warm white bloom like CC's cookie */
    filter: drop-shadow(0 3px 10px rgba(0,0,0,.45)) drop-shadow(0 0 30px rgba(200,235,255,.45));
    transition: transform .1s ease-out;
  }
  #hexCat > * { pointer-events: auto; cursor: pointer; touch-action: manipulation; }
  #catWrap.squash #hexCat { transform: scale(.93); }
  #catWrap.zoomies #hexCat { filter: drop-shadow(0 0 32px rgba(255,212,77,.45)); }
  #catWrap.zoomies #hexCat .catLine { stroke: #ffd44d; }
  /* idle-motion pivots: the head tilts about the neck; each ear about its base */
  #catFace { transform-box: fill-box; transform-origin: 50% 96%; }
  #earLeft { transform-box: fill-box; transform-origin: 52% 90%; }
  #earRight { transform-box: fill-box; transform-origin: 48% 82%; }
  /* Zoomies lights up the IRIS (#eyeLeft/#eyeRight), leaving the pupil black.
     This used to target #irisLeft/#irisRight, which was right back when those
     were the green iris dots — after the eye coloring flipped (green iris,
     black pupil) the same rule was recoloring her PUPILS pale yellow, which
     read as a yellow slit floating in a green eye instead of eyes lighting up. */
  #catWrap.zoomies #hexCat #eyeLeft, #catWrap.zoomies #hexCat #eyeRight { fill: #ffe98a; }
  #hexCat #eyeLeft, #hexCat #eyeRight {
    transform-box: fill-box; transform-origin: center; transition: transform .06s;
  }
  #hexCat.blink #eyeLeft, #hexCat.blink #eyeRight { transform: scaleY(.14); }
  /* Iris transform is JS-owned (updateCat), not class-driven like the lids —
     it has to combine a look-direction translate with the same blink/asleep
     squash the lids get, and CSS can't compose an inline transform with a
     class rule's transform (one wins outright). This is also the fix for a
     regression from the pre-SVG canvas cat: that version drew one neon
     ellipse per eye, so squashing it for a blink squashed the whole eye. This
     SVG cat draws the white socket and the iris as two separate shapes, and
     only the socket was ever wired to blink/asleep — the iris sat there
     full-size the entire time, which reads as a stuck-open eye asleep. */
  #hexCat #irisLeft, #hexCat #irisRight {
    transform-box: fill-box; transform-origin: center; transition: transform .12s ease-out;
  }
  /* whiskers: twitch while asleep, fan forward at prey while awake (JS-driven) */
  #hexCat #whiskers {
    transform-box: fill-box; transform-origin: center; transition: transform .18s ease-in-out;
  }
  /* Jaw (chatter, yawn). Origin is TOP center, not center: the mouth hangs off
     the muzzle, so scaling it should drop the jaw downward rather than grow it
     symmetrically through her chin. No transition — chatter is ~11Hz and JS
     already eases the yawn, so any smoothing here only fights both. */
  #hexCat #mouth {
    transform-box: fill-box; transform-origin: center top;
  }

  /* ---- Night phase (post–Catnap Hypnalysis): Hex sleeps, the wall wakes ----
     Colors/fonts come from the body.night var block at the top — the whole
     Cookie Clicker skin falls away on one class. Only structural/motion
     changes live here.
     .asleep sits after .blink so its eye rule wins the specificity tie. */
  /* THE ZOOM-OUT. Hex glides down and shrinks to a quarter size, which reads
     as the camera pulling back to take in the whole wall. Done as transform
     (not width/align-items) so it's one smooth GPU-composited move — the old
     version snapped, because align-items and width can't tween a flex reflow.
     translateY is applied AFTER scale in the matrix, so the distance is in
     real screen px and doesn't get quartered by the scale. #stage is exactly
     100vh (both #hud and #dock are position:fixed, so #stage is body's only
     in-flow child), which is what makes 50vh mean "the bottom edge". */
  /* The zoom WAITS, and for two things now: the yawn (YAWN_MS, 1300ms) and then
     a 2000ms hold at full size while the first zzz drift off her (see #sleepZ).
     1.3 + 2.0 = the 3.3s delay below.
     Without any delay the yawn is simply never seen — the zoom is ease-OUT, so
     she is ~40% shrunk within 300ms and a thumbnail by peak gape. Without the
     hold the zzz were legible only as she shrank, at a quarter size, during the
     one beat the player is forced to watch. Ordering all three turns the phase
     change into a sentence: she yawns herself to sleep, the zzz say she IS
     asleep, and THEN the camera leaves her for the wall.
     Delay only on the night rule, so waking (dev preset back to day) still snaps
     back immediately. Keep in sync with YAWN_MS + ZZZ_HOLD_MS. */
  body.night #catPose {
    /* Independent of the day centering (#catWrap is neutralized at night): the
       original wall-reveal pose, so the sleeping cat settles where it expects. */
    transform: translateY(calc(39vh - 104px)) scale(.25);
    transition-delay: 3.3s;
  }
  body.night #hexCat { filter: drop-shadow(0 0 16px rgba(180,140,255,.28)); }
  #hexCat.asleep #eyeLeft, #hexCat.asleep #eyeRight { transform: scaleY(.07); }

  /* ---- Sleeping: subdued signs of life ----
     Breath is the only always-on one; it's what separates "asleep" from
     "paused". 4s cycle, ~3% — deliberately below conscious notice. Held off
     at 3.1s, which used to mean "once the zoom has landed" (yawn 1.3 + zoom
     1.8). With the zzz hold pushing the zoom back to 3.3s, 3.1s now lands just
     inside the HOLD instead, and that is worth keeping rather than chasing the
     zoom again: she is still full size there, so a 3% rise and fall is actually
     legible, right where the beat is asking the player to notice she's asleep. */
  body.night #catBreath { animation: breathe 4s ease-in-out 3.1s infinite; }
  @keyframes breathe {
    0%, 100% { transform: scale(1) translateY(0); }
    50%      { transform: scale(1.03) translateY(-1.5px); }
  }

  /* Idle "zzz" — the sign that she is ASLEEP rather than merely small and still.
     Breath alone can't carry that: it is 3% over 4s, deliberately below
     conscious notice, which reads as alive but not as sleeping. Three z's drift
     from her head on a stagger so one is always in flight.
     Lives inside #catBreath, so it inherits the night pose's translate AND its
     scale(.25) for free and stays pinned to her head through the zoom-out.
     Two consequences, both easy to get wrong:
     Every length here is in PRE-SCALE pixels — the 96px font lands at 24px on
     screen. Keep that in step with the .25 above. 60px was the first try and
     landed at 15px, which vanished into the starfield next to a 56px cat.
     And #catBreath is the whole STAGE, not the cat: it is a flex box that
     centres the 200x210 SVG. So the anchor is calc(50% ± px), offsets from that
     centre, NOT from a box the size of the cat. Positioning against the box
     directly parks the glyphs ~90px above her head, which happens to look
     almost right and is entirely accidental — measure it, don't eyeball it.
     115px above centre CLEARS her silhouette, and has to: the offsets here are
     pre-scale, so they track her exactly as she shrinks, but the glyph's own size
     is held constant by the counter-scale below — which means the glyph is 4x
     larger RELATIVE to her once she is small. Anchored on her ear (the first
     version, -85px) that read fine at quarter size and vanished during the new
     full-size hold, a near-white glyph sitting on her white ear outline. Above
     the head at 115px it is clear of her at both scales; the head's half-height
     is 105px, so this is 10px of daylight.
     Starts at 1.3s — YAWN_MS, the same beat the zoom and the sky start on. It
     used to wait 3.1s to match #catBreath, which put the first z exactly at the
     moment the cutscene ENDS (runNightCutscene runs for YAWN_MS + 1800 = 3100ms),
     so the one stretch of the game where the player is forced to watch her fall
     asleep was the one stretch with no zzz in it. Not earlier than 1.3s though:
     during the yawn she is still awake, and you do not snore mid-yawn. */
  #sleepZ {
    position: absolute; left: calc(50% + 50px); bottom: calc(50% + 115px); display: none;
    font: 700 96px var(--ui-font); line-height: 1;
    /* Brighter than --ink, which is body text grey and disappears into a sky
       full of stars at this size. Warm white with the night's own violet glow,
       so it reads as HERS rather than as another star. */
    color: #e8ecf6; text-shadow: 0 0 22px rgba(180,140,255,.75), 0 0 6px rgba(0,0,0,.6);
    pointer-events: none;
  }
  body.night #sleepZ { display: block; }
  /* COUNTER-SCALE. The glyphs live inside #catPose, so they inherit its
     scale(.25) — which is what keeps them pinned to her head, and also what made
     them 96px on screen during the new hold, when the pose is still at scale(1).
     This runs the opposite curve on the same clock as the zoom above, so the
     product stays .25 throughout: identical on-screen size while she is big AND
     after she shrinks.
     The stops are NOT a straight .25 -> 1, and that is the whole point. The pose
     interpolates its scale linearly under the easing (1 -> .25), so a counter that
     also interpolates linearly (.25 -> 1) does not cancel it — the product peaks
     at (1-.375)(.25+.375) = .39, and the z's were measured bulging to 39px against
     a 24px baseline halfway through the move. Each stop below is .25 / poseScale
     at that point, with cubic-bezier(.22,.61,.36,1) evaluated into the VALUES so
     this animation can run `linear`. Product is .250 at every stop.
     Recompute these if the zoom's duration, easing or .25 ever move.
     #sleepZ's own box is 0x0 (its spans are absolute), so the default
     transform-origin is the emergence point itself — exactly what should stay
     put. `forwards` holds the end state instead of snapping back. */
  #sleepZ { transform: scale(.25); }
  body.night #sleepZ { animation: zCounterScale 1.8s linear 3.3s forwards; }
  @keyframes zCounterScale {
      0% { transform: scale(.25);  }
     10% { transform: scale(.314); }
     20% { transform: scale(.401); }
     30% { transform: scale(.504); }
     40% { transform: scale(.615); }
     50% { transform: scale(.724); }
     60% { transform: scale(.821); }
     70% { transform: scale(.901); }
     80% { transform: scale(.957); }
     90% { transform: scale(.99);  }
    100% { transform: scale(1);    }
  }
  /* bottom:0, so a glyph grows UPWARD out of the anchor into empty sky instead of
     hanging down over her face. */
  #sleepZ span { position: absolute; bottom: 0; opacity: 0; animation: driftZ 3.6s ease-out infinite; }
  /* 1.2s apart inside a 3.6s loop, so the three are evenly spaced forever. Each
     is a little smaller and offset, which is what stops them reading as one
     glyph stuttering in place. */
  #sleepZ span:nth-child(1) { animation-delay: 1.3s; }
  #sleepZ span:nth-child(2) { animation-delay: 2.5s; left: 14px; font-size: .78em; }
  #sleepZ span:nth-child(3) { animation-delay: 3.7s; left: -8px; font-size: .6em; }
  @keyframes driftZ {
    0%   { opacity: 0; transform: translate(0, 0) rotate(-10deg) scale(.7); }
    18%  { opacity: 1; }
    65%  { opacity: .6; }
    100% { opacity: 0; transform: translate(52px, -130px) rotate(12deg) scale(1.2); }
  }
  /* Motion is the whole point of this one, so there is nothing to keep when it
     is refused — hide it rather than leaving three glyphs parked on her ear. */
  @media (prefers-reduced-motion: reduce) {
    body.night #sleepZ { display: none; }
  }
  #wall { position: absolute; inset: 0; width: 100%; height: 100%; display: none; pointer-events: none; }
  body.night #wall { display: block; }
  /* Fades rather than `display: none`, which cannot be transitioned and took the
     whole sunburst out on one frame. 1.8s, no delay: the spokes are gone before
     #nightSky finishes darkening at 2.2s, so the day comes apart in the right
     order — light first, then colour. It keeps spinning behind zero opacity,
     which is one composited rotation and cheaper than fighting the animation. */
  body.night #rays { opacity: 0; }

  /* ---- Night starfield ----
     A backdrop that says "night" the moment the room goes dark, independent of
     the wall mice. Dots are % positioned so they scale with the stage (no resize
     hook needed). Hidden by default; the 1.3s delay matches the yawn (YAWN_MS),
     so the sky comes out the moment her eyes close rather than before. It used to
     land during the zoom; with the zzz hold in front of the zoom it now lands
     during the HOLD, which is better — the room goes dark around a cat who is
     still full size, and only then does the camera pull back. */
  #stars { position: absolute; inset: 0; overflow: hidden; pointer-events: none;
    opacity: 0; transition: opacity 1.6s ease-in 1.3s; }
  body.night #stars { opacity: 1; }
  /* Each star: a pale dot that breathes between its base opacity (--o) and a
     dim floor, on its own staggered clock (--dur/--delay) so the field shimmers
     instead of pulsing in unison. Colour is a cool white so it reads as sky and
     never competes with the neon mice. */
  #stars i { position: absolute; display: block; border-radius: 50%;
    background: #dfe9ff; box-shadow: 0 0 3px rgba(200,220,255,.5);
    animation: twinkle var(--dur) ease-in-out var(--delay) infinite; }
  @keyframes twinkle { 0%, 100% { opacity: var(--o); } 50% { opacity: calc(var(--o) * .28); } }
  @media (prefers-reduced-motion: reduce) { #stars i { animation: none; } }

  /* Cutscene input trap — see the #cutsceneVeil markup. Transparent so the
     transition plays through it; .on flips on the pointer capture that locks
     the whole screen. z-index clears the dock (10) and hud (6). */
  #cutsceneVeil { position: fixed; inset: 0; z-index: 30; display: none; pointer-events: none; }
  #cutsceneVeil.on { display: block; pointer-events: auto; }

  /* floating +N numbers */
  .float {
    position: absolute; pointer-events: none; font: 700 17px var(--ui-font);
    color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.75), 0 0 10px rgba(0,0,0,.5);
    font-variant-numeric: tabular-nums;
    animation: floatUp .9s ease-out forwards; white-space: nowrap;
  }
  body.night .float { color: var(--gold); text-shadow: 0 0 10px rgba(255,212,77,.5); }
  @keyframes floatUp {
    0% { opacity: 0; transform: translate(-50%,-4px) scale(.7); }
    18% { opacity: 1; transform: translate(-50%,-14px) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-64px) scale(1); }
  }

  /* per-click mouse particles (Cookie Clicker's flying cookie, but a toy mouse).
     JS drives x/y/rot through the main loop; transform+opacity only, so each
     particle stays on the compositor and never triggers layout. */
  .mousePop {
    position: absolute; left: 0; top: 0; width: 36px; pointer-events: none;
    z-index: 3; will-change: transform, opacity;
  }

  /* golden mouse — art injected by spawnGold(): the gilded mouse by day, the
     saucer at night (.saucer below, which resizes the box). Nothing downstream
     hardcodes these dimensions; moveGold() measures the element instead. */
  #golden {
    position: absolute; width: 62px; height: 62px; display: none; place-items: center;
    cursor: pointer; filter: drop-shadow(0 0 14px rgba(255,212,77,.85));
    animation: goldPulse 1.1s ease-in-out infinite; z-index: 5;
  }
  #golden svg { width: 100%; height: auto; display: block; }
  @keyframes goldPulse { 0%,100% { transform: scale(1) rotate(-6deg); } 50% { transform: scale(1.14) rotate(6deg); } }

  /* Sized so the PILOT reads at the same scale as the wall mice it's flying
     among, not as its own bigger creature — night is a pulled-back camera, so
     the golden mouse belongs at that same distance. The pilot is the shared
     silhouette at SAUCER_MOUSE_SCALE 0.58 inside a 64-wide viewBox; a wall mouse
     is ~7.6px wide (drawWallMouse at WALL_MOUSE_R), and the rendered saucer
     matches it at ~18 across.

     The BOX stays 36 and the art is what halves, because the box is also the
     hit target and the bounce box moveGold() measures — 36 was already noted as
     small for a thumb, and an 18px one would be genuinely unfair to catch. So
     the saucer now flies inside a ring of transparent slop: same catchability,
     half the creature.

     It also gets its own idle. goldPulse's ±6deg tumble and 1.14 punch-in read
     as a plush toy being squeezed: right for a mouse, wrong for a machine. A
     saucer should hover — so it banks half as far, bobs instead of scaling, and
     takes longer to do it. Same glow, different physics. */
  #golden.saucer { width: 36px; height: 36px; animation: saucerHover 2.6s ease-in-out infinite; }
  #golden.saucer svg { width: 50%; }
  @keyframes saucerHover {
    0%,100% { transform: translateY(2px) rotate(-3deg); }
    50%     { transform: translateY(-3px) rotate(3deg); }
  }

  /* top clears #hud (score + per-second line): same top-pad formula #hud uses
     for its own padding-top, plus #hud's content+bottom-pad height (~62px)
     and a small gap, so the pill sits just under the score instead of behind
     it — #buff is absolute against #stage, which starts flush with #hud. */
  #buff {
    position: absolute; top: calc(max(12px, env(safe-area-inset-top)) + 70px);
    left: 50%; transform: translateX(-50%);
    background: #2a230e; border: 1px solid #6b5a1e; color: var(--gold); display: none;
    font: 800 12px system-ui; letter-spacing: .05em; padding: 6px 14px; border-radius: 999px;
    white-space: nowrap;
    text-shadow: 0 0 10px rgba(255,212,77,.6); font-variant-numeric: tabular-nums; z-index: 4;
    pointer-events: none;
  }

  /* ---- Shop tray ----
     An OVERLAY, not a flow element: fixed to the bottom edge, so it floats over
     Hex instead of resizing the stage. Identical day and night — only the tint
     changes. Hides entirely when there's nothing to sell.

     No background and no border of its own: the stage (Hex, the rays, the night
     wall) shows straight through the transparent rows, and .shopHead below
     already draws the tray's top line. The blur is what keeps row text legible
     over whatever art it's floating on. */
  #dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: none; flex-direction: column;
    background: transparent; backdrop-filter: blur(10px);
    padding-bottom: env(safe-area-inset-bottom);
    /* Lives on the base rule, NOT on .cutscene-hidden, so the cutscene fade runs
       BOTH ways. A transition declared only on the state class exists only while
       that class is on: the browser reads the transition from the after-change
       style, so adding it fades out, and removing it takes the rule (and the
       transition with it) away in the same frame — the shop popped back at full
       opacity. Declared here it survives the class going away and the shop eases
       back in as the wall reveal settles. */
    transition: opacity .3s ease;
  }
  #dock.show { display: flex; }

  /* Cookie Clicker wood framing, in two lengths: the titled SHOP cap and the
     inert Upgrades/Buildings divider. Cut from the same board here — three bands
     each, carved line / wood / carved line. No bevel highlight: --wood is
     already a light-to-dark gradient, and a second lit edge on top of the first
     is what turns a short rail into a stack of hairlines.

     Tapping the SHOP rail collapses/reopens the whole dock (#dock.collapsed).
     It's the ONLY hit target for that — the divider is inert, so a mistap while
     reaching for a row can't shut the shop. */
  .shopHead, .shopDivider {
    flex: none; background: var(--wood), var(--panel-bg);
    border: 0;
    border-top: 1px solid var(--wood-line); border-bottom: 1px solid var(--wood-line);
  }
  .shopHead {
    position: relative;   /* anchor for #newBadge */
    /* Sized as a THUMB TARGET, not as a caption. This rail is the only hit area
       that opens and closes the dock (the divider is deliberately inert), so it
       has to be comfortable to hit blind while the other thumb is mashing Hex.
       At the old 19 × --ss it came out 28.5px — under Apple's 44pt AND Material's
       48dp, i.e. the one control in the shop that was too small to aim at. 32 ×
       --ss = 48px clears both. The band is centered content on a fixed height, so
       the extra height is wood around the same SHOP + chevron, not bigger type.
       Safe to retune freely: #catWrap parks Hex on the sunburst hub (--sun-y) as
       a CONSTANT, so the rail's height can't shift the thing you're tapping. */
    height: calc(32px * var(--ss));
    display: flex; align-items: center; justify-content: center; gap: calc(5px * var(--ss));
    padding: 0; -webkit-appearance: none; appearance: none; border-radius: 0;
    width: 100%; cursor: pointer; color: var(--ink);
  }
  .shopTitle {
    font: 700 11px var(--ui-font); font-size: calc(10.5px * var(--ss));
    letter-spacing: .14em; text-transform: uppercase; line-height: 1;
    text-shadow: 0 1px 1px rgba(0,0,0,.5);
  }
  /* Border-corner caret rather than a glyph — scales with --ss, no font
     dependency. Points down while open (tapping pushes the shop toward the
     screen edge it lives on), up when collapsed. The translateY re-centers it:
     rotating a square about its middle leaves the visual "V" sitting low. */
  .shopHead .chev {
    width: calc(6px * var(--ss)); height: calc(6px * var(--ss));
    border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
    transform: translateY(calc(-2px * var(--ss))) rotate(45deg);
    transition: transform .25s ease;
  }
  #dock.collapsed .shopHead .chev {
    transform: translateY(calc(1px * var(--ss))) rotate(225deg);
  }

  /* Divider and list travel together, and the section waits for a real
     building — a header over nothing but a ??? teaser is chrome. Plain blocks
     inside #shopScroll: neither section caps or scrolls on its own anymore. */
  #buildingSec { display: none; }
  #buildingSec.show { display: block; }
  /* Night cutscene: recede the ENTIRE shop (including the pinned buildings) so
     nothing covers the wall reveal; restored when the beat ends. Only the target
     state belongs here — the fade itself is on #dock so it plays in both
     directions (see the transition note there). */
  #dock.cutscene-hidden { opacity: 0; pointer-events: none; }

  /* Between Upgrades and Buildings, unlabelled — the rows below already say
     which section they are. Scales with --ss like the rest of the shop so it
     stays a plank instead of thinning to a pinstripe at the skin's scale. */
  .shopDivider { height: calc(6px * var(--ss)); }
  /* Only earns its keep between two lists. With Upgrades hidden it would stack
     under the SHOP rail as a second bar, and collapsed it would hang below the
     closed header — so a shut shop is exactly one rail. */
  #upgradeSec:not(.show) + #buildingSec .shopDivider,
  #dock.collapsed .shopDivider { display: none; }

  /* Unseen-upgrade badge, the mobile-game convention: a count on the thing that
     OWNS the hidden content, cleared by going and looking. Absolutely positioned
     so it can't shift the centred SHOP + chevron as the number changes width.
     Red is the only place this palette uses alarm colour, which is the point —
     it has to read at a glance to someone whose eyes are on the cat. */
  #newBadge {
    position: absolute; right: calc(10px * var(--ss)); top: 50%;
    transform: translateY(-50%);
    background: #e5484d; color: #fff; border-radius: 999px;
    min-width: calc(15px * var(--ss)); height: calc(15px * var(--ss));
    display: flex; align-items: center; justify-content: center;
    padding: 0 calc(4px * var(--ss));
    font: 700 calc(9px * var(--ss))/1 var(--ui-font); letter-spacing: 0;
    font-variant-numeric: tabular-nums;
    box-shadow: 0 1px 3px rgba(0,0,0,.5);
  }
  #newBadge[hidden] { display: none; }

  /* THE shop scroller — the only one. Upgrades and Buildings are plain blocks
     inside it, so a single drag runs the whole shop end to end.
     `overscroll-behavior: contain` so scrolling past the end stops here instead
     of bubbling into a document-level pull-refresh. The cap is whichever is
     smaller: ~3.3 rows of list, or 46% of the viewport — the px term keeps the
     shop from swallowing a tall screen, the vh term keeps it off Hex on a short
     one. Either way the partial row peeking under the cap is the scroll
     affordance, since the scrollbar itself is hidden. Shorter lists size to
     content. */
  #shopScroll {
    max-height: min(calc(300px * var(--ss)), 46vh);
    overflow-y: auto; overscroll-behavior: contain;
    position: relative; transition: max-height .25s ease;
  }
  #shopScroll::-webkit-scrollbar { width: 0; }
  #shop { padding: 0; }
  /* Collapsed: the scroller shrinks to nothing, leaving the titled SHOP rail
     alone as a slim closed bar — tap it to reopen. */
  #dock.collapsed #shopScroll { max-height: 0; }
  /* CC store rows: a dark inset strip, a framed icon, name over effect, price
     green when you can afford it and red when you can't — that red/green is the
     whole readout. Affordable rows brighten rather than getting a neon glow. */
  .item {
    display: flex; align-items: center; gap: 0; width: 100%; text-align: left;
    background: transparent; border: none; border-bottom: 1px solid var(--line);
    padding: 0 calc(11px * var(--ss)) 0 0; color: var(--muted); cursor: not-allowed;
    transition: background .1s, opacity .15s; opacity: .5;
  }
  /* The wood divider right below opens with its own line, so the last row's
     would double it. Scoped to #upgrades: #shop hides `.gone` rows at both ends
     (night swaps the day list out), so its :last-child isn't a row you see. */
  #upgrades .item:last-child { border-bottom: 0; }
  /* Resting rows stay transparent so the page background shows through the
     tray; .can:active keeps a background because that's tap feedback, not
     the row's resting look. */
  .item.can { cursor: pointer; opacity: 1; }
  .item.can:active { background: rgba(255,255,255,.11); }
  .item .icon {
    /* Fixed WIDTH for every row, full row HEIGHT. Rows still vary in height
       (upgrade effect text wraps, and the one building blurb adds a line), so a
       fixed square would leave a strip of row background above and below each
       tile and turn every row boundary into five edges. Stretched, the tint is
       one unbroken column that the row lines cross cleanly; keeping the glyphs
       agreeing row-to-row is font-size's job, not the tile's. */
    flex: none; align-self: stretch;
    width: calc(36px * var(--ss));
    display: grid; place-items: center;
    margin: 0 calc(11px * var(--ss)) 0 0;
    font-size: calc(18px * var(--ss)); background: var(--icon-bg);
  }
  /* Cookie Clicker's own store-row placement: name top-left, price under it in
     the same column, quantity pulled out to its own corner on the right. */
  .item .body { flex: 1 1 auto; min-width: 0; padding: calc(5px * var(--ss)) 0; line-height: 1.08; }
  /* Building rows: the name sits alone on the top line, price under it, and for
     all but ONE building that's the whole row — so the shelf is a single row
     height (~61px at --ss 1.5), and the name has to carry the flavour by itself.
     The exception is Mouse Subscription, which keeps a .fx blurb line until you
     own one because that row is the game's onboarding (see its BUILDINGS entry).
     So exactly one row, exactly once per run, stands taller than its neighbours;
     buying your first one collapses it and the shelf is uniform from then on.
     Its per-second rate is NOT here — it lives in .right, on the same baseline as
     the owned count, so the two read as a pair (how many × how much each).
     Upgrade rows reuse .item and always show .fx; they have no rate, so .nm sits
     bare. */
  .item .titleRow { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .item .nm {
    font: 700 13.5px var(--ui-font); font-size: calc(13.5px * var(--ss)); line-height: 1.12;
    color: var(--ink); text-shadow: 0 1px 1px rgba(0,0,0,.45);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
  }
  .item .rate {
    flex: none; display: inline-flex; align-items: center; gap: 3px;
    font: 700 11px var(--ui-font); font-size: calc(9.5px * var(--ss)); color: var(--muted);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  /* Same mouse coin as .cost, shrunk down — without it "12/s" reads as a bare
     number with no unit; this is the unit. */
  .item .rate .coin { flex: none; width: calc(10px * var(--ss)); height: auto; display: block; }
  /* Every upgrade row, and the one building row with a blurb. */
  .item .fx { font: 400 11px var(--ui-font); font-size: calc(10.5px * var(--ss)); line-height: 1.1; color: var(--muted); margin-top: 1px; }
  .item .fx b { color: var(--gold); font-weight: 700; }
  /* The blurb is a pre-purchase tease: own one and the row drops to the standard
     name + rate + price. Upgrade rows never get .bought, so their effect text
     stays for as long as the row exists. */
  .item.bought .fx { display: none; }
  .item .cost {
    display: flex; align-items: center; gap: 4px;
    font: 700 14px var(--ui-font); font-size: calc(13.5px * var(--ss)); line-height: 1.04; color: var(--cost-ok);
    text-shadow: 0 1px 1px rgba(0,0,0,.5);
    font-variant-numeric: tabular-nums; white-space: nowrap;
    margin-top: calc(1px * var(--ss));
  }
  .item .cost.no { color: var(--cost-no); }
  /* The coin's fill is a literal `fill="var(--neon)"` baked into the SVG
     markup at creation, not `currentColor` — so .cost.no flipping this div's
     text color red can never touch it. See currencyIconSVG()'s comment. */
  .item .cost .coin { flex: none; width: calc(16px * var(--ss)); height: auto; display: block; }
  /* Right column: rate and owned count share a baseline so they read as one
     "output" pair. Centered in the row by .item's own align-items. */
  .item .right { flex: none; display: flex; align-items: baseline; gap: calc(5px * var(--ss)); align-self: center; }
  /* Quantity owned — its own corner, not stacked with price, and sized to read
     at a glance like CC's big count rather than as a label beside a label. */
  .item .own {
    flex: none; min-width: calc(26px * var(--ss)); text-align: right;
    font: 800 26px var(--ui-font); font-size: calc(20px * var(--ss)); line-height: 1; color: var(--dim); text-shadow: 0 1px 1px rgba(0,0,0,.45);
    font-variant-numeric: tabular-nums;
  }
  .item.can .own { color: var(--ink); }

  /* ---- Locked / teased building rows ----
     .gone  = past the tease window; not on the shelf at all.
     .locked = the one ??? teaser; price shows, everything else is masked.
     Swapping visibility in CSS means refreshShop() never writes text for a
     teased row, and the real name can't flash before the class lands. */
  .item.gone { display: none; }
  /* line-height MUST match .nm's — this swaps in for .nm's whole line, and the
     `font:` shorthand above resets line-height to `normal` (~1.63 in Baloo 2,
     not the 1.12 .nm gets). Omitting it made the ??? row 10px taller than every
     other building row, which is the one thing a masked row must not be. */
  .item .lockedNm {
    display: none; font: 700 13.5px var(--ui-font);
    font-size: calc(13.5px * var(--ss)); line-height: 1.12;
    color: var(--dim); letter-spacing: .14em;
  }
  .item .icLocked { display: none; color: var(--dim); font-weight: 800; }
  .item.locked { cursor: default; opacity: .4; }
  .item.locked .lockedNm { display: block; }
  .item.locked .icLocked { display: block; }
  .item.locked .titleRow,
  .item.locked .ic,
  .item.locked .fx,
  .item.locked .right { display: none; }

  /* ---- Upgrades strip (only unlocked-and-unbought ones exist here, so the
     list is short; buying removes the row) ----
     No padding or bottom border: the list has to reach the section edge so the
     wood divider below sits flush against the last row, and the divider already
     draws the line between them. */
  #upgradeSec { display: none; }
  #upgradeSec.show { display: block; }
  #upgrades { padding: 0; }
  .item.up { padding: 0 calc(11px * var(--ss)) 0 0; }
  .item.up .body { padding: calc(4px * var(--ss)) 0; }
  .item.up .nm { font-size: calc(12.5px * var(--ss)); }
  /* ---- Scroll shadow (locked affordance): a soft inner shadow at whichever
     edge still has content to scroll. Snug to the row edge because the scrollers
     carry no vertical padding. .can-up / .can-down are toggled by the runtime.
     One scroller, so one pair of shadows — they now mark the ends of the WHOLE
     shop rather than of each list, which is the point of merging them. ---- */
  #shopScroll::before, #shopScroll::after {
    content: ""; position: sticky; left: 0; right: 0; display: block;
    height: calc(16px * var(--ss)); pointer-events: none; z-index: 3;
  }
  #shopScroll::before {
    top: 0; margin-bottom: calc(-16px * var(--ss));
    background: linear-gradient(to bottom, rgba(0,0,0,.6), transparent); opacity: 0; transition: opacity .12s;
  }
  #shopScroll::after {
    bottom: 0; margin-top: calc(-16px * var(--ss));
    background: linear-gradient(to top, rgba(0,0,0,.6), transparent); opacity: 0; transition: opacity .12s;
  }
  #shopScroll.can-up::before { opacity: 1; }
  #shopScroll.can-down::after { opacity: 1; }
</style>

<script>
"use strict";

// ---------------------------------------------------------------------------
// BALANCE — the whole economy lives here. Base cost & mps mirror Cookie
// Clicker's first five buildings (Cursor/Grandma/Farm/Mine/Factory) so the
// pacing is a known-good starting point. All OPEN for tuning (see design doc).
// cost(n owned) = baseCost * 1.15^n   |   income = mps * count
// ---------------------------------------------------------------------------
const GROWTH = 1.15;
const BUILDINGS = [
  // The ONLY building with a blurb, and deliberately so: it's the first thing on
  // the shelf, so its .fx line is where a new player learns what "owning a
  // building" even means. Every other building inherits that lesson and gets by
  // on its name — see the .item .titleRow note for why the rest stay bare.
  //
  // {every} is substituted with the rate this building ACTUALLY earns, and the
  // token is the whole point. The blurb used to hand-write "every 2.5 seconds",
  // which is 1/mps straight off this column, and it was wrong from the moment
  // INCOME_SCALE arrived — the real rate is mps x INCOME_SCALE, and the row
  // printed that correct figure right beside the incorrect prose. Deriving it
  // (see everyText) means the two cannot disagree again whichever dial moves.
  //
  // Budget is 21 characters AFTER substitution, measured: .fx has the quoted
  // rate beside it, so 22+ wraps and the row grows to 97px against its
  // neighbours' 61px. "A mouse every second" is 20 and stays one line at an 80px
  // row. The old wrapping text is why this row used to be the tall one.
  { id: "shopper", name: "Mouse Subscription", icon: "🚚", base: 10,     mps: 0.4,
    blurb: "A mouse every {every}" },
  { id: "farm",    name: "Mouse Farm",      icon: "🌾", base: 100,    mps: 1   },
  // base 10000 and 85 mps, both tuned against the same failure. The mps column
  // mirrors Cookie Clicker's first
  // buildings, but the COST column doesn't: CC steps 15 → 100 → 1,100 → 12,000,
  // roughly ten-fold each, and ours steps 10 → 100 → 12,000 because the rung
  // between Farm and Factory (the old Quarry) was cut. That leaves the Farm a
  // hundred times cheaper than CC's at the same mps, so a Farm stays a better
  // buy than a Factory essentially forever: at CC's 47 the sim's bot bought 35
  // farms and ZERO factories, taking the whole Factory ladder and the Cardboard
  // line down with it. 85 restores the intended shape — cost-per-mps 141 against
  // the Farm's 100, close enough that the Factory is what you graduate TO once
  // farms get expensive, which is the job the missing rung used to do. It is a
  // The BASE came down from 12000 for the same reason, once the Factory ladder
  // lost two of its five rungs: a shorter ladder tops out lower, so the building
  // has to be cheaper to stock or the bot goes back to buying farms forever. At
  // 8000 it overshot the other way — factories crowded farms out and the Farm's
  // top rungs went unreachable instead. 10000 is the measured middle.
  //
  // It is a NARROW band, so re-measure if it moves: at 70 the bot still bought zero
  // factories, at 130 it bought almost nothing else.
  { id: "factory", name: "Mouse Factory",   icon: "🏭", base: 10000,  mps: 85 },
  // The one day building that keeps producing after the night reset (see
  // baseCpsWith) — the design's "the Lab is still present" in the dream.
  //
  // It is also, now, the DOOR OUT OF PHASE 1: Catnap Hypnalysis unlocks on owning
  // one. That makes its old numbers untenable. At 260 mps it was the worst
  // cost-per-mps on the rail by a factor of two and had no upgrades of its own to
  // fix that, so buying one was a straight penalty — fine when it was scenery,
  // hostile when it's the gate. 400 mps still loses the marginal comparison to a
  // Factory or a Farm carrying its upgrade stack, and that is correct: you buy
  // the Lab for what it OPENS — four cross-building upgrades, and the twist —
  // not because the arithmetic says to. It just shouldn't punish you for it.
  // Knock-on: Labs keep earning at night, so day Labs now bootstrap the dream
  // harder than the seed holes below. Watch that in the sim if this moves again.
  { id: "lab",     name: "Schrödinger's Lab",  icon: "🔬", base: 130000, mps: 400 },
  // ---- Night buildings: DREAM is the mechanism, SPACE is the secret ----------
  // The old set was Dimensional Mouse Hole / Chrono Cattelite Courier /
  // Constellation Cattery / Singularity Scratcher, which handed the answer away for
  // free: a team reads "constellation" and "singularity" off the shop rail before
  // earning anything, and the wall's whole job is to make that space imagery an
  // EARNED clue. So the buildings are dream-native now and every space reference
  // lives behind the reveal.
  //
  // They also escalate rather than just scaling: a place -> a device -> a
  // phenomenon -> a recursion, which is how dreams actually get stranger.
  //
  // SPACING IS x4, NOT the day curve's x13, and that is forced rather than chosen.
  // Petting earns nothing at night (see pet()), so night income is buildings only,
  // and a pure-building economy compounds far more slowly than one with paws in it.
  // Modelled over a 5-minute night: at x13 only TWO tiers are ever affordable, at
  // x5..x8 only three, and at x4 all four arrive — around 0:00, 0:51, 2:20 and 4:10.
  // That is also why the old set looked fine in the sim and wasn't: it was riding
  // pet income the night phase does not have.
  //
  // `gate` names the research that REVEALS the building. Reveal used to be
  // lifetime >= base, which cannot work now that the flip resets lifetime to zero
  // AND the bases are small — every tier would appear at once. Gating on a purchase
  // also means the player can see they caused it, which a silent threshold never
  // manages.
  //
  // PURCHASING IS NIGHT'S MASHING ACTION. Petting earns nothing once Hex is asleep,
  // so the repeated physical thing a player does has to become buying — which the
  // day curve actively prevents. Two numbers do that work, and both are deliberate:
  //
  //   growth 1.09, not 1.15. Cost climbs as growth^n while income from copies climbs
  //   linearly in n, so a steep curve means the gap between affordable purchases
  //   grows without bound. This is exactly what Cookie Clicker papers over with
  //   buy-10, which we do not want: the answer here is to flatten the curve so the
  //   next copy stays reachable instead of batching the taps.
  //
  //   base = 8x mps, not 33x. The ratio IS the opening wait: one Hole earns
  //   mps * INCOME_SCALE, so a base of 33x meant 12 seconds of nothing before the
  //   second Hole. At 8x the first few land about a second apart.

// ---------------------------------------------------------------------------
// STATE
// ---------------------------------------------------------------------------
const game = {
  mice: 0,          // current bank
  total: 0,         // lifetime earned (never decreases)
  clicks: 0,
  goldCaught: 0,
  owned: {},        // id -> count
  bought: {},       // upgrade key -> 1 once purchased
  unlocked: {},     // upgrade key -> 1 once revealed (sticky; never re-hides)
  // upgrade key -> 1 once you have actually LAID EYES on the row: its vertical
  // midpoint has been inside the shop's visible area. Sticky like `unlocked`,
  // and saved for the same reason — the SHOP badge counts what's missing from
  // here, so losing it on reload would light the badge up with the whole list
  // and read as a bug. Midpoint rather than any-part-visible: a row cropped to
  // a sliver by the scroller's edge hasn't been read, and the top and bottom
  // fades sit over exactly that sliver.
  seen: {},
  // Deadline only — the multiplier lives in mods (upgrades raise it), so the buff is
  // entirely described by "until when".
  zoomUntil: 0,     // timestamp ms while Zoomies (pet power x mods.zoomMult) is active
};
BUILDINGS.forEach(b => game.owned[b.id] = 0);

// ---------------------------------------------------------------------------
// SAVE / LOAD
// ---------------------------------------------------------------------------
function save() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      mice: game.mice, total: game.total, clicks: game.clicks,
      goldCaught: game.goldCaught, owned: game.owned,
      bought: game.bought, unlocked: game.unlocked, seen: game.seen,
    }));
  } catch (e) {}
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
    if (!s) return;
    game.mice = +s.mice || 0;
    game.total = +s.total || 0;
    game.clicks = +s.clicks || 0;
    game.goldCaught = +s.goldCaught || 0;
    BUILDINGS.forEach(b => game.owned[b.id] = (s.owned && +s.owned[b.id]) || 0);
    // Keyed by string, not index, so reordering/inserting upgrades can't corrupt
    // a save. Unknown keys (renamed or removed while tuning) are simply dropped.
    UPGRADES.forEach(u => {
      if (s.bought && s.bought[u.key]) game.bought[u.key] = 1;
      if (s.unlocked && s.unlocked[u.key]) game.unlocked[u.key] = 1;
      if (s.seen && s.seen[u.key]) game.seen[u.key] = 1;
    });
  } catch (e) {}
}

// ---------------------------------------------------------------------------
// ECONOMY HELPERS
// ---------------------------------------------------------------------------
// `firstFree` prices a building's FIRST copy at zero and shifts the curve down one
// step, so copy n costs base * growth^(n-1). A base of 0 could not do this — the
// curve multiplies the base, so every copy would be free forever.
//
// `growth` is per-building, defaulting to the shared GROWTH. Night uses a shallower
// curve than day on purpose; see the night block in BUILDINGS.
function costOf(b, owned) {
  if (b.firstFree && owned === 0) return 0;
  return Math.ceil(b.base * Math.pow(b.growth || GROWTH, owned - (b.firstFree ? 1 : 0)));
}

// Every bought upgrade is folded into `mods` here, and nothing else in the game
// ever asks "do I own upgrade X?" — that's the one structural thing worth
// copying from Cookie Clicker by NOT copying it (it checks Game.Has('...') by
// name from inside every building's cps, and pays for it in duplication).
// Recomputed on buy/load only, never per frame.
// Pure fold over an arbitrary (bought, owned) state, so the pacing simulator
// in the dev tools can price hypothetical futures with the REAL rules instead
// of a copy that drifts. recalc() is the thin live-game binding.
// Declared ABOVE foldMods deliberately: the zero-state `const mods = foldMods({}, ...)`
// below runs at load, and foldMods now reads NIGHT_KEYS and NIGHT_ROW_KEYS to decide
// whether a day row should contribute income. Left further down, that call hit the
// consts' temporal dead zone and threw before the rest of the file even parsed.
// The night phase is a pure function of the save — no separate flag to persist.
// Derived from the table (which upgrade DECLARES `type: "night"`) rather than
// hardcoding its key: the file's rule is that nothing asks "do I own upgrade
// X?" by name, and this was the last place that did. Array, not a single key,
// so splitting the twist across two upgrades stays a table-only edit.
const NIGHT_KEYS = UPGRADES.filter(u => [].concat(u.effect).some(e => e.type === "night")).map(u => u.key);
// The story rows: the twist and the reveal ladder behind it. Recognised by EFFECT
// rather than by key, so adding a sleep stage doesn't need a second edit here.
// Shared by the pacing simulator (which buys them on sight, since a motivated

  const seen = new Set();
  let k = u.unlock && u.unlock.requires;
  while (k && !seen.has(k)) {
    if (NIGHT_KEYS.includes(k)) return true;
    seen.add(k);
    const parent = UPGRADES.find(x => x.key === k);
    k = parent && parent.unlock && parent.unlock.requires;

// The night's own rows: the story beats plus anything gated behind the twist. Built
// once, because foldMods consults it per effect on every recalc and nightOnlyUnlock
// walks an unlock chain to answer.
const NIGHT_ROW_KEYS = new Set();
const isStoryUpgrade = u => [].concat(u.effect).some(e =>
  e.type === "night" || e.type === "trail" || e.type === "neon" ||
  e.type === "wordMice" || e.type === "persist" || e.type === "speed" ||
  e.type === "revealBuilding");
for (const u of UPGRADES) if (isStoryUpgrade(u) || nightOnlyUnlock(u)) NIGHT_ROW_KEYS.add(u.key);
function nightOf(bought) { return NIGHT_KEYS.some(k => bought[k]); }
function nightActive() { return nightOf(game.bought); }

function foldMods(bought, owned) {
  // Whether the fold is for the night phase, read from `bought` (the phase is a pure
  // function of the save) so it is available to the loop below.
  const night = NIGHT_KEYS.some(k => bought[k]);
  const m = { building: {}, globalMult: 1, clickFlat: CLICK_BASE,
              clickShare: CLICK_CPS_SHARE, clickMult: 1, goldenFreq: 1, goldenLife: 0,
              zoomMult: ZOOM_MULT, zoomTime: ZOOM_S,
              // Wall state, all of it bought rather than crossed into:
              //   neon      the points resolve into coloured mice (Counting Mice)
              //   trail     length of the inked tail (the sleep-stage ladder)
              //   wordMice  the golden letter-mice exist at all (Word of Mouse)
              //   persist   ink half-life; 0 = a rolling window (Scent Trail)
              trail: 0, neon: 0, wordMice: 0, persist: 0, speed: 0, night: 0,
              revealed: {} };
  BUILDINGS.forEach(b => m.building[b.id] = 1);
  let globalPct = 0, globalMul = 1;
  for (const u of UPGRADES) {
    if (!bought[u.key]) continue;
    // `effect` is one object OR an array of them — synergies are inherently
    // dual (Robo-Cats x2 AND Lab +1%/Robo-Cat). [].concat normalises both.
    for (const e of [].concat(u.effect)) {
      // A DAY upgrade contributes no income at night. The twist is a hard reset and a
      // separate economy: its buildings, bank and lifetime are wiped, so letting day
      // globalPct/globalMult keep multiplying night's buildings both contradicts that
      // and makes night impossible to tune — a Hole earned 1,125/s instead of 162
      // purely because of how much day research a team happened to buy, so the
      // purchase cadence varied per run and no base could be chosen for it. Golden and
      // click effects are untouched: goldens still spawn in the dream, and petting is
      // already inert there.
      const dayRowAtNight = night && !NIGHT_ROW_KEYS.has(u.key);
      if (e.type === "buildingMult") { if (!dayRowAtNight) m.building[e.building] *= e.mult; }
      else if (e.type === "globalPct") { if (!dayRowAtNight) globalPct += e.pct; }
      // Multiplicative global (Lucky Number 6's clean x6), kept separate from the
      // additive globalPct so it multiplies the whole stack instead of blending
      // into the +% sum — an honest "x6", not "+500% added to Focus".
      else if (e.type === "globalMult") { if (!dayRowAtNight) globalMul *= e.mult; }
      else if (e.type === "clickFlat") m.clickFlat += e.add;
      else if (e.type === "clickShare") m.clickShare += e.pct / 100;
      else if (e.type === "clickMult") m.clickMult *= e.mult;
      else if (e.type === "goldenFreq") m.goldenFreq *= e.mult;
      else if (e.type === "goldenLife") m.goldenLife += e.add;
      // Zoomies power and length. Both ADD to the base rather than multiplying
      // it: the buff is already a multiplier gated behind a scarce, short window,
      // so compounding it would make the golden line the only line worth buying.
      else if (e.type === "zoomMult") m.zoomMult += e.add;
      else if (e.type === "zoomTime") m.zoomTime += e.add;
      else if (e.type === "trail") m.trail += e.add;
      // Pure toggle: Counting Mice flips the wall mice on. Folded as a mod (not
      // read by name anywhere) so the same rule feeds the live wall and the sim.
      else if (e.type === "neon") m.neon = 1;
      else if (e.type === "wordMice") m.wordMice = 1;
      else if (e.type === "persist") m.persist += e.add;
      else if (e.type === "speed") m.speed += e.add;
      else if (e.type === "revealBuilding") m.revealed[e.building] = 1;
      // The twist as a folded mod too, so baseCpsWith (which only gets m + owned,
      // not bought) can enforce the dream reset. Agrees with nightOf/nightActive
      // — both derive from the same `night` effect type.
      else if (e.type === "night") m.night = 1;

      // Clicker's GrandmaSynergy, not its symmetric SynergyUpgrade): the host
      // gains per subject owned, never the reverse. Both re-derive from
      // owned on every recalc, so neither is ever persisted.
      else if (e.type === "crossBuilding") m.building[e.building] *= (1 + (e.pct / 100) * owned[e.per]);
      else if (e.type === "clickPerBuilding") m.clickFlat += e.add * owned[e.per];

}
// Seeded from the fold itself rather than a hand-written literal — the zero
// state is `foldMods` with nothing bought, so there's exactly one definition
// of what a mods object contains. (Declaration-hoisted, so calling foldMods
// here is fine.)
const mods = foldMods({}, game.owned);
function recalc() {
  Object.assign(mods, foldMods(game.bought, game.owned));
  // Word of Mouse adds nine crews to the cast, so the allocation has to be rebuilt
  // when it lands. Cheap, and only once the wall exists at all.
  if (nightInited) rebuildWallCast();
}


// Order of operations mirrors Cookie Clicker's: per-building multipliers apply
// inside the per-building term, the global multiplier applies on top, and
// timed buffs sit outside everything.
// Parameterised over (mods, owned) for the same reason foldMods is: that order
// of operations IS the economy, and the simulator used to re-state it by hand.
// baseCps()/clickGain() are the thin live-game bindings.
//
// What ONE of a building earns you right now, every multiplier folded in —
// Cookie Clicker's `storedCps * globalCpsMult`, the number its store tooltip
// quotes. The global term sits in here rather than out on the sum (distributive,
// so the total is identical) precisely so the shop can print a per-building rate
// that adds back up to the headline instead of a table constant that doesn't.
function buildingMpsWith(m, b) {
  // Dream reset: at night the daytime mouse-industry stops earning. Only the
  // Lab (which caused the dream) and the surreal night buildings still run —
  // so a day building's carried-over count sits idle until you wake. Night
  // buildings can't be owned in daylight, so no reverse guard is needed.
  // Nothing from the day earns at night any more, the Lab included — nightReset
  // wipes it, so an exemption here would pay out on buildings you no longer own.
  if (m.night && !b.night) return 0;
  return b.mps * m.building[b.id] * m.globalMult * INCOME_SCALE;
}
function baseCpsWith(m, owned) {
  let s = 0;
  for (const b of BUILDINGS) s += buildingMpsWith(m, b) * owned[b.id];
  return s;
}
// Pre-buff click value: flat + a share of income, times the click multiplier.
function clickBaseWith(m, owned) {
  return (m.clickFlat + baseCpsWith(m, owned) * m.clickShare) * m.clickMult;
}
function baseCps() { return baseCpsWith(mods, game.owned); }
// Zoomies is the only buff and it multiplies PETS, so mice/s has no buffed

function zoomBuff() { return performance.now() < game.zoomUntil ? mods.zoomMult : 1; }
function clickGain() {
  // DEV.teamMult is 1 outside ?debug — simulates the 4-player room this game
  // actually ships for, since solo dev testing can't reproduce "four people
  // tapping" any other way.
  return clickBaseWith(mods, game.owned) * zoomBuff() * DEV.teamMult;
}

// ---------------------------------------------------------------------------
// UPGRADE UNLOCK / TEXT
// ---------------------------------------------------------------------------
// Pure predicate against any game-shaped state (the simulator passes its own);
// isUnlocked() adds the live game's stickiness on top.
// `unlock.owned` is one [id, n] pair OR an array of them (AND-ed). Sniffing
// the first element's type keeps every existing single-pair row working.
// Shared with unlockText() so the fiddly bit has one definition.
const ownedPairs = c => (typeof c.owned[0] === "string" ? [c.owned] : c.owned);
function unlockMet(u, s) {
  const c = u.unlock;
  if (c.owned) {
    for (const [id, n] of ownedPairs(c)) if (s.owned[id] < n) return false;
  }
  if (c.total != null && s.total < c.total) return false;
  if (c.clicks != null && s.clicks < c.clicks) return false;
  if (c.golden != null && s.goldCaught < c.golden) return false;
  if (c.requires && !s.bought[c.requires]) return false;
  return true;
}
function isUnlocked(u) {
  if (game.unlocked[u.key]) return true;   // sticky
  if (!unlockMet(u, game)) return false;
  game.unlocked[u.key] = 1;
  return true;
}

const buildingName = id => (BUILDINGS.find(b => b.id === id) || { name: id }).name;
// Every row's description is DERIVED — there is no per-upgrade flavor override.
// Cookie Clicker's convention: the description states the effect and nothing
// else, and the joke lives in the NAME. A flavor field here didn't sit beside
// the numbers, it replaced them (`if (u.fx) return u.fx`), which split the shop
// into 27 rows of pure vibes and 18 rows of pure arithmetic. If a row needs a
// joke, retitle it — don't reintroduce an override, or the numbers vanish again.
//
// Must map over the array form, not read `.type` off it — an array's .type is
// undefined, which would hit `default` and render a blank effect line.
function effectText(u) {
  return [].concat(u.effect).map(oneEffectText).filter(Boolean).join(" · ");
}
// Word-form only reads naturally for small round multipliers ("twice/thrice
// as good") — Cookie Clicker's own convention. Percentages skip it entirely:
// they're usually additive across many stacking sources, where "+5%" stays
// legible in a way "twice, and twice again" doesn't. Words run to six because
// the live set uses ×4 (Import Direct, Swatter Drones) and ×6 (Lucky
// Number 6), and "is ×4 as good" / "×6 as many" read like a typo mid-sentence.

  ({ 2: "twice", 3: "thrice", 4: "four times", 5: "five times", 6: "six times" })[m] || `×${m}`;

const hl = s => `<b>${s}</b>`;
function oneEffectText(e) {
  switch (e.type) {

    case "globalPct":    return `+${hl(e.pct + "%")} mice per second`;
    case "globalMult":   return `${hl(cap(multWord(e.mult)))} as many mice per second`;
    case "clickFlat":    return `+${hl(fmt(e.add))} per pet`;
    case "clickShare":   return `+${hl(e.pct + "%")} of your /s per pet`;
    case "clickMult":    return `Petting is ${hl(multWord(e.mult))} as strong`;
