    const sampled = tr.polys.map(p => resamplePoly(p, 6)).filter(p => p.length > 1);

function rebuildCast(seed) {
  cast = [];
  const wordCrews = [], scenCrews = [];
  CREWS.forEach((c, idx) => (c.kind === 'word' ? wordCrews : scenCrews).push(idx));
  const PAD = 14;
  const weights = scenCrews.map(i => CREWS[i].len + PAD);
  const wSum = weights.reduce((a, b) => a + b, 0) || 1;
  const assigned = scenCrews.map(() => 0);
  let wordOrdinal = 0, scenOrdinal = 0;
  for (let i = 0; i < BAL.maxMice; i++) {
    const rng = mulberry32(seed + i * 7919);
    const m = { i, p01: rng() };
    if (rng() * 100 < BAL.yellowPct && wordCrews.length) {
      m.crew = wordCrews[wordOrdinal++ % wordCrews.length];
    } else if (scenCrews.length) {
      scenOrdinal++;
      let bi = 0, bd = -Infinity;
      for (let k = 0; k < scenCrews.length; k++) {
        const deficit = scenOrdinal * (weights[k] / wSum) - assigned[k];
        if (deficit > bd) { bd = deficit; bi = k; }
      }
      assigned[bi]++;
      m.crew = scenCrews[bi];
    } else m.crew = 0;
    m.color = CREWS[m.crew].color;
    cast.push(m);
  }
  const byCrew = new Map();
  for (const m of cast) {
    if (!byCrew.has(m.crew)) byCrew.set(m.crew, []);
    byCrew.get(m.crew).push(m);
  }
  for (const members of byCrew.values())
    members.forEach((m, k) => { m.phase = k / members.length; });

  const x = dir > 0 ? -30 + (W + 60) * u : W + 30 - (W + 60) * u;

  simT += dt * (zoomOn() ? 2 : 1);
  const t = simT;

  const econDt = dt * G.timeScale;
  if (G.started) { G.runMs += econDt; G.econMs += econDt; }
  const gain = mps() * econDt / 1000;
  G.mice += gain; G.lifetime += gain;

  // wall mice: climbing on is a pure function of lifetime neon mice earned
  while (G.onWall < BAL.maxMice && G.lifetime >= nextClimbAt()) {
    G.onWall++;
    const p = posAt(cast[G.onWall - 1], t);
    addRing(p.x, p.y, cast[G.onWall - 1].color);
    G.wallFlash = now;
    if (!G.toasts.climb1) { G.toasts.climb1 = true; toast('a mouse crept onto the wall'); }
    else if (G.onWall === 10 && !G.toasts.climb10) { G.toasts.climb10 = true; toast('the mice are multiplying'); }
  }
  // golden mouse scheduling
  if (!G.gold && G.started && G.econMs >= G.nextGoldAt) spawnGold(now);
  // teammates catch their slots as the mouse crosses
  let goldP = null;
  if (G.gold) {
    goldP = goldPos();
    if (goldP) for (let s = 0; s < 4; s++) {
      const frac = G.gold.mate[s];
      if (s !== G.mySeat && frac != null && frac !== Infinity && !G.gold.slots[s] && goldP.u >= frac) {
        fillSlot(s); goldP = goldPos();
      }
    }
  }

  blinkAt -= dt;
  if (blinkAt <= 0) { blinking = 140; blinkAt = 2600 + Math.random() * 2600; }
  if (blinking > 0) blinking -= dt;

  if (!W) resize();
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0a0b10'; ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#3a4356';
  for (const s of stars) {
    const p = sceneMap(s);
    ctx.globalAlpha = RM ? 0.5 : 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(t * 0.0008 + s.p));
    ctx.fillRect(p.x, p.y, 1.4, 1.4);
  }
  ctx.globalAlpha = 1;

  // wall mice + trails (the reveal)
  const trailN = BAL.trails.segs[G.trailLvl], trailDt = 80;
  const maxSeg = 16;
  const mr = Math.max(2.2, 3.1 * Math.min(1, SC.s / 0.75));
  for (let i = 0; i < G.onWall; i++) {
    const m = cast[i];
    if (trailN > 0) {
      ctx.lineWidth = 1.6; ctx.lineCap = 'round';
      let prev = posAt(m, t);
      for (let j = 1; j <= trailN; j++) {
        const p = posAt(m, t - j * trailDt);
        const far = Math.abs(p.x - prev.x) > maxSeg || Math.abs(p.y - prev.y) > maxSeg;
        if (!far) {
          ctx.globalAlpha = 0.5 * (1 - j / trailN);
          ctx.strokeStyle = m.color;
          ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(p.x, p.y); ctx.stroke();
        }
        prev = p;
      }
      ctx.globalAlpha = 1;
    }
    const p = posAt(m, t);
    drawMouse(p.x, p.y, m.color, mr);
  }

  // golden mouse + per-player slot pips
  if (goldP) {
    ctx.save();
    ctx.shadowColor = PALETTE.yellow; ctx.shadowBlur = 16;
    for (let j = 5; j >= 1; j--) {
      const u2 = Math.max(0, goldP.u - j * 0.012);
      const dir = G.gold.dir;
      const gx = dir > 0 ? -30 + (W + 60) * u2 : W + 30 - (W + 60) * u2;
      const gy = G.gold.y + Math.sin(u2 * Math.PI * 3) * 22;
      ctx.globalAlpha = 0.14 * (6 - j);
      drawMouse(gx, gy, PALETTE.yellow, 5.5);
    }
    ctx.globalAlpha = 1;
    drawMouse(goldP.x, goldP.y, PALETTE.yellow, 5.5);
    ctx.restore();
    for (let s = 0; s < 4; s++) drawSlotPip(goldP.x + (s - 1.5) * 15, goldP.y - 26, s, G.gold.slots[s], s === G.mySeat, now);
  }

  drawCat(now, t);

  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i], age = (now - r.t0) / 450;
    if (age >= 1) { rings.splice(i, 1); continue; }
    ctx.globalAlpha = 0.6 * (1 - age);
    ctx.strokeStyle = r.color; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(r.x, r.y, 6 + age * 26, 0, 6.283); ctx.stroke();
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i], age = (now - f.t0) / 750;
    if (age >= 1) { floats.splice(i, 1); continue; }
    ctx.globalAlpha = 1 - age;
    ctx.fillStyle = f.color;
    ctx.font = '800 14px -apple-system, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(f.txt, f.x, f.y - age * 34);
  }
  ctx.globalAlpha = 1;

  if (zoomOn() && !RM) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'rgba(255,212,77,.10)'); g.addColorStop(.2, 'rgba(255,212,77,0)');
    g.addColorStop(.8, 'rgba(255,212,77,0)'); g.addColorStop(1, 'rgba(255,212,77,.10)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  // reveal shimmer: a one-time gentle pulse when the word first turns legible
  if (!RM && now - G.revealT < 1600) {
    const a = 1 - (now - G.revealT) / 1600;
    const g = ctx.createRadialGradient(W / 2, SC.y + 300 * SC.s, 40, W / 2, SC.y + 300 * SC.s, W);
    g.addColorStop(0, `rgba(255,212,77,${0.18 * a})`); g.addColorStop(1, 'rgba(255,212,77,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  // HUD
  countEl.textContent = fmt(G.mice);
  const m = mps();
  cpsEl.textContent = m > 0
    ? `${fmt(m)}/s · ${fmt(perTap())}/pet · ${G.onWall} on the wall`
    : `${fmt(perTap())} per pet — tap Hex!`;
  if (now - G.wallFlash < 260) cpsEl.classList.add('flash'); else cpsEl.classList.remove('flash');
  if (zoomOn()) {
    zoomPill.classList.remove('hide');
    zoomMultEl.textContent = G.zoomMult;
    zoomS.textContent = Math.ceil((G.zoomUntil - G.econMs) / 1000);
  } else zoomPill.classList.add('hide');

  const cov = covNow();
  if (cov >= 0.5 && !G.toasts.forming) { G.toasts.forming = true; toast('the yellow mice… are they writing something?', 3400); }
  if (cov >= 0.85 && !G.revealed) {
    G.revealed = true; G.revealT = now;
    toast('the wall is clear — read the word to your proctor', 4600);
  }

  shopTick += dt;
  if (shopTick > 220) {
    shopTick = 0;
    refreshShop();
    $('covRead').textContent = cov.toFixed(2) + '× · ' +
      (cov < 0.5 ? 'hidden' : cov < 0.85 ? 'forming' : cov < 2.2 ? 'legible' : 'saturated');
    $('wallRead').textContent = G.onWall + ' / ' + BAL.maxMice;
    const s = Math.floor(G.runMs / 1000);
    $('timeRead').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    $('lifeRead').textContent = fmt(G.lifetime);
  }

  requestAnimationFrame(frame);
}
function drawSlotPip(cx, cy, seat, filled, isYou, now) {
  const p = PLAYERS[seat];
  ctx.save();
  ctx.strokeStyle = p.color; ctx.fillStyle = p.color; ctx.shadowColor = p.color;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (isYou && !filled) {
    const pulse = RM ? 1 : 0.5 + 0.5 * Math.sin(now * 0.008);
    ctx.globalAlpha = 0.35 + 0.45 * pulse; ctx.lineWidth = 1.4; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(cx, cy, 8.5 + pulse * 1.6, 0, 6.283); ctx.stroke();
  }
  ctx.globalAlpha = filled ? 0.95 : 0.32; ctx.shadowBlur = filled ? 8 : 3; ctx.lineWidth = 1.7;
  ctx.beginPath(); shapePath(ctx, cx, cy, 4.6, p.shape);
  if (filled) ctx.fill();
  ctx.stroke();
  ctx.restore();
}

// ---------- boot ----------
G = freshGame(7);
loadScene();
rebuildCast(G.seed);
buildShop();
refreshShop();
drawYouIcon();
resize();
requestAnimationFrame(frame);
</script>
