<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Goomba Glider</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❓</text></svg>">
<canvas id="c"></canvas>
<div id="rotate">
  <div class="glyph">📱</div>
  <b>Turn your phone upright</b>
  <span>Goomba Glider is played in portrait.</span>
</div>
<div id="hud" class="sheet">
  <div id="top">
    <button id="lab"><div id="dots"></div></button>
    <button id="bandbar" aria-label="clear bands"><div id="inv"></div></button>
  </div>
  <div id="hint"></div>
  <!-- THE LEVEL EDITOR'S TOOLS, top-right of the grid and only while EDITING.
       Real elements rather than canvas pills: `export` writes to the clipboard
       (which wants a real user gesture) and `figma` wants middle-click and
       open-in-new-tab to work. One wrapper so they lay out side by side and
       `.lab` hides and re-shows them together. -->
  <div id="labtools">
    <button id="export" hidden>export</button>
    <a id="figma" href="https://www.figma.com/design/vRN6Q44ReIaESP5wv8M2dI/"
       target="_blank" rel="noopener">Figma ↗</a>
  </div>
  <button id="play">▶ PLAY</button>
  <button id="help" aria-label="how to play">?</button>
  <div id="toast"></div>
  <div id="gate">
    <div id="title">

    <div class="how">
      <canvas class="scene" id="scGoal" role="img"

      <div class="cap">help Goomba <b>water</b> the <b>plant</b></div>
      <div class="pair">
        <div>
          <canvas class="scene gesture" id="scDrag" role="img"
                  aria-label="A finger drags a band out from one ledge down to a lower one and lets go."></canvas>
          <div class="cap"><b>drag</b> to place a band</div>
        </div>
        <div>
          <canvas class="scene gesture" id="scLift" role="img"
                  aria-label="A finger taps a band that is already placed, and it goes."></canvas>
          <div class="cap"><b>tap</b> it to take it back</div>
        </div>
      </div>
