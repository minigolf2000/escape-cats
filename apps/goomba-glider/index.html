<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Goomba Glider</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❓</text></svg>">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #150a2a; }
  #c { position: fixed; inset: 0; touch-action: none; -webkit-tap-highlight-color: transparent; }
  #hud { position: fixed; inset: 0; pointer-events: none;
         font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         color: #f2ecff; }
  #top { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 0; right: 0;
         display: flex; align-items: center; justify-content: space-between; padding: 0 14px; gap: 8px; }
  /* The level dots — and, once the team has CLEARED the game (or on a ?debug
     phone, which overrides that gate), the level grid's button: the strip the
     dots already sit on IS the selector, so the grid opens from the thing it
     is about instead of a second control parked down on PLAY's line. Before
     the clear the same element is an indicator and nothing else, hence the
     pointer-events and cursor reset off the global button rule — and hence
     `.cleared` toggling per snapshot (syncHud) rather than once at boot: it is
     room state, and a proctor reset takes it away again. */
  #lab { display: flex; align-items: center; gap: 4px; padding: 0;
         background: none; pointer-events: none; cursor: default; }
  #hud.cleared #lab { padding: 5px 10px; border-radius: 13px; gap: 7px;
                      background: rgba(255,255,255,.08);
                      border: 1.5px solid rgba(201,189,240,.35);
                      pointer-events: auto; cursor: pointer; }
  #hud.cleared #lab::after { content: "▦"; font-size: 12px; color: #c9bdf0; line-height: 1; }
  #dots { display: flex; gap: 4px; }
  .dot { box-sizing: border-box; width: 11px; height: 11px; border-radius: 50%;
         border: 2px solid #6b5a98; background: transparent; }
  .dot.done { border-color: #57e6c9; background: rgba(87,230,201,.4); }
  .dot.cur  { background: #ffd166; border-color: #ffd166; box-shadow: 0 0 10px rgba(255,209,102,.7); }
  #inv { display: flex; gap: 4px; }
  #inv .band { width: 27px; height: 27px; border-radius: 8px; border: 2.5px dashed rgba(201,189,240,.4);
               box-sizing: border-box; transition: opacity .25s, transform .25s; }
  #inv .band.used { border-style: solid; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
  /* An empty slot I could fill right now — which, since the per-player quota
     is gone, is every empty slot while the room is editing: lit, and wearing
     the TEAM's colour, set inline because only the client knows its team. Off
     the edit phase they keep the faded rule above, so the row says "not now"
     without ever changing size — this is presentation, never layout. */
  #inv .band.open { box-shadow: 0 0 10px rgba(255,255,255,.18); }
  /* #lvl (the level's name) is gone, so #hint is the first prose line under
     the dots/slots row. It sits below the clear-bands chip's line (30px row +
     6px gap + 30px chip = 66px) with the same ~14px clearance every other gap
     here keeps, even though the two never show text at once today (#clear is
     edit-phase only, #hint's only text is the win banner) — a phase that isn't
     mutually exclusive later shouldn't have to rediscover this collision. */
  #hint { position: absolute; top: calc(max(10px, env(safe-area-inset-top)) + 80px); left: 0; right: 0;
          text-align: center; font-size: 13px; color: #c9bdf0; text-shadow: 0 2px 6px rgba(0,0,0,.7); padding: 0 20px; }
  /* There is no roster line. Player NAMES are never drawn in this game — the
     four of them are in one living room, so who is here is answered by looking
     up, and a name on the HUD (or on a teammate's anchor) only ever said what
     the room already knew. The lobby still keeps names for the proctor's
     board; nothing on this screen renders one. */
  button { pointer-events: auto; font: inherit; border: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #play { position: absolute; right: 16px; bottom: max(16px, env(safe-area-inset-bottom));
          min-width: 118px; height: 56px; border-radius: 28px; font-size: 19px; font-weight: 800;
          color: #1b0f38; background: linear-gradient(180deg, #67f2d4, #3fd4b4);
          box-shadow: 0 6px 18px rgba(87,230,201,.35), inset 0 -3px 0 rgba(0,0,0,.15); letter-spacing: .03em; }
  #play.stop { background: linear-gradient(180deg, #ff7ec1, #ff5db1); box-shadow: 0 6px 18px rgba(255,93,177,.35), inset 0 -3px 0 rgba(0,0,0,.15); }
  #play.next { background: linear-gradient(180deg, #ffe08a, #ffd166); box-shadow: 0 6px 18px rgba(255,209,102,.4), inset 0 -3px 0 rgba(0,0,0,.15); }
  /* CLEAR sits on its own line, centred under the slots it empties. Being out
     of #top's row is what lets it say "clear bands" at every width: in the row
     it competed with the dot strip, which grows by a dot every time a level
     ships and by ~40px again when the team earns the selector's plate, and the
     words lost that fight below 390px.
     It is ABSOLUTE inside #bandbar, so the row's right-hand group is exactly
     the four slots wide no matter what the label says — the slots stay flush
     to the edge, and a longer word can never push them off centre. The title
     stack below is parked 36px lower to leave this line clear whether the chip
     is showing or not; nothing here is in flow, so nothing moves when it
     hides. 30px tall keeps the 44px touch target in a ::before pad rather than
     in padding.
     One tap wipes, with no confirm, even though it takes the WHOLE ROOM's
     bands: the four players are in one living room, so a clear nobody wanted is
     answered out loud in a second and the bands go back down. */
  #bandbar { position: relative; }
  #clear { position: absolute; top: calc(100% + 6px); left: 50%;
           transform: translateX(-50%); box-sizing: border-box;
           height: 30px; padding: 0 12px; border-radius: 15px;
           display: flex; align-items: center; font-size: 11px; font-weight: 700;
           letter-spacing: .02em; white-space: nowrap; line-height: 1;
           color: #c9bdf0; background: rgba(255,255,255,.08);
           border: 1.5px solid rgba(201,189,240,.35);
           transition: opacity .18s, transform .12s; }
  #clear::before { content: ""; position: absolute; inset: -9px; border-radius: 24px; }
  #clear:active { transform: translateX(-50%) scale(.94); }
  #clear.hide { visibility: hidden; opacity: 0; pointer-events: none; }
  /* levels open: the grid is the whole screen; tap a card to leave */
  #hud.lab > * { visibility: hidden; }
  /* ...except the way back to where levels come from. The grid is drawn on the
     canvas, but this is a real <a>: middle-click, open-in-new-tab and the
     browser's own popup rules all work, which a canvas hit-target would have to
     reimplement badly. Only while EDITING — a team using the grid as its
     free-play menu has no use for the design file. */
  #figma { position: absolute; top: max(10px, env(safe-area-inset-top)); right: 14px;
           display: none; padding: 5px 10px; border-radius: 13px;
           font-size: 12px; font-weight: 700; letter-spacing: .02em;
           color: #c9bdf0; text-decoration: none; pointer-events: auto;
           background: rgba(255,255,255,.08);
           border: 1.5px solid rgba(201,189,240,.35); }
  #hud.lab.editing #figma { display: block; visibility: visible; }
  /* The splash a cleared room lands on (phase "splash", see goomba/sim.ts):
     a blank screen whose ONLY control is the level selector the clear just
     unlocked — so the strip stays up and the rest of the HUD goes. Same
     visibility idiom as .lab above, so nothing here moves any layout; the
     :not(.lab) keeps the grid a whole screen when it opens from here. */
  #hud.splash > * { visibility: hidden; }
  #hud.splash:not(.lab) #top, #hud.splash:not(.lab) #lab { visibility: visible; }
  #hud.splash #inv { visibility: hidden; }
  #toast { position: absolute; left: 50%; top: 40%; transform: translate(-50%,-50%) scale(.9);
           background: rgba(20,10,45,.92); border: 2px solid #ffd166; color: #ffe9b3;
           padding: 14px 26px; border-radius: 18px; font-size: 20px; font-weight: 800; text-align: center;
           opacity: 0; transition: opacity .18s, transform .18s; white-space: nowrap; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #toast.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  #conn { position: absolute; left: 50%; top: max(10px, env(safe-area-inset-top));
          transform: translateX(-50%); background: rgba(255,93,177,.92); color: #fff;
          padding: 6px 14px; border-radius: 14px; font-size: 12px; font-weight: 700;
          display: none; }
  #conn.on { display: block; }

  /* The waiting-room gate — the same contract as hex-clicker's: a phone the
     proctor hasn't sorted yet waits here (and is already on the proctor's
     board, because watching the lobby registers it).

     It is also the HOW-TO-PLAY sheet, and those are one screen rather than two
     on purpose. The four sentences that used to fill it were read once, by
     whoever happened to be looking while they waited, and nothing ever brought
     them back; what is here instead is two PICTURES, drawn by the game itself
     (`drawSheet` in main.js) out of the same code that draws the level — so a
     player is shown the exact art they are about to touch, and a can in the
     picture cannot drift from a can in the game. `?` bottom-left re-opens the
     same sheet mid-party: `.help` is that second wearing, dismissible, with
     the connection lines swapped for the way out. */
  #gate { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
          justify-content: center; gap: 12px; background: rgba(13,6,30,.86); pointer-events: auto;
          text-align: center; padding: 24px; }
  #gate.hidden { display: none; }
  #gate h1 { margin: 0; font-size: clamp(30px, 8vw, 48px); letter-spacing: .01em;
             background: linear-gradient(90deg, #ff5db1, #ffd166, #57e6c9); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #gate .how { display: flex; flex-direction: column; align-items: center; gap: 6px;
               width: 100%; max-width: 340px; }
  /* The two pictures. Their SIZE lives here and nowhere else — main.js reads
     clientWidth/clientHeight and matches the backing store to it at device
     pixel ratio, so a phone, a laptop and a rotation all draw sharp without a
     second copy of these numbers in the renderer. */
  #gate .scene { display: block; width: 100%; height: 104px; }
  #gate .cap { color: #c9bdf0; font-size: 13px; line-height: 1.4; margin-bottom: 6px; }
  #gate .cap b { color: #ffd166; font-weight: 700; }
  #gateStatus { color: #c9bdf0; font-size: 14px; }
  #gateErr { color: #ff8f8f; font-size: 13px; min-height: 1.2em; }
  #gateClose { display: none; color: #8a80b0; font-size: 12px; }
  #gate.help #gateStatus, #gate.help #gateErr { display: none; }
  #gate.help #gateClose { display: block; }

  /* The way back to the sheet, mid-party: PLAY's own corner, mirrored. A party
     game is joined late and handed between people, so "how does this work"
     gets asked long after the waiting room is gone — and the answer is a
     button, not a tutorial nobody can replay. Quiet chrome, not a second
     PLAY: it is only ever the second thing anyone on this screen wants.
     It hides while the sheet is up (nothing to open) and goes with the rest
     of the HUD under .lab and .splash, which hide their children wholesale. */
  #help { position: absolute; left: 16px; bottom: max(16px, env(safe-area-inset-bottom));
          width: 44px; height: 44px; border-radius: 22px; font-size: 20px; font-weight: 800;
          color: #c9bdf0; background: rgba(255,255,255,.08);
          border: 1.5px solid rgba(201,189,240,.35); line-height: 1; }
  #help:active { transform: scale(.94); }
  #hud.sheet #help { visibility: hidden; }

  /* ---- PORTRAIT GATE — same rule as the prototype and hex clicker, kept in
     sync BY HAND (see the prototype's comment for the breakpoint math). ---- */
  #rotate { display: none; }
  @media (orientation: landscape) and (max-height: 520px) {
    #rotate {
      display: flex; position: fixed; inset: 0; z-index: 100;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 24px; text-align: center;
      background: #150a2a; color: #f2ecff; height: 100dvh;
      font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    #rotate .glyph { font-size: 46px; animation: rotateHint 2.2s ease-in-out infinite; }
    #rotate b { font-size: 19px; font-weight: 800; }
    #rotate span { font-size: 14px; color: #c9bdf0; max-width: 30ch; }
    #c, #hud { visibility: hidden; }
  }
  @keyframes rotateHint {
    0%, 45%, 100% { transform: rotate(0deg); }
    60%, 85% { transform: rotate(-90deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    #rotate .glyph { animation: none; }
  }
</style>
<canvas id="c"></canvas>
<div id="rotate">
  <div class="glyph">📱</div>
  <b>Turn your phone upright</b>
  <span>Goomba Glider is played in portrait.</span>
</div>
<div id="hud" class="sheet">
  <div id="top">
    <button id="lab"><div id="dots"></div></button>
    <div id="bandbar">
      <div id="inv"></div>
      <button id="clear" class="hide" aria-label="clear all bands">clear bands</button>
    </div>
  </div>
  <div id="hint"></div>
  <div id="conn">reconnecting…</div>
  <a id="figma" href="https://www.figma.com/design/vRN6Q44ReIaESP5wv8M2dI/"
     target="_blank" rel="noopener">Figma ↗</a>
  <button id="play">▶ PLAY</button>
  <button id="help" aria-label="how to play">?</button>
  <div id="toast"></div>
  <div id="gate">
    <h1>GOOMBA GLIDER</h1>
    <div class="how">
      <canvas class="scene" id="scGoal" role="img"
              aria-label="Goomba rides past every watering can and home to her spider plant."></canvas>
      <div class="cap">every <b>watering can</b>, then home to the <b>plant</b></div>
      <canvas class="scene" id="scBands" role="img"
              aria-label="A silly band laid across a gap carries her over it; another is being stretched into place ahead of her."></canvas>
      <div class="cap">lay your <b>4 silly bands</b> to help her along</div>
    </div>
    <div id="gateStatus">Connecting…</div>
    <div id="gateErr"></div>
    <div id="gateClose">tap anywhere to close</div>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
