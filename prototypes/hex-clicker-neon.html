<script>
'use strict';
// ============================================================================
// Hex Clicker — Neon Lab. A playable single-player skin of the coop clicker,
// in the committed neon line-art theme, used to feel out four mechanics:
//   1. Mice arrive AUTOMATICALLY on lifetime-fish milestones (never purchased).
//   2. Comet Trails are a purchased track — trails are the ink of the reveal.
//   3. Click upgrades (flat multiplier + %-of-cps) keep petting relevant.
//   4. Golden mouse -> ZOOMIES. Coop version: the same golden mouse crosses
//      every phone at once (seeded from room clock); the multiplier stacks
//      per unique player who taps it, so the whole team yells and taps.
// Win condition: read the word off the wall and type it. It is never printed.
// ============================================================================

// ---------- balance (all tuning lives here, mirroring shared/balance.ts) ----------
const BAL = {
  buildings: [ // id, name, cps, base cost; cost multiplies by 1.15 per copy
    { id: 'yarn',   name: 'Ball of Yarn',       cps: 0.5, base: 15 },
    { id: 'catnip', name: 'Catnip Stash',       cps: 4,   base: 100 },
    { id: 'tower',  name: 'Cat Tower',          cps: 20,  base: 600 },
    { id: 'roomba', name: 'Roomba Rodeo',       cps: 80,  base: 3000 },
    { id: 'laser',  name: 'Laser Pointer Array', cps: 300, base: 12000 },
  ],
  costMult: 1.15,
  claws:    { costs: [80, 900, 9000] },          // pet power ×2 per level
  whiskers: { costs: [400, 2500, 15000], pct: 2 }, // pets gain +2% of cps per level
  trails:   { costs: [1200, 4500, 12000, 28000, 60000], segs: [0, 8, 16, 28, 42, 60] },
  // mouse k (1-indexed) arrives at lifetime fish = mouseBase * mouseR^(k-1)
  mouseBase: 20, mouseR: 1.094, maxMice: 90,
  gold: { firstMs: 35000, minGapMs: 40000, maxGapMs: 70000, crossMs: 4200,
          mult: 7, durMs: 12000 },
  yellowPct: 30, noise: 0.10,
  word: 'TO THE MOON',
};

const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const PALETTE = { yellow: '#ffd44d', blue: '#5fb0ff', pink: '#ff6fa5', green: '#5fe0a0', purple: '#b48cff' };
const WORD_PPMS_FRAC = 2.2e-5; // fraction of the word's ink per ms (legibility formula)
const SCENE_PPMS = 0.004;      // scenery patrol speed, tour-points per ms
const HEADER = 60, DOCK_GUESS = 172, CAT_H = 128;

function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function fmt(n) {
  if (n < 1000) return Math.floor(n).toString();
  if (n < 100000) return Math.floor(n).toLocaleString('en-US');
  if (n < 1e6) return (n / 1000).toFixed(1) + 'k';
  return (n / 1e6).toFixed(2) + 'M';
}

// ---------- reveal engine (ported from reveal-lab.html, moon scene only) ----------
function sampleLine(word) {
  const oc = document.createElement('canvas');
  const octx = oc.getContext('2d');
  const FS = 190;
  octx.font = `900 ${FS}px Arial, Helvetica, sans-serif`;
  const widths = [...word].map(ch => octx.measureText(ch).width);
  const gap = FS * 0.06;
  const totalW = widths.reduce((a, b) => a + b + gap, 0);
  oc.width = Math.ceil(totalW + 40); oc.height = Math.ceil(FS * 1.5);
  octx.font = `900 ${FS}px Arial, Helvetica, sans-serif`;
  octx.textBaseline = 'middle';
  let x = 20;
  const bounds = [];
  for (let i = 0; i < word.length; i++) {
    octx.fillText(word[i], x, oc.height / 2);
    bounds.push([x, x + widths[i]]);
    x += widths[i] + gap;
  }
  const img = octx.getImageData(0, 0, oc.width, oc.height).data;
  const pts = [], STEP = 6;
  for (let py = 0; py < oc.height; py += STEP) {
    for (let px = 0; px < oc.width; px += STEP) {
      if (img[(py * oc.width + px) * 4 + 3] > 128) {
        let letter = 0;
        for (let b = 0; b < bounds.length; b++) if (px >= bounds[b][0] - gap) letter = b;
        pts.push({ x: px, y: py, letter });
      }
    }
  }
  const byLetter = [];
  for (const p of pts) (byLetter[p.letter] = byLetter[p.letter] || []).push(p);
  const letters = [];
  for (let L = 0; L < word.length; L++) {
    const lp = byLetter[L];
    if (!lp || !lp.length) continue;
    let s = 0;
    for (let i = 1; i < lp.length; i++)
      if (lp[i].y < lp[s].y - 1 || (Math.abs(lp[i].y - lp[s].y) <= 1 && lp[i].x < lp[s].x)) s = i;
    const used = new Uint8Array(lp.length); used[s] = 1;
    const tour = [lp[s]];
    let cur = s;
    for (let step = 1; step < lp.length; step++) {
      let best = -1, bd = Infinity;
      for (let j = 0; j < lp.length; j++) {
        if (used[j]) continue;
        const d = (lp[j].x - lp[cur].x) ** 2 + (lp[j].y - lp[cur].y) ** 2;
        if (d < bd) { bd = d; best = j; }
      }
      used[best] = 1; tour.push(lp[best]); cur = best;
    }
    letters.push(tour);
  }
  return { letters, w: oc.width, h: oc.height };
}

function tracer() {
  const polys = [];
  let cur = null, tx = 0, ty = 0, rot = 0;
  const stack = [];
  const T = (x, y) => {
    const c = Math.cos(rot), s = Math.sin(rot);
    return { x: tx + x * c - y * s, y: ty + x * s + y * c };
  };
  const api = {
    polys,
    save() { stack.push([tx, ty, rot]); },
    restore() { [tx, ty, rot] = stack.pop(); },
    translate(x, y) { const p = T(x, y); tx = p.x; ty = p.y; },
    rotate(a) { rot += a; },
    moveTo(x, y) { cur = [T(x, y)]; polys.push(cur); },
    lineTo(x, y) { cur ? cur.push(T(x, y)) : api.moveTo(x, y); },
    closePath() { if (cur && cur.length) cur.push({ ...cur[0] }); },
    quadraticCurveTo(cx, cy, x, y) {
      const p0 = cur[cur.length - 1], p1 = T(cx, cy), p2 = T(x, y);
      for (let i = 1; i <= 12; i++) {
        const u = i / 12, v = 1 - u;
        cur.push({ x: v * v * p0.x + 2 * v * u * p1.x + u * u * p2.x,
                   y: v * v * p0.y + 2 * v * u * p1.y + u * u * p2.y });
      }
    },
    bezierCurveTo(ax, ay, bx, by, x, y) {
      const p0 = cur[cur.length - 1], p1 = T(ax, ay), p2 = T(bx, by), p3 = T(x, y);
      for (let i = 1; i <= 16; i++) {
        const u = i / 16, v = 1 - u;
        cur.push({ x: v ** 3 * p0.x + 3 * v * v * u * p1.x + 3 * v * u * u * p2.x + u ** 3 * p3.x,
                   y: v ** 3 * p0.y + 3 * v * v * u * p1.y + 3 * v * u * u * p2.y + u ** 3 * p3.y });
      }
    },
    arc(cx, cy, r, a0, a1, ccw) {
      let d = a1 - a0;
      if (ccw && d > 0) d -= Math.PI * 2;
      if (!ccw && d < 0) d += Math.PI * 2;
      const n = Math.max(6, Math.ceil(Math.abs(d) * r / 5));
      for (let i = 0; i <= n; i++) {
        const a = a0 + d * i / n;
        api.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
      }
    },
    ellipse(cx, cy, rx, ry, rota, a0, a1, ccw) {
      let d = a1 - a0;
      if (ccw && d > 0) d -= Math.PI * 2;
      if (!ccw && d < 0) d += Math.PI * 2;
      const n = Math.max(8, Math.ceil(Math.abs(d) * Math.max(rx, ry) / 5));
      const cr = Math.cos(rota || 0), sr = Math.sin(rota || 0);
      for (let i = 0; i <= n; i++) {
        const a = a0 + d * i / n, ex = Math.cos(a) * rx, ey = Math.sin(a) * ry;
        api.lineTo(cx + ex * cr - ey * sr, cy + ex * sr + ey * cr);
      }
    },
  };
  return api;
}
function resamplePoly(poly, sp) {
  const out = [];
  if (!poly.length) return out;
  out.push(poly[0]);
  let acc = 0;
  for (let i = 1; i < poly.length; i++) {
    const a = poly[i - 1], b = poly[i];
    const d = Math.hypot(b.x - a.x, b.y - a.y);
    if (d < 1e-6) continue;
    let pos = 0;
    while (acc + (d - pos) >= sp) {
      pos += sp - acc; acc = 0;
      out.push({ x: a.x + (b.x - a.x) * pos / d, y: a.y + (b.y - a.y) * pos / d });
    }
    acc += d - pos;
  }
  out.push(poly[poly.length - 1]);
  return out;
}
const JOIN_R = 9;
function components(polys) {
  const n = polys.length;
  const parent = [...Array(n).keys()];
  const find = a => parent[a] === a ? a : (parent[a] = find(parent[a]));
  const touch = (a, b) => {
    const ends = [a[0], a[a.length - 1]];
    for (const e of ends) for (const p of b)
      if ((e.x - p.x) ** 2 + (e.y - p.y) ** 2 <= JOIN_R * JOIN_R) return true;
    return false;
  };
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++)
    if (find(i) !== find(j) && (touch(polys[i], polys[j]) || touch(polys[j], polys[i])))
      parent[find(j)] = find(i);
  const groups = new Map();
  for (let i = 0; i < n; i++) {
    const r = find(i);
    if (!groups.has(r)) groups.set(r, []);
    groups.get(r).push(polys[i]);
  }
  return [...groups.values()].map(g => {
    const restList = [...g];
    let chain = restList.shift();
    const outPolys = [chain];
    while (restList.length) {
      const tail = outPolys[outPolys.length - 1];
      const end = tail[tail.length - 1];
      let bi = 0, brev = false, bd = Infinity;
      restList.forEach((p, i) => {
        const d0 = (p[0].x - end.x) ** 2 + (p[0].y - end.y) ** 2;
        const d1 = (p[p.length - 1].x - end.x) ** 2 + (p[p.length - 1].y - end.y) ** 2;
        if (d0 < bd) { bd = d0; bi = i; brev = false; }
        if (d1 < bd) { bd = d1; bi = i; brev = true; }
      });
      const nxt = restList.splice(bi, 1)[0];
      outPolys.push(brev ? [...nxt].reverse() : nxt);
    }
    return outPolys.flat();
  });
}
function star4(x, cx, cy, r) {
  x.moveTo(cx, cy - r); x.quadraticCurveTo(cx, cy, cx + r, cy);
  x.quadraticCurveTo(cx, cy, cx, cy + r); x.quadraticCurveTo(cx, cy, cx - r, cy);
  x.quadraticCurveTo(cx, cy, cx, cy - r);
}

const MOON_SCENE = {
  lines: [{ text: 'TO THE', cx: 195, cy: 262, size: 40 }, { text: 'MOON', cx: 195, cy: 322, size: 48 }],
  elements: [
    { color: 'blue', draw(x) {
      x.moveTo(84, 396); x.bezierCurveTo(210, 350, 330, 300, 312, 152);
      x.moveTo(22, 500); x.bezierCurveTo(70, 150, 300, 66, 374, 176);
      x.moveTo(326, 552); x.arc(310, 552, 15, 0, 6.283);
      x.moveTo(340, 552); x.ellipse(310, 552, 30, 8, -0.32, 0, 6.283);
    } },
    { color: 'green', draw(x) {
      x.moveTo(94, 96); x.ellipse(70, 96, 24, 8, 0, 0, 6.283);
      x.moveTo(82, 90); x.arc(70, 90, 12, 3.14, 0);

let CREWS = [], WORD_LEN = 0, cast = [];
function loadScene() {
  CREWS = []; WORD_LEN = 0;
  for (const ln of MOON_SCENE.lines) {
    const s = sampleLine(ln.text);
    const scale = ln.size / 190;
    for (const letterTour of s.letters) {
      const tour = letterTour.map(p => ({
        x: ln.cx + (p.x - s.w / 2) * scale,
        y: ln.cy + (p.y - s.h / 2) * scale,
      }));
      CREWS.push({ color: PALETTE.yellow, tour, len: tour.length, kind: 'word' });
      WORD_LEN += tour.length;
    }
  }
  for (const e of MOON_SCENE.elements) {
    const tr = tracer(); e.draw(tr);
    const sampled = tr.polys.map(p => resamplePoly(p, 6)).filter(p => p.length > 1);
    for (const compTour of components(sampled)) {
      CREWS.push({ color: PALETTE[e.color], tour: compTour, len: compTour.length, kind: 'scenery' });
    }
  }
}
function rebuildCast(seed) {
  cast = [];
  const wordCrews = [], scenCrews = [];
  CREWS.forEach((c, idx) => (c.kind === 'word' ? wordCrews : scenCrews).push(idx));
  const PAD = 14;
  const weights = scenCrews.map(i => CREWS[i].len + PAD);
  const wSum = weights.reduce((a, b) => a + b, 0) || 1;
  const assigned = scenCrews.map(() => 0);
  let wordOrdinal = 0, scenOrdinal = 0;
  for (let i = 0; i < BAL.maxMice; i++) {
    const rng = mulberry32(seed + i * 7919);
    const m = { i, p01: rng() };
    if (rng() * 100 < BAL.yellowPct && wordCrews.length) {
      m.crew = wordCrews[wordOrdinal++ % wordCrews.length];
    } else if (scenCrews.length) {
      scenOrdinal++;
      let bi = 0, bd = -Infinity;
      for (let k = 0; k < scenCrews.length; k++) {
        const deficit = scenOrdinal * (weights[k] / wSum) - assigned[k];
        if (deficit > bd) { bd = deficit; bi = k; }
      }
      assigned[bi]++;
      m.crew = scenCrews[bi];
    } else m.crew = 0;
    m.color = CREWS[m.crew].color;
    cast.push(m);
  }
  const byCrew = new Map();
  for (const m of cast) {
    if (!byCrew.has(m.crew)) byCrew.set(m.crew, []);
    byCrew.get(m.crew).push(m);
  }
  for (const members of byCrew.values())
    members.forEach((m, k) => { m.phase = k / members.length; });
}

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0;
const SC = { x: 0, y: HEADER, s: 1 };
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 3);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const availH = Math.max(200, H - HEADER - DOCK_GUESS - CAT_H + 34); // cat overlaps the wall a bit
  SC.s = Math.min(W / 390, availH / 620);
  SC.x = (W - 390 * SC.s) / 2;
  SC.y = HEADER + Math.max(0, (availH - 620 * SC.s) / 2);
}
addEventListener('resize', resize);
function sceneMap(p) { return { x: SC.x + p.x * SC.s, y: SC.y + p.y * SC.s }; }
function wander(i, t, amp) {
  const a = i * 12.9898, b = i * 78.233;
  return {
    x: amp * (Math.sin(t * 0.00051 + a) * 0.6 + Math.sin(t * 0.00113 + b) * 0.4),
    y: amp * (Math.sin(t * 0.00047 + b * 1.7) * 0.6 + Math.sin(t * 0.00131 + a * 0.6) * 0.4),
  };
}
function posAt(m, t) {
  const crew = CREWS[m.crew];
  const L = crew.len;
  if (L < 2) return sceneMap(crew.tour[0] || { x: 195, y: 310 });
  const ppms = crew.kind === 'word' ? WORD_PPMS_FRAC * WORD_LEN : SCENE_PPMS;
  const cyc = 2 * (L - 1);
  let f = ((t * ppms + m.phase * cyc) % cyc + cyc) % cyc;
  if (f > L - 1) f = cyc - f;
  const idx = Math.min(L - 2, Math.floor(f)), frac = f - idx;
  const a = sceneMap(crew.tour[idx]), b = sceneMap(crew.tour[idx + 1]);
  const w = wander(m.i, t, BAL.noise * 90 * SC.s * (crew.kind === 'word' ? 0.5 : 0.3));
  return { x: a.x + (b.x - a.x) * frac + w.x, y: a.y + (b.y - a.y) * frac + w.y };
}
function drawMouse(x, y, color, r) {
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.ellipse(x, y, r * 1.25, r, 0, 0, 6.28); ctx.fill();
  ctx.beginPath();
  ctx.arc(x - r * 0.7, y - r * 0.9, r * 0.45, 0, 6.28);
  ctx.arc(x + r * 0.1, y - r * 1.0, r * 0.45, 0, 6.28);

  ctx.strokeStyle = color; ctx.lineWidth = r * 0.28; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x + r * 1.2, y);

}
// two-pass neon stroke (from lineart-sketches.html)
function neon(color, w, fn) {
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.shadowColor = color;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.globalAlpha = 0.55; ctx.shadowBlur = 14; ctx.lineWidth = w + 1.5;

    $('stTime').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    $('stTaps').textContent = fmt(G.taps);
    $('stMice').textContent = G.mice;
    $('stFish').textContent = fmt(G.lifetime);
  } else {
    guessErr.classList.remove('hide');
    guessSheet.classList.add('shake');
    setTimeout(() => guessSheet.classList.remove('shake'), 450);
  }
}
$('submitBtn').addEventListener('click', tryGuess);
guessInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryGuess(); });
$('againBtn').addEventListener('click', () => {
  const seed = (G.seed * 1103515245 + 12345) >>> 0;
  G = freshGame(seed);
  rebuildCast(seed);
  overlay.classList.add('hide');
  refreshShop();
});

// ---------- dev panel ----------
$('devBtn').addEventListener('click', () => $('dev').classList.toggle('hide'));
$('tscale').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  G.timeScale = +b.dataset.v;
  [...$('tscale').children].forEach(c => c.classList.toggle('on', c === b));
});
$('grant').addEventListener('click', () => { G.fish += 5000; G.lifetime += 5000; refreshShop(); });
$('resetBtn').addEventListener('click', () => {
  G = freshGame(G.seed); rebuildCast(G.seed);
  [...$('tscale').children].forEach((c, i) => c.classList.toggle('on', i === 0));
  refreshShop();
});

// ---------- main loop ----------
let simT = 0, last = performance.now(), shopTick = 0;
function frame(now) {
  const dt = Math.min(100, now - last); last = now;
  simT += dt * (zoomOn() ? 2 : 1);
  const t = simT;

  if (!G.won) {
    const econDt = dt * G.timeScale;
    if (G.started) { G.runMs += econDt; G.econMs += econDt; }
    const gain = rawCps() * (zoomOn() ? BAL.gold.mult : 1) * econDt / 1000;
    G.fish += gain; G.lifetime += gain;
    // mice milestones: arrival is a pure function of lifetime fish
    while (G.mice < BAL.maxMice && G.lifetime >= nextMouseAt()) {
      G.mice++;
      const p = posAt(cast[G.mice - 1], t);
      addRing(p.x, p.y, cast[G.mice - 1].color);
      miceStat.classList.remove('bump'); void miceStat.offsetWidth; miceStat.classList.add('bump');
      if (!G.toasts.mouse1) { G.toasts.mouse1 = true; toast('a mouse crept in to watch'); }
      else if (G.mice === 10 && !G.toasts.mice10) { G.toasts.mice10 = true; toast('the mice are multiplying'); }
    }
    // golden mouse scheduling
    if (!G.gold && G.started && G.econMs >= G.nextGoldAt) {
      G.gold = { t0: now, y: SC.y + (0.12 + Math.random() * 0.5) * 620 * SC.s,
                 dir: Math.random() < 0.5 ? 1 : -1 };
    }
  }

  // blink bookkeeping
  blinkAt -= dt;
  if (blinkAt <= 0) { blinking = 140; blinkAt = 2600 + Math.random() * 2600; }
  if (blinking > 0) blinking -= dt;

  if (!W) resize();
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0a0b10'; ctx.fillRect(0, 0, W, H);

  // stars
  ctx.fillStyle = '#3a4356';
  for (const s of stars) {
    const p = sceneMap(s);
    ctx.globalAlpha = RM ? 0.5 : 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(t * 0.0008 + s.p));
    ctx.fillRect(p.x, p.y, 1.4, 1.4);
  }
  ctx.globalAlpha = 1;

  // mice + trails (the reveal wall)
  const trailN = BAL.trails.segs[G.trailLvl], trailDt = 80;
  const maxSeg = 16;
  const mr = Math.max(2.2, 3.1 * Math.min(1, SC.s / 0.75));
  for (let i = 0; i < G.mice; i++) {
    const m = cast[i];
    if (trailN > 0) {
      ctx.lineWidth = 1.6; ctx.lineCap = 'round';
      let prev = posAt(m, t);
      for (let j = 1; j <= trailN; j++) {
        const p = posAt(m, t - j * trailDt);
        const far = Math.abs(p.x - prev.x) > maxSeg || Math.abs(p.y - prev.y) > maxSeg;
        if (!far) {
          ctx.globalAlpha = 0.5 * (1 - j / trailN);
          ctx.strokeStyle = m.color;
          ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(p.x, p.y); ctx.stroke();
        }
        prev = p;
      }
      ctx.globalAlpha = 1;
    }
    const p = posAt(m, t);
    drawMouse(p.x, p.y, m.color, mr);
  }

  // golden mouse
  if (G.gold && !G.won) {
    const gp = goldPos();
    if (gp) {
      ctx.save();
      ctx.shadowColor = PALETTE.yellow; ctx.shadowBlur = 16;
      for (let j = 5; j >= 1; j--) {
        const u2 = Math.max(0, gp.u - j * 0.012);
        const dir = G.gold.dir;
        const gx = dir > 0 ? -30 + (W + 60) * u2 : W + 30 - (W + 60) * u2;
        const gy = G.gold.y + Math.sin(u2 * Math.PI * 3) * 22;
        ctx.globalAlpha = 0.14 * (6 - j);
        drawMouse(gx, gy, PALETTE.yellow, 5.5);
      }
      ctx.globalAlpha = 1;
      drawMouse(gp.x, gp.y, PALETTE.yellow, 5.5);
      ctx.restore();
    }
  }

  drawCat(now, t);

  // rings + floats
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i], age = (now - r.t0) / 450;
    if (age >= 1) { rings.splice(i, 1); continue; }
    ctx.globalAlpha = 0.6 * (1 - age);
    ctx.strokeStyle = r.color; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(r.x, r.y, 6 + age * 26, 0, 6.283); ctx.stroke();
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i], age = (now - f.t0) / 750;
    if (age >= 1) { floats.splice(i, 1); continue; }
    ctx.globalAlpha = 1 - age;
    ctx.fillStyle = f.color;
    ctx.font = '800 14px -apple-system, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(f.txt, f.x, f.y - age * 34);
  }
  ctx.globalAlpha = 1;

  // zoomies edge glow
  if (zoomOn() && !RM) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'rgba(255,212,77,.10)'); g.addColorStop(.2, 'rgba(255,212,77,0)');
    g.addColorStop(.8, 'rgba(255,212,77,0)'); g.addColorStop(1, 'rgba(255,212,77,.10)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  // HUD
  fishEl.textContent = fmt(G.fish);
  const cps = rawCps() * (zoomOn() ? BAL.gold.mult : 1);
  cpsEl.textContent = cps > 0
    ? `${fmt(cps)} fish/s · ${fmt(perTap())} per pet`
    : `${fmt(perTap())} fish per pet — pet Hex!`;
  miceNEl.textContent = G.mice;
  if (zoomOn()) {
    zoomPill.classList.remove('hide');
    zoomS.textContent = Math.ceil((G.zoomUntil - G.econMs) / 1000);
  } else zoomPill.classList.add('hide');

  const cov = covNow();
  if (cov >= 0.5 && !G.won) {
    readBtn.classList.remove('hide');
    if (!G.toasts.forming) { G.toasts.forming = true; toast('the yellow mice… are they writing something?', 3400); }
  } else readBtn.classList.add('hide');

  shopTick += dt;
  if (shopTick > 220) {
    shopTick = 0;
    refreshShop();
    $('covRead').textContent = cov.toFixed(2) + '× · ' +
      (cov < 0.5 ? 'hidden' : cov < 0.85 ? 'forming' : cov < 2.2 ? 'legible' : 'saturated');
    $('lifeRead').textContent = fmt(G.lifetime);
  }

  requestAnimationFrame(frame);
}

// ---------- boot ----------
G = freshGame(7);
loadScene();
rebuildCast(G.seed);
buildShop();
refreshShop();
resize();
requestAnimationFrame(frame);
</script>
