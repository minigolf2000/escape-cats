<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Goomba Glider</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❓</text></svg>">
<canvas id="c"></canvas>
<div id="rotate">
  <div class="glyph">📱</div>
  <b>Turn your phone upright</b>
  <span>Goomba Glider is played in portrait.</span>
</div>
<div id="hud" class="sheet">
  <div id="top">
    <button id="lab"><div id="dots"></div></button>
    <div id="bandbar">
      <div id="inv"></div>
      <button id="clear" class="hide" aria-label="clear all bands">clear bands</button>
    </div>
  </div>
  <div id="hint"></div>
  <div id="conn">reconnecting…</div>
  <a id="figma" href="https://www.figma.com/design/vRN6Q44ReIaESP5wv8M2dI/"
     target="_blank" rel="noopener">Figma ↗</a>
  <button id="play">▶ PLAY</button>
  <button id="help" aria-label="how to play">?</button>
  <div id="toast"></div>
  <div id="gate">
    <div id="title">
      <h1>GOOMBA GLIDER</h1>
      <canvas id="scTitle" aria-hidden="true"></canvas>
    </div>
    <div class="how">
      <canvas class="scene" id="scGoal" role="img"
              aria-label="Goomba rolls downhill past every watering can and home to her spider plant."></canvas>
      <div class="cap">help Goomba <b>water</b> the <b>plant</b></div>
      <canvas class="scene" id="scBands" role="img"
              aria-label="A silly band laid across a gap carries her over it; another is being stretched into place ahead of her."></canvas>
      <div class="cap">using your <b>4 bands</b></div>
    </div>
    <div id="gateStatus">Connecting…</div>
    <div id="gateErr"></div>
    <div id="gateClose">tap anywhere to close</div>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
