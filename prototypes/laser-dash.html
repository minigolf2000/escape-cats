<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Laser Dash</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0e0f14; }
  #c { position: fixed; inset: 0; touch-action: none; -webkit-tap-highlight-color: transparent; }
</style>
<canvas id="c"></canvas>
<script>
'use strict';
// ---------- Laser Dash — Hex chases the red dot down a neon street. Tap = jump, tap again = double jump. ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

let W = 0, H = 0, u = 4;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  u = W / 100;
}
window.addEventListener('resize', resize);
resize();

const GROUND = () => H * 0.78;
const PX = () => W * 0.26;
const GRAV = 340, JUMP = 112;          // units/s^2, units/s

let state, dist, speed, py, vy, jumps, phase, obstacles, treats, lasers, parts, nextOb, nextTreat, nextLaser, frenzy, score, best, tGlobal, tOver, deathSpin;
best = +(localStorage.getItem('laserdash.best') || 0);

// far skyline is generated once (deterministic enough)
const skyline = [];
{ let x = 0, i = 0;
  while (x < 260) { const w = 9 + (i * 53 % 14), h = 16 + (i * 37 % 30); skyline.push({ x, w, h, s: i * 7 % 5 }); x += w + 2 + (i * 31 % 5); i++; }
}
const SIGNS = ['#ff3b6b', '#3dd6d0', '#b48cff', '#ffd76b'];

function reset() {
  state = 'ready';
  dist = 0; speed = 40; py = 0; vy = 0; jumps = 0; phase = 0;
  obstacles = []; treats = []; lasers = []; parts = [];
  nextOb = 60; nextTreat = 90; nextLaser = 480;
  frenzy = 0; score = 0; tGlobal = 0; tOver = 0; deathSpin = 0;
}

function spawn() {
  // obstacles
  if (dist > nextOb) {
    const r = Math.random(), x = 115;
    if (r < 0.42) obstacles.push({ type: 'cuke', x, w: 4.5, h: 6.5, dx: 0 });
    else if (r < 0.72) obstacles.push({ type: 'roomba', x: x + 10, w: 11, h: 4.5, dx: -14 });
    else if (r < 0.9) obstacles.push({ type: 'boxes', x, w: 8, h: 13, dx: 0 });
    else obstacles.push({ type: 'cone', x, w: 6, h: 8.5, dx: 0 });
    nextOb = dist + 42 + Math.random() * 34 + speed * 0.25;
  }
  // treats: little arcs of fish
  if (dist > nextTreat) {
    const n = 3 + (Math.random() * 3 | 0), baseH = Math.random() < 0.5 ? 6 : 16;
    for (let i = 0; i < n; i++) treats.push({ x: 115 + i * 6.5, h: baseH + Math.sin(i / (n - 1) * Math.PI) * 7 });
    nextTreat = dist + 120 + Math.random() * 120;
  }
  // the red dot
  if (dist > nextLaser) {
    lasers.push({ x: 115, h: 2.2, t: 0 });
    nextLaser = dist + 550 + Math.random() * 400;
  }
}

function jump() {
  if (jumps === 0 && py === 0) { vy = JUMP; jumps = 1; puff(); }
  else if (jumps === 1) { vy = JUMP * 0.92; jumps = 2; puff(); }
}
function puff() {
  for (let i = 0; i < 6; i++) parts.push({ x: PX() / u + (Math.random() * 4 - 2), h: py + Math.random() * 2, vx: -10 - Math.random() * 8, vh: Math.random() * 6, life: 0.5, c: 'rgba(200,210,255,0.5)' });
}
function sparkle(xu, hu, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, s = 8 + Math.random() * 16;
    parts.push({ x: xu, h: hu, vx: Math.cos(a) * s, vh: Math.sin(a) * s, life: 0.7, c: color });
  }
}

function press() {
  if (state === 'ready') { state = 'play'; return; }
  if (state === 'play') { jump(); return; }
  if (state === 'over' && tOver > 0.7) { reset(); state = 'play'; }
}
window.addEventListener('pointerdown', e => { e.preventDefault(); press(); }, { passive: false });
window.addEventListener('keydown', e => { if (e.code === 'Space') press(); });

function die() {
  if (frenzy > 0) return;
  state = 'over';
  score = Math.floor(score);
  if (score > best) { best = score; localStorage.setItem('laserdash.best', best); }
  sparkle(PX() / u, py + 4, '#ff3b6b', 20);
}

function step(dt) {
  tGlobal += dt;
  if (state === 'over') { tOver += dt; deathSpin += dt * 9; vy -= GRAV * dt; py = Math.max(0, py + vy * dt); }
  for (const p of parts) { p.x += p.vx * dt; p.h += p.vh * dt; p.vh -= 30 * dt; p.life -= dt * 1.6; }
  parts = parts.filter(p => p.life > 0);
  if (state !== 'play') return;

  speed = Math.min(88, speed + dt * 0.55);
  const fr = frenzy > 0 ? 1.18 : 1;
  const move = speed * fr * dt;
  dist += move;
  score += move * 0.12 * (frenzy > 0 ? 2 : 1);
  if (frenzy > 0) frenzy -= dt;
  phase += dt * (10 + speed * 0.12);

  // player physics
  vy -= GRAV * dt;
  py += vy * dt;
  if (py <= 0) { py = 0; vy = 0; jumps = 0; }

  spawn();
  for (const o of obstacles) o.x += (o.dx || 0) * dt - move;
  for (const t of treats) t.x -= move;
  for (const l of lasers) { l.x -= move * 0.82; l.t += dt; l.h = 2.2 + Math.abs(Math.sin(l.t * 3)) * 9; }
  obstacles = obstacles.filter(o => o.x > -20);
  treats = treats.filter(t => t.x > -10 && !t.got);
  lasers = lasers.filter(l => l.x > -10 && !l.got);

  // collisions (forgiving insets)
  const pxu = PX() / u, pw = 4.6, ph = 6.4, pb = py, pt = py + ph;
  for (const o of obstacles) {
    if (pxu + pw / 2 > o.x - o.w / 2 + 1 && pxu - pw / 2 < o.x + o.w / 2 - 1 && pb < o.h - 0.8 && pt > 0.5) {
      if (frenzy > 0) { o.dead = true; sparkle(o.x, o.h / 2, '#ffd76b', 12); score += 25; }
      else { die(); return; }
    }
  }
  obstacles = obstacles.filter(o => !o.dead);
  for (const t of treats) {
    if (Math.abs(t.x - pxu) < 4 && Math.abs(t.h - (py + 3)) < 5) {
      t.got = true; score += 10; sparkle(t.x, t.h, '#3dd6d0', 6);
    }
  }
  for (const l of lasers) {
    if (Math.abs(l.x - pxu) < 5 && l.h < py + 8) {
      l.got = true; frenzy = 4.5; sparkle(l.x, l.h, '#ff3b6b', 24);
    }
  }
}

// ---------- drawing ----------
function groundY(hu) { return GROUND() - hu * u; }

function drawBG() {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND());
  g.addColorStop(0, '#0b0c12'); g.addColorStop(0.7, '#131522'); g.addColorStop(1, '#1c1e30');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // sparse stars
  ctx.fillStyle = '#c8ccec';
  for (let i = 0; i < 40; i++) {
    const sxp = ((i * 61.7 - dist * 0.03) % 104 + 104) % 104 - 2;
    const syp = (i * 37.3 % 60) * 0.011 * H;
    ctx.globalAlpha = 0.18 + 0.22 * Math.abs(Math.sin(tGlobal * 1.3 + i * 2.1));
    ctx.fillRect(sxp * u, syp, 0.35 * u, 0.35 * u);
  }
  ctx.globalAlpha = 1;
  // moon sliver
  ctx.fillStyle = '#d8d4e8'; ctx.globalAlpha = 0.8;
  ctx.beginPath(); ctx.arc(W * 0.82, H * 0.1, 3.6 * u, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#0b0c12'; ctx.beginPath(); ctx.arc(W * 0.82 - 1.4 * u, H * 0.1 - 0.8 * u, 3.1 * u, 0, 6.28); ctx.fill();
  ctx.globalAlpha = 1;
  // far skyline (slow parallax)
  const off1 = (dist * 0.12) % 260;
  ctx.fillStyle = '#171927';
  for (const b of skyline) {
    let bx = b.x - off1; if (bx < -30) bx += 260;
    ctx.fillRect(bx * u, GROUND() - b.h * u, b.w * u, b.h * u);
    if (b.s < 2) { // a lit window or two
      ctx.fillStyle = 'rgba(255,215,107,0.35)';
      ctx.fillRect((bx + 2) * u, GROUND() - (b.h - 3) * u, 1.4 * u, 2 * u);
      ctx.fillStyle = '#171927';
    }
  }
  // mid layer: darker buildings with neon signs
  const off2 = (dist * 0.38) % 190;
  for (let i = 0; i < 5; i++) {
    let bx = i * 38 - off2; if (bx < -40) bx += 190;
    const bh = 34 + (i * 23 % 18);
    ctx.fillStyle = '#101220';
    ctx.fillRect(bx * u, GROUND() - bh * u, 26 * u, bh * u);
    const c = SIGNS[i % SIGNS.length];
    ctx.fillStyle = c; ctx.globalAlpha = 0.85;
    ctx.fillRect((bx + 3) * u, GROUND() - (bh - 4) * u, 8 * u, 2.4 * u);
    ctx.globalAlpha = 0.14;
    ctx.fillRect((bx + 1) * u, GROUND() - (bh - 2.5) * u, 12 * u, 5.5 * u);
    ctx.globalAlpha = 1;
  }
  // street
  ctx.fillStyle = '#14151d'; ctx.fillRect(0, GROUND(), W, H - GROUND());
  // curb glow line — the signature accent
  const lg = ctx.createLinearGradient(0, GROUND(), 0, GROUND() + 3 * u);
  lg.addColorStop(0, frenzy > 0 ? '#ff3b6b' : '#3dd6d0'); lg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = lg; ctx.fillRect(0, GROUND(), W, 3 * u);
  // dashed lane markings scrolling
  ctx.strokeStyle = 'rgba(220,225,255,0.14)'; ctx.lineWidth = 1 * u;
  ctx.setLineDash([7 * u, 9 * u]); ctx.lineDashOffset = (dist * u) % (16 * u);
  ctx.beginPath(); ctx.moveTo(0, GROUND() + 9 * u); ctx.lineTo(W, GROUND() + 9 * u); ctx.stroke();
  ctx.setLineDash([]);
  // lamp posts (full speed layer)
  const off3 = (dist * 1) % 90;
  for (let i = 0; i < 3; i++) {
    let lx = i * 45 - off3 + 10; if (lx < -10) lx += 90;
    ctx.strokeStyle = '#232636'; ctx.lineWidth = 1.2 * u;
    ctx.beginPath(); ctx.moveTo(lx * u, GROUND()); ctx.lineTo(lx * u, GROUND() - 30 * u); ctx.lineTo((lx + 5) * u, GROUND() - 30 * u); ctx.stroke();
    ctx.fillStyle = '#ffd76b';
    ctx.beginPath(); ctx.arc((lx + 5) * u, GROUND() - 29 * u, 1 * u, 0, 6.28); ctx.fill();
    const gl = ctx.createRadialGradient((lx + 5) * u, GROUND() - 29 * u, 0, (lx + 5) * u, GROUND() - 29 * u, 12 * u);
    gl.addColorStop(0, 'rgba(255,215,107,0.14)'); gl.addColorStop(1, 'rgba(255,215,107,0)');
    ctx.fillStyle = gl;
    ctx.fillRect((lx - 8) * u, GROUND() - 42 * u, 26 * u, 44 * u);
  }
}

function drawHex() {
  const x = PX(), y = groundY(py);
  ctx.save();
  ctx.translate(x, y);
  if (state === 'over') ctx.rotate(deathSpin);
  const run = py === 0 && state === 'play';
  const bob = run ? Math.sin(phase * 2) * 0.5 * u : 0;
  if (frenzy > 0) {
    ctx.shadowColor = `hsl(${(tGlobal * 300) % 360}, 90%, 60%)`;
    ctx.shadowBlur = 14;
  }
  // tail
  ctx.strokeStyle = '#232032'; ctx.lineWidth = 1.7 * u; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-2.6 * u, -3 * u + bob);
  ctx.quadraticCurveTo(-6 * u, -4 * u + bob, -6.4 * u, -7.5 * u + Math.sin(phase) * 1.2 * u);
  ctx.stroke();
  // body (stretch in air)
  const stretch = py > 0 ? 1.15 : 1;
  ctx.fillStyle = '#232032';
  ctx.beginPath(); ctx.ellipse(0, -4.4 * u + bob, 3.6 * u * stretch, 2.7 * u / Math.sqrt(stretch), 0, 0, 6.28); ctx.fill();
  // head
  ctx.beginPath(); ctx.arc(2.9 * u, -6.6 * u + bob, 2.3 * u, 0, 6.28); ctx.fill();
  // ears
  ctx.beginPath();
  ctx.moveTo(1.4 * u, -8 * u + bob); ctx.lineTo(1.7 * u, -10.4 * u + bob); ctx.lineTo(3 * u, -8.7 * u + bob);
  ctx.moveTo(3.5 * u, -8.7 * u + bob); ctx.lineTo(4.5 * u, -10.2 * u + bob); ctx.lineTo(4.9 * u, -8.2 * u + bob);
  ctx.fill();
  ctx.shadowBlur = 0;
  // legs
  ctx.strokeStyle = '#232032'; ctx.lineWidth = 1.3 * u;
  if (py === 0) {
    for (let i = 0; i < 4; i++) {
      const a = phase * 2 + i * 1.6, lx = (-1.8 + i * 1.3) * u, swing = Math.sin(a) * 1.6 * u;
      ctx.beginPath(); ctx.moveTo(lx, -2.6 * u + bob); ctx.lineTo(lx + swing, 0); ctx.stroke();
    }
  } else { // tucked
    ctx.beginPath(); ctx.moveTo(-1.6 * u, -2.4 * u); ctx.lineTo(-0.4 * u, -1.2 * u);
    ctx.moveTo(1.4 * u, -2.4 * u); ctx.lineTo(2.4 * u, -1.4 * u); ctx.stroke();
  }
  // glowing eyes
  ctx.fillStyle = frenzy > 0 ? '#ff3b6b' : '#3dd6d0';
  ctx.shadowColor = frenzy > 0 ? '#ff3b6b' : '#3dd6d0'; ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(2.5 * u, -6.9 * u + bob, 0.42 * u, 0, 6.28);
  ctx.arc(3.9 * u, -6.9 * u + bob, 0.42 * u, 0, 6.28);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();
  // running shadow
  ctx.globalAlpha = Math.max(0.05, 0.22 - py * 0.008);
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(x, GROUND() + 1 * u, 4.4 * u, 1 * u, 0, 0, 6.28); ctx.fill();
  ctx.globalAlpha = 1;
}

function drawObstacle(o) {
  const x = o.x * u, base = GROUND();
  if (o.type === 'cuke') {
    ctx.fillStyle = '#5fae4e';
    ctx.save(); ctx.translate(x, base - o.h * u / 2); ctx.rotate(-0.2);
    ctx.beginPath(); ctx.ellipse(0, 0, 1.9 * u, o.h * u / 2, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#4a8c3c';
    ctx.beginPath(); ctx.ellipse(-0.5 * u, 0, 0.8 * u, o.h * u / 2.4, 0, 0, 6.28); ctx.fill();
    ctx.restore();
  } else if (o.type === 'roomba') {
    ctx.fillStyle = '#3a3f55';
    ctx.beginPath(); ctx.roundRect(x - o.w * u / 2, base - o.h * u, o.w * u, o.h * u, 2 * u); ctx.fill();
    ctx.fillStyle = '#ff3b6b';
    ctx.beginPath(); ctx.arc(x, base - o.h * u + 1.4 * u, 0.55 * u, 0, 6.28); ctx.fill();
    ctx.fillStyle = 'rgba(220,225,255,0.2)';
    ctx.fillRect(x - o.w * u / 2 + 1 * u, base - 1.2 * u, o.w * u - 2 * u, 0.6 * u);
  } else if (o.type === 'boxes') {
    ctx.fillStyle = '#8a6a3f';
    ctx.beginPath();
    ctx.roundRect(x - 4 * u, base - 6.5 * u, 8 * u, 6.5 * u, 0.5 * u);
    ctx.roundRect(x - 3.2 * u, base - 13 * u, 6.4 * u, 6.5 * u, 0.5 * u);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 0.5 * u;
    ctx.strokeRect(x - 4 * u, base - 6.5 * u, 8 * u, 6.5 * u);
    ctx.strokeRect(x - 3.2 * u, base - 13 * u, 6.4 * u, 6.5 * u);
  } else { // cone
    ctx.fillStyle = '#e8853d';
    ctx.beginPath();
    ctx.moveTo(x - 3 * u, base); ctx.lineTo(x, base - o.h * u); ctx.lineTo(x + 3 * u, base);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillRect(x - 1.6 * u, base - o.h * u * 0.45, 3.2 * u, 1.1 * u);
  }
}

function drawTreat(t) {
  const x = t.x * u, y = groundY(t.h);
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(tGlobal * 3 + t.x) * 0.2);
  ctx.fillStyle = '#3dd6d0';
  ctx.beginPath();
  ctx.ellipse(0, 0, 2 * u, 1.1 * u, 0, 0, 6.28); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(1.7 * u, 0); ctx.lineTo(3 * u, -1 * u); ctx.lineTo(3 * u, 1 * u); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#0e0f14';
  ctx.beginPath(); ctx.arc(-0.8 * u, -0.2 * u, 0.22 * u, 0, 6.28); ctx.fill();
  ctx.restore();
}

function drawLaser(l) {
  const x = l.x * u, y = groundY(l.h);
  const g = ctx.createRadialGradient(x, y, 0, x, y, 6 * u);
  g.addColorStop(0, 'rgba(255,59,107,0.7)'); g.addColorStop(1, 'rgba(255,59,107,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 6 * u, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#ff3b6b'; ctx.shadowColor = '#ff3b6b'; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.arc(x, y, 1.3 * u, 0, 6.28); ctx.fill();
  ctx.shadowBlur = 0;
}

function render() {
  drawBG();
  for (const o of obstacles) drawObstacle(o);
  for (const t of treats) drawTreat(t);
  for (const l of lasers) drawLaser(l);
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life * 1.4);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x * u, groundY(p.h), 0.7 * u, 0, 6.28); ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawHex();

  const F = s => `${s} -apple-system, "Segoe UI", system-ui, sans-serif`;
  ctx.textAlign = 'center';
  if (state === 'ready') {
    ctx.fillStyle = '#f2f0fa';
    ctx.font = F(`800 ${9 * u}px`); ctx.fillText('LASER DASH', W / 2, H * 0.28);
    ctx.fillStyle = '#ff3b6b';
    ctx.font = F(`600 ${3.8 * u}px`); ctx.fillText('tap to jump · tap again to double-jump', W / 2, H * 0.34);
    ctx.fillStyle = '#3dd6d0';
    ctx.fillText('catch the red dot for a frenzy', W / 2, H * 0.39);
    ctx.fillStyle = 'rgba(242,240,250,0.55)';
    ctx.fillText(`best · ${best}`, W / 2, H * 0.44);
    if (Math.sin(tGlobal * 4) > -0.2) {
      ctx.fillStyle = '#f2f0fa'; ctx.font = F(`700 ${4.5 * u}px`);
      ctx.fillText('TAP TO RUN', W / 2, H * 0.58);
    }
  } else {
    ctx.fillStyle = frenzy > 0 ? '#ff3b6b' : '#f2f0fa';
    ctx.font = F(`800 ${8 * u}px`);
    ctx.fillText(Math.floor(score), W / 2, H * 0.11);
    if (frenzy > 0) {
      ctx.font = F(`700 ${3.4 * u}px`);
      ctx.fillText(`FRENZY ${frenzy.toFixed(1)}`, W / 2, H * 0.145);
    }
  }
  if (state === 'over' && tOver > 0.4) {
    ctx.fillStyle = 'rgba(11,12,18,0.75)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#f2f0fa';
    ctx.font = F(`800 ${7 * u}px`); ctx.fillText('WIPEOUT!', W / 2, H * 0.35);
    ctx.font = F(`700 ${5 * u}px`); ctx.fillText(Math.floor(score), W / 2, H * 0.43);
    ctx.fillStyle = '#3dd6d0';
    ctx.font = F(`600 ${3.6 * u}px`);
    ctx.fillText(score >= best ? 'new best!' : `best · ${best}`, W / 2, H * 0.48);
    if (tOver > 0.9 && Math.sin(tGlobal * 4) > -0.2) {
      ctx.fillStyle = '#f2f0fa'; ctx.font = F(`700 ${4.2 * u}px`);
      ctx.fillText('tap to run again', W / 2, H * 0.6);
    }
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  step(dt);
  render();
  requestAnimationFrame(frame);
}
reset();
requestAnimationFrame(frame);
</script>
