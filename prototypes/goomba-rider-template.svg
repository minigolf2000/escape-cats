<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <!-- Goomba Rider level template — 390 x 844 (portrait phone), 1 world unit = 4.0 px.
       Duplicate this frame per level, edit the terrain, export SVG, drag onto the game.
       Layers named guide/note/frame/bg are ignored by the importer. -->
  <rect id="bg" width="390" height="844" fill="#180d31"/>

  <!-- rulers: the distances that decide whether a level needs a band -->
  <g id="guide-rulers" stroke="#b18bff" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="5 7">
    <line id="guide-band-max-232px" x1="20" y1="600" x2="252" y2="600"/>
    <line id="guide-gap-jumpable-180px" x1="20" y1="640" x2="200" y2="640"/>
    <line id="guide-height-gain-204px" x1="340" y1="680" x2="340" y2="476"/>
  </g>
  <g id="note-ruler-labels" fill="#b18bff" fill-opacity="0.8" font-family="Inter, system-ui, sans-serif" font-size="10">
    <text x="20" y="592">one band reaches 58u = 232px</text>
    <text x="20" y="632">she clears ~45u = 180px bare,</text>
    <text x="20" y="664">so 180–232px is the one-band window</text>
    <text x="332" y="480" text-anchor="end">51u = 204px:</text>
    <text x="332" y="493" text-anchor="end">the most she can climb</text>
  </g>

  <!-- the starter level: roll off the lip, a gap too wide to clear, cake on the far ledge.
       Bare, she drops into the pit; one band across the gap wins. Re-verify with 🧪 after editing. -->
  <polyline id="terrain-start-ramp" points="20,30 100,100" stroke="#c9bdf0" stroke-width="3"/>
  <circle id="start" cx="40" cy="38" r="9" fill="#ff5db1"/>

  <polyline id="terrain-cake-ledge" points="310,120 378,120" stroke="#c9bdf0" stroke-width="3"/>
  <circle id="goal" cx="340" cy="112" r="10" fill="#ffd166"/>

  <polyline id="terrain-pit" points="60,760 195,830 330,760" stroke="#c9bdf0" stroke-width="3"/>

  <!-- the intended solution: one band, lip to lip. Powers the 🧪 verify button. -->
  <line id="sol-1" x1="100" y1="100" x2="310" y2="120" stroke="#57e6c9" stroke-width="2" stroke-opacity="0.6"/>
</svg>
