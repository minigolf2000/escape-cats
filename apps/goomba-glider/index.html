<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Goomba Glider</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❓</text></svg>">
<canvas id="c"></canvas>
<div id="rotate">
  <div class="glyph">📱</div>
  <b>Turn your phone upright</b>
  <span>Goomba Glider is played in portrait.</span>
</div>
<div id="hud" class="sheet">
  <div id="top">
    <button id="lab"><div id="dots"></div></button>
    <button id="bandbar" aria-label="clear bands"><div id="inv"></div></button>
  </div>
  <div id="hint"></div>
  <!-- WHO IS HERE: one name per line, standing on PLAY's line at the right —
       see #team in styles.css for why a column and why no plate. A direct child
       of #hud so the levels grid and the finale hide it with everything else. -->
  <div id="team"></div>
  <div id="conn">reconnecting…</div>
  <a id="figma" href="https://www.figma.com/design/vRN6Q44ReIaESP5wv8M2dI/"
     target="_blank" rel="noopener">Figma ↗</a>
  <button id="play">▶ PLAY</button>
  <button id="help" aria-label="how to play">?</button>
  <div id="toast"></div>
  <div id="gate" class="quiet">
    <div id="title">
      <!-- Two words STACKED, ColecoVision-style, each span one row of the
           logo wearing its half of the spectrum (see "#gate h1" in
           styles.css). The h1 still reads "GOOMBA GLIDER" to a screen
           reader — block boundaries are spaces. -->
      <h1><span>GOOMBA</span><span>GLIDER</span></h1>
      <canvas id="scTitle" aria-hidden="true"></canvas>
    </div>
    <div class="how">
      <canvas class="scene" id="scGoal" role="img"
              aria-label="Goomba rolls downhill past every watering can and home to her spider plant."></canvas>
      <div class="cap">help Goomba <b>water</b> the <b>plant</b></div>
      <div class="pair">
        <div>
          <canvas class="scene gesture" id="scDrag" role="img"
                  aria-label="A finger drags a band out from one ledge down to a lower one and lets go."></canvas>
          <div class="cap"><b>drag</b> to place a band</div>
        </div>
        <div>
          <canvas class="scene gesture" id="scLift" role="img"
                  aria-label="A finger taps a band that is already placed, and it goes."></canvas>
          <div class="cap"><b>tap</b> it to take it back</div>
        </div>
      </div>
    </div>
    <!-- THE CONNECTION LINES, pinned to the bottom of the gate rather than
         standing at the end of the centred column. Their box is still reserved
         in every state (see #gateStatus in styles.css) — but reserved DOWN
         HERE, so the two lines nobody normally sees stop counting toward what
         the pictures are centred on, and a phone that cannot reach the room
         says so where a phone puts its status. -->
    <div id="gateLines">
      <div id="gateStatus">Connecting…</div>
      <div id="gateErr"></div>
    </div>
    <!-- THE WAY OUT, in the slot the connection lines vacate the moment the
         room is live. The sheet is opaque now, so nothing else on the screen
         says it is a layer over a game — see #gateTap in styles.css. It is
         invisible until a tap actually does something. -->
    <div id="gateTap">tap to continue</div>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
