<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" fill="none">
  <!-- Goomba Rider stencil sheet — every element the SVG importer understands, drawn to
       scale for a 390 x 844 level frame (1 world unit = 4.0 px). Make each one a Figma
       component, then instance them into level frames.
       KEEP THIS SHEET ON ITS OWN FIGMA PAGE: these are real elements, so exporting it
       alongside a level would import the whole palette as part of that level. -->
  <rect id="bg" width="900" height="720" fill="#180d31"/>
  <g id="note-title" fill="#f2ecff" font-family="Inter, system-ui, sans-serif">
    <text x="40" y="46" font-size="18" font-weight="700">Goomba Rider — level stencils</text>
    <text x="40" y="68" font-size="12" fill="#c9bdf0">1 world unit = 4.0 px · layer name decides what it becomes · anything else with a stroke is terrain</text>
  </g>

  <!-- point elements -->
  <circle id="start" cx="90" cy="150" r="9" fill="#ff5db1"/>
  <circle id="goal" cx="290" cy="150" r="10" fill="#ffd166"/>
  <circle id="plant" cx="500" cy="150" r="7" fill="#57e6c9"/>
  <circle id="guide-plant-pickup-radius" cx="500" cy="150" r="30" stroke="#57e6c9" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 5"/>
  <circle id="bumper" cx="720" cy="150" r="7" fill="#ff5db1"/>
  <circle id="guide-bumper-kick-radius" cx="720" cy="150" r="22" stroke="#ff5db1" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 5"/>

  <g id="note-point-labels" fill="#c9bdf0" font-family="Inter, system-ui, sans-serif" font-size="12">
    <text x="90" y="196" text-anchor="middle">start</text>
    <text x="90" y="212" text-anchor="middle" fill="#7d6fa8">sit it just above a slope</text>
    <text x="290" y="196" text-anchor="middle">goal / cake</text>
    <text x="290" y="212" text-anchor="middle" fill="#7d6fa8">locked until every plant is got</text>
    <text x="500" y="196" text-anchor="middle">plant / snake</text>
    <text x="500" y="212" text-anchor="middle" fill="#7d6fa8">7.5u pickup radius</text>
    <text x="720" y="196" text-anchor="middle">bumper / piñata</text>
    <text x="720" y="212" text-anchor="middle" fill="#7d6fa8">5.5u, radial kick that adds energy</text>
  </g>

  <!-- terrain -->
  <polyline id="terrain-slope" points="40,300 150,344 250,336 330,372" stroke="#c9bdf0" stroke-width="3"/>
  <line id="wall" x1="420" y1="286" x2="420" y2="386" stroke="#c9bdf0" stroke-width="3"/>
  <line id="cushion" x1="560" y1="340" x2="660" y2="340" stroke="#57e6c9" stroke-width="5"/>
  <g id="note-terrain-labels" fill="#c9bdf0" font-family="Inter, system-ui, sans-serif" font-size="12">
    <text x="40" y="412">terrain — any stroked line (curves get flattened)</text>
    <text x="420" y="412" text-anchor="middle">wall</text>
    <text x="420" y="428" text-anchor="middle" fill="#7d6fa8">kills horizontal speed</text>
    <text x="610" y="412" text-anchor="middle">cushion</text>
    <text x="610" y="428" text-anchor="middle" fill="#7d6fa8">its top edge bounces, restitution &gt; 1</text>
  </g>

  <!-- lines whose length is a value -->
  <line id="pop" x1="40" y1="500" x2="232" y2="500" stroke="#ffd166" stroke-width="3"/>
  <path id="note-pop-arrow" d="M232 500 L220 493 M232 500 L220 507" stroke="#ffd166" stroke-width="3"/>
  <line id="sol-1" x1="40" y1="580" x2="272" y2="580" stroke="#b18bff" stroke-width="2.5" stroke-dasharray="7 6"/>
  <g id="note-line-labels" fill="#c9bdf0" font-family="Inter, system-ui, sans-serif" font-size="12">
    <text x="40" y="484">pop — start = position, direction = aim, length = power (192px shown = full; under 96px is min)</text>
    <text x="40" y="564">sol / band — the intended solution, one line per band (232px = the 58u a band can span)</text>
  </g>

  <!-- ignored layers -->
  <g id="guide-ignored-demo" stroke="#3a2a63" stroke-width="2" stroke-dasharray="5 6">
    <rect id="guide-example-box" x="40" y="630" width="120" height="50"/>
    <line id="note-example-line" x1="180" y1="655" x2="300" y2="655"/>
  </g>
  <text id="note-ignored-label" x="320" y="660" fill="#7d6fa8" font-family="Inter, system-ui, sans-serif" font-size="12">guide / note / frame / bg layers are skipped on import</text>
</svg>
