<!--
  Hex the cat — "faithful sticker" direction. Source of truth for Figma sync:
  edit in Figma, export SVG, paste the result over this file (and the copy
  inlined in hex-clicker.html's #catWrap), keeping these element ids so the
  JS animation hooks in hex-clicker.html keep working:
    #head        — main silhouette + keyline (fill + stroke)
    #eyeLeft/#eyeRight       — negative-space eye shapes (blink scales these)
    #irisLeft/#irisRight     — iris dots
    #mouth, #whiskers        — static features
  A raw Figma export won't carry these ids unless the layers are named
  exactly this way — if a fresh export drops them, re-add the id="..."
  attributes below by hand before wiring it back into hex-clicker.html.
-->
<svg id="hexCat" width="200" height="210" viewBox="0 0 200 210" fill="none" xmlns="http://www.w3.org/2000/svg">
