<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Hex Clicker</title>
<!--
  Hex Clicker — v1 single-player prototype.

  A deliberately faithful Cookie Clicker clone reskinned as the Escape Cats
  neon line-art world: pet Hex the cat, she bats a neon mouse toy, you collect
  NEON MICE (the currency). Spend them on five buildings that auto-generate
  mice. Classic mechanics: geometric cost curve (x1.15 per copy), per-building
  mice-per-second, bulk buy, big-number formatting, golden mouse bonuses,
  localStorage autosave.

  Why raw HTML: this is a prototype (see prototypes/README.md). Zero deps, zero
  build, edit-and-refresh. The economy lives in one plain `game` object and the
  balance in one `BUILDINGS` table, so the tuned result lifts cleanly into the
  multiplayer app (apps/hex-clicker) + packages/shared/balance.ts later.

  Design decisions this honors (see hex-clicker-design.md): neon line-art skin,
  currency = neon mice, clicking stays relevant, golden mouse = the fun spike.
  Multiplayer / reveal-wall / eras are intentionally NOT here yet — v1 is about
  finding the core clicker fun.
-->
<style>
  :root {
    --bg: #0a0b10;
    --panel: #12141b;
    --panel-hi: #171a21;
    --line: #262b36;
    --line-hi: #2f6b4f;
    --ink: #b9c2d4;
    --muted: #77808f;
    --dim: #545d6c;
    --gold: #ffd44d;
    --neon: #57e6c9;
    --neon-2: #ff5db1;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg);
    font: 500 13px -apple-system, "Segoe UI", system-ui, sans-serif; color: var(--ink);
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  }
  body {
    background:
      radial-gradient(90vw 55vh at 50% 12%, rgba(87,230,201,0.08), transparent 62%),
      var(--bg);
    display: flex; flex-direction: column;
  }

  /* ---- HUD ---- */
  #hud {
    flex: none; padding: max(12px, env(safe-area-inset-top)) 14px 6px;
    display: flex; align-items: flex-start; justify-content: space-between;
  }
  #bank { min-width: 0; }
  #count {
    font: 800 30px -apple-system, system-ui, sans-serif; color: var(--gold);
    font-variant-numeric: tabular-nums; text-shadow: 0 0 18px rgba(255,212,77,.4); line-height: 1;
  }
  #unit {
    font: 700 9px -apple-system, system-ui, sans-serif; letter-spacing: .18em;
    text-transform: uppercase; color: #8a7a3a; margin-top: 3px;
  }
  #cps { font-size: 11px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
  #cps b { color: var(--neon); font-weight: 700; }
  #menuBtn {
    flex: none; border: 1px solid var(--line); background: var(--panel-hi); color: var(--dim);
    font: 700 15px system-ui; border-radius: 9px; width: 34px; height: 34px; cursor: pointer;
  }

  /* ---- Play area ---- */
  #stage { flex: 1 1 auto; position: relative; min-height: 0; }
  #hex { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: manipulation; cursor: pointer; }
  #hint {
    position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
    color: var(--dim); font-size: 11px; letter-spacing: .04em; pointer-events: none;
    transition: opacity .4s; text-align: center;
  }

  /* floating +N numbers */
  .float {
    position: absolute; pointer-events: none; font: 800 15px -apple-system, system-ui, sans-serif;
    color: var(--gold); text-shadow: 0 0 10px rgba(255,212,77,.5); font-variant-numeric: tabular-nums;
    animation: floatUp .9s ease-out forwards; white-space: nowrap;
  }
  @keyframes floatUp {
    0% { opacity: 0; transform: translate(-50%,-4px) scale(.7); }
    18% { opacity: 1; transform: translate(-50%,-14px) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-64px) scale(1); }
  }

  /* golden mouse */
  #golden {
    position: absolute; width: 62px; height: 62px; display: none; place-items: center;
    font-size: 34px; cursor: pointer; filter: drop-shadow(0 0 14px rgba(255,212,77,.85));
    animation: goldPulse 1.1s ease-in-out infinite; z-index: 5;
  }
  @keyframes goldPulse { 0%,100% { transform: scale(1) rotate(-6deg); } 50% { transform: scale(1.14) rotate(6deg); } }

  #buff {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    background: #2a230e; border: 1px solid #6b5a1e; color: var(--gold); display: none;
    font: 800 12px system-ui; letter-spacing: .05em; padding: 6px 14px; border-radius: 999px;
    text-shadow: 0 0 10px rgba(255,212,77,.6); font-variant-numeric: tabular-nums; z-index: 4;
  }

  /* ---- Shop dock ---- */
  #dock {
    flex: none; background: var(--panel); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  #shopHead {
    display: flex; align-items: center; justify-content: space-between; padding: 8px 12px 4px;
  }
  #shopHead .lab {
    font: 700 9.5px system-ui; letter-spacing: .16em; text-transform: uppercase; color: var(--dim);
  }
  #buyToggle { display: flex; gap: 4px; }
  #buyToggle button {
    border: 1px solid var(--line); background: var(--panel-hi); color: var(--muted);
    font: 700 11px system-ui; border-radius: 7px; padding: 4px 9px; cursor: pointer; min-width: 34px;
  }
  #buyToggle button.on { border-color: var(--neon); color: var(--neon); background: rgba(87,230,201,.08); }

  #shop { max-height: 46vh; overflow-y: auto; padding: 2px 10px 10px; }
  #shop::-webkit-scrollbar { width: 0; }
  .item {
    display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
    background: var(--panel-hi); border: 1px solid var(--line); border-radius: 12px;
    padding: 9px 11px; margin-top: 7px; color: var(--muted); cursor: not-allowed;
    transition: border-color .1s, box-shadow .1s, opacity .15s; opacity: .55;
  }
  .item.can { cursor: pointer; opacity: 1; border-color: var(--line-hi); box-shadow: 0 0 14px rgba(95,224,160,.1); }
  .item.can:active { transform: scale(.985); }
  .item .icon {
    flex: none; width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center;
    font-size: 23px; background: var(--bg); border: 1px solid var(--line);
  }
  .item.can .icon { border-color: var(--line-hi); }
  .item .body { flex: 1 1 auto; min-width: 0; }
  .item .nm { font: 700 13px system-ui; color: var(--ink); }
  .item .fx { font-size: 10.5px; color: var(--muted); margin-top: 1px; }
  .item .locked { font-size: 10.5px; color: var(--dim); font-style: italic; }
  .item .buy { flex: none; text-align: right; }
  .item .cost {
    font: 700 13px system-ui; color: var(--gold); font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .item.can .cost { text-shadow: 0 0 10px rgba(255,212,77,.35); }
  .item .cost.no { color: #6b5535; }
  .item .own {
    font: 800 15px system-ui; color: var(--dim); font-variant-numeric: tabular-nums; margin-top: 2px;
  }
  .item.can .own { color: var(--ink); }
  .item .qty { font-size: 9px; color: var(--dim); letter-spacing: .1em; }

  /* ---- Menu sheet ---- */
  #sheet {
    position: fixed; inset: 0; background: rgba(4,5,8,.72); display: none; z-index: 20;
    align-items: center; justify-content: center; padding: 24px;
  }
  #sheet .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px; width: 100%; max-width: 320px;
  }
  #sheet h2 { margin: 0 0 4px; font-size: 17px; color: var(--ink); }
  #sheet p { margin: 0 0 14px; font-size: 12px; color: var(--muted); line-height: 1.5; }
  #sheet .stat { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; border-top: 1px solid var(--line); }
  #sheet .stat span:last-child { color: var(--ink); font-variant-numeric: tabular-nums; }
  #sheet .btns { display: flex; gap: 8px; margin-top: 16px; }
  #sheet button {
    flex: 1; border: 1px solid var(--line); background: var(--panel-hi); color: var(--ink);
    font: 700 12px system-ui; border-radius: 9px; padding: 10px; cursor: pointer;
  }
  #sheet button.danger { border-color: #6b2f2f; color: #ff8a8a; }
</style>

<div id="hud">
  <div id="bank">
    <div id="count">0</div>
    <div id="unit">neon mice</div>
    <div id="cps"><b>0</b> per second</div>
  </div>
  <button id="menuBtn" aria-label="Menu">⚙</button>
</div>

<div id="stage">
  <canvas id="hex"></canvas>
  <div id="buff"></div>
  <div id="golden" role="button" aria-label="Golden mouse">🐭</div>
  <div id="hint">tap Hex to collect neon mice</div>
</div>

<div id="dock">
  <div id="shopHead">
    <span class="lab">Buildings</span>
    <div id="buyToggle">
      <button data-n="1" class="on">×1</button>
      <button data-n="10">×10</button>
      <button data-n="100">×100</button>
    </div>
  </div>
  <div id="shop"></div>
</div>

<div id="sheet">
  <div class="card">
    <h2>Hex Clicker</h2>
    <p>v1 prototype. Progress autosaves to this browser.</p>
    <div class="stat"><span>Neon mice per second</span><span id="s_cps">0</span></div>
    <div class="stat"><span>Total mice earned</span><span id="s_total">0</span></div>
    <div class="stat"><span>Times petted</span><span id="s_clicks">0</span></div>
    <div class="stat"><span>Golden mice caught</span><span id="s_gold">0</span></div>
    <div class="btns">
      <button id="closeBtn">Close</button>
      <button id="resetBtn" class="danger">Reset</button>
    </div>
  </div>
</div>

<script>
"use strict";

// ---------------------------------------------------------------------------
// BALANCE — the whole economy lives here. Base cost & mps mirror Cookie
// Clicker's first five buildings (Cursor/Grandma/Farm/Mine/Factory) so the
// pacing is a known-good starting point. All OPEN for tuning (see design doc).
// cost(n owned) = baseCost * 1.15^n   |   income = mps * count
// ---------------------------------------------------------------------------
const GROWTH = 1.15;
const BUILDINGS = [
  { id: "robocat", name: "Robot Cat",       icon: "🤖", base: 15,     mps: 0.1, blurb: "Hunts mice on its own." },
  { id: "farm",    name: "Neon Mouse Farm", icon: "🌾", base: 100,    mps: 1,   blurb: "Grows mice in glowing rows." },
  { id: "quarry",  name: "Mouse Quarry",    icon: "⛏️", base: 1100,   mps: 8,   blurb: "Mines mice from raw hex." },
  { id: "factory", name: "Mouse Factory",   icon: "🏭", base: 12000,  mps: 47,  blurb: "Mass-produces neon mice." },
  { id: "lab",     name: "Science Lab",     icon: "🔬", base: 130000, mps: 260, blurb: "Synthesizes mice from theory." },
];
const CLICK_BASE = 1;           // neon mice per pet before bonuses
const CLICK_CPS_SHARE = 0.02;   // + this fraction of mps per pet (keeps petting alive)
const SAVE_KEY = "hexclicker.v1";

// ---------------------------------------------------------------------------
// STATE
// ---------------------------------------------------------------------------
const game = {
  mice: 0,          // current bank
  total: 0,         // lifetime earned (never decreases)
  clicks: 0,
  goldCaught: 0,
  owned: {},        // id -> count
  buyN: 1,
  buffUntil: 0,     // timestamp ms while a frenzy is active
  buffMult: 1,
};
BUILDINGS.forEach(b => game.owned[b.id] = 0);

// ---------------------------------------------------------------------------
// SAVE / LOAD
// ---------------------------------------------------------------------------
function save() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      mice: game.mice, total: game.total, clicks: game.clicks,
      goldCaught: game.goldCaught, owned: game.owned,
    }));
  } catch (e) {}
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
    if (!s) return;
    game.mice = +s.mice || 0;
    game.total = +s.total || 0;
    game.clicks = +s.clicks || 0;
    game.goldCaught = +s.goldCaught || 0;
    BUILDINGS.forEach(b => game.owned[b.id] = (s.owned && +s.owned[b.id]) || 0);
  } catch (e) {}
}

// ---------------------------------------------------------------------------
// ECONOMY HELPERS
// ---------------------------------------------------------------------------
function costOf(b, owned) { return Math.ceil(b.base * Math.pow(GROWTH, owned)); }
// Cost of buying `n` copies starting from `owned` (geometric series).
function bulkCost(b, owned, n) {
  let total = 0;
  for (let i = 0; i < n; i++) total += costOf(b, owned + i);
  return total;
}
function baseCps() {
  let s = 0;
  for (const b of BUILDINGS) s += b.mps * game.owned[b.id];
  return s;
}
function currentBuff() { return performance.now() < game.buffUntil ? game.buffMult : 1; }
function cps() { return baseCps() * currentBuff(); }
function clickGain() { return (CLICK_BASE + baseCps() * CLICK_CPS_SHARE) * currentBuff(); }

// ---------------------------------------------------------------------------
// NUMBER FORMATTING (Cookie-Clicker style short scale)
// ---------------------------------------------------------------------------
const UNITS = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc"];
function fmt(n) {
  if (n < 1000) return (n < 10 && n % 1 !== 0) ? n.toFixed(1) : Math.floor(n).toString();
  let u = 0;
  while (n >= 1000 && u < UNITS.length - 1) { n /= 1000; u++; }
  return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : Math.floor(n).toString()) + UNITS[u];
}

// ---------------------------------------------------------------------------
// DOM refs
// ---------------------------------------------------------------------------
const $ = s => document.querySelector(s);
const countEl = $("#count"), cpsEl = $("#cps"), shopEl = $("#shop"), stageEl = $("#stage");
const goldenEl = $("#golden"), buffEl = $("#buff"), hintEl = $("#hint");

// ---------------------------------------------------------------------------
// SHOP RENDER
// ---------------------------------------------------------------------------
let shopRows = [];
function buildShop() {
  shopEl.innerHTML = "";
  shopRows = BUILDINGS.map((b, i) => {
    const el = document.createElement("button");
    el.className = "item";
    el.innerHTML =
      `<div class="icon">${b.icon}</div>
       <div class="body"><div class="nm">${b.name}</div><div class="fx"></div></div>
       <div class="buy"><div class="cost"></div><div class="own">0</div><div class="qty"></div></div>`;
    el.addEventListener("click", () => buy(i));
    shopEl.appendChild(el);
    return {
      el, can: null,
      fx: el.querySelector(".fx"), cost: el.querySelector(".cost"),
      own: el.querySelector(".own"), qty: el.querySelector(".qty"),
    };
  });
}

// A building is visible once you could plausibly afford the previous tier
// (revealed if you own the previous one OR have >= half its base cost).
function isRevealed(i) {
  if (i === 0) return true;
  const prev = BUILDINGS[i - 1];
  return game.owned[prev.id] > 0 || game.total >= prev.base * 0.5;
}

function refreshShop() {
  const n = game.buyN;
  for (let i = 0; i < BUILDINGS.length; i++) {
    const b = BUILDINGS[i], r = shopRows[i], owned = game.owned[b.id];
    const revealed = isRevealed(i);
    const price = bulkCost(b, owned, n);
    const affordable = revealed && game.mice >= price;

    if (r.can !== affordable) { r.el.classList.toggle("can", affordable); r.can = affordable; }
    r.own.textContent = owned;
    r.qty.textContent = n > 1 ? "×" + n : "";

    if (!revealed) {
      r.fx.className = "locked";
      r.fx.textContent = "??? — keep collecting";
      r.cost.textContent = "🔒";
      r.cost.classList.remove("no");
    } else {
      r.fx.className = "fx";
      const each = b.mps;
      const mine = each * owned;
      r.fx.textContent = mine > 0
        ? `${fmt(mine)}/s · ${b.blurb}`
        : `+${fmt(each)}/s each · ${b.blurb}`;
      r.cost.textContent = fmt(price);
      r.cost.classList.toggle("no", !affordable);
    }
  }
}

function buy(i) {
  const b = BUILDINGS[i];
  if (!isRevealed(i)) return;
  const n = game.buyN;
  const price = bulkCost(b, game.owned[b.id], n);
  if (game.mice < price) return;
  game.mice -= price;
  game.owned[b.id] += n;
  refreshHud(); refreshShop(); save();
}

// ---------------------------------------------------------------------------
// HUD
// ---------------------------------------------------------------------------
function refreshHud() {
  countEl.textContent = fmt(game.mice);
  cpsEl.innerHTML = `<b>${fmt(cps())}</b> per second`;
}

// ---------------------------------------------------------------------------
// CLICK / PET
// ---------------------------------------------------------------------------
function floatNum(x, y, text) {
  const f = document.createElement("div");
  f.className = "float"; f.textContent = text;
  f.style.left = x + "px"; f.style.top = y + "px";
  stageEl.appendChild(f);
  f.addEventListener("animationend", () => f.remove());
}

let squash = 0; // 0..1 pet animation
function pet(clientX, clientY) {
  const gain = clickGain();
  game.mice += gain; game.total += gain; game.clicks++;
  squash = 1;
  const rect = stageEl.getBoundingClientRect();
  floatNum(clientX - rect.left, clientY - rect.top, "+" + fmt(gain));
  if (hintEl.style.opacity !== "0") hintEl.style.opacity = "0";
  refreshHud();
}

const hexEl = $("#hex");
hexEl.addEventListener("pointerdown", e => { e.preventDefault(); pet(e.clientX, e.clientY); }, { passive: false });

// ---------------------------------------------------------------------------
// GOLDEN MOUSE — the fun spike. Spawns every ~40–90s, drifts, must be tapped
// before it escapes. Two outcomes (Cookie-Clicker "Lucky" vs "Frenzy"):
//   Lucky   → lump sum ( ~13% of bank + 13s of income, min 25 )
//   Frenzy  → cps ×7 for 12s
// ---------------------------------------------------------------------------
let goldTimer = 0, goldActive = false, goldLifeLeft = 0, goldVx = 0, goldVy = 0, goldX = 0, goldY = 0;
function scheduleGold() { goldTimer = 40 + Math.random() * 50; } // seconds
scheduleGold();

function spawnGold() {
  goldActive = true;
  goldLifeLeft = 9; // seconds on screen
  const w = stageEl.clientWidth, h = stageEl.clientHeight;
  goldX = 40 + Math.random() * (w - 120);
  goldY = 40 + Math.random() * (h - 160);
  const ang = Math.random() * Math.PI * 2, sp = 22 + Math.random() * 18;
  goldVx = Math.cos(ang) * sp; goldVy = Math.sin(ang) * sp;
  goldenEl.style.display = "grid";
}
function moveGold(dt) {
  if (!goldActive) return;
  goldLifeLeft -= dt;
  if (goldLifeLeft <= 0) { despawnGold(); return; }
  const w = stageEl.clientWidth, h = stageEl.clientHeight;
  goldX += goldVx * dt; goldY += goldVy * dt;
  if (goldX < 10 || goldX > w - 72) { goldVx *= -1; goldX = Math.max(10, Math.min(w - 72, goldX)); }
  if (goldY < 10 || goldY > h - 72) { goldVy *= -1; goldY = Math.max(10, Math.min(h - 72, goldY)); }
  goldenEl.style.left = goldX + "px"; goldenEl.style.top = goldY + "px";
  goldenEl.style.opacity = goldLifeLeft < 2 ? (goldLifeLeft / 2).toFixed(2) : "1";
}
function despawnGold() {
  goldActive = false; goldenEl.style.display = "none"; goldenEl.style.opacity = "1";
  scheduleGold();
}
goldenEl.addEventListener("pointerdown", e => {
  e.preventDefault(); e.stopPropagation();
  if (!goldActive) return;
  game.goldCaught++;
  const rect = stageEl.getBoundingClientRect();
  if (Math.random() < 0.7) {
    const gain = Math.max(25, Math.floor(game.mice * 0.13 + cps() * 13));
    game.mice += gain; game.total += gain;
    floatNum(goldX - rect.left + 30, goldY - rect.top + 20, "🍀 +" + fmt(gain));
    showBuff("🍀 Lucky!  +" + fmt(gain), 1.6);
  } else {
    game.buffMult = 7; game.buffUntil = performance.now() + 12000;
    showBuff("⚡ ZOOMIES ×7", 0); // buff pill managed by frenzy countdown below
  }
  despawnGold(); refreshHud(); save();
}, { passive: false });

let buffMsgUntil = 0;
function showBuff(text, seconds) {
  buffEl.textContent = text; buffEl.style.display = "block";
  buffMsgUntil = seconds > 0 ? performance.now() + seconds * 1000 : 0;
}

// ---------------------------------------------------------------------------
// HEX + CAT rendering — two-pass neon strokes (soft glow + bright core).
// ---------------------------------------------------------------------------
const cv = hexEl, ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = stageEl.clientWidth; H = stageEl.clientHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);

// neon stroke helper: draw path fn twice (glow, then crisp core)
function neon(color, coreWidth, glow, pathFn) {
  ctx.save();
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  ctx.strokeStyle = color; ctx.shadowColor = color;
  ctx.globalAlpha = 0.5; ctx.shadowBlur = glow; ctx.lineWidth = coreWidth * 2.2;
  pathFn(); ctx.stroke();
  ctx.globalAlpha = 1; ctx.shadowBlur = glow * 0.5; ctx.lineWidth = coreWidth;
  ctx.strokeStyle = "#eafff9"; pathFn(); ctx.stroke();
  ctx.restore();
}

function drawHex(t) {
  ctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2;
  const bounce = squash;                     // 1 right after a pet, decays
  const scale = 1 - bounce * 0.06 + Math.sin(t / 1200) * 0.008;
  const R = Math.min(W, H) * 0.30 * scale;
  const frenzy = currentBuff() > 1;
  const hexColor = frenzy ? "#ffd44d" : "#57e6c9";

  // hexagon (flat-top)
  ctx.save();
  ctx.translate(cx, cy);
  neon(hexColor, 4, 22 + (frenzy ? 14 : 0), () => {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = Math.PI / 180 * (60 * i - 30);
      const x = Math.cos(a) * R, y = Math.sin(a) * R;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
  });

  // ears (little triangles poking above two top vertices)
  const earColor = hexColor;
  const ex = R * 0.5, ey = -R * 0.72;
  [-1, 1].forEach(s => {
    neon(earColor, 3.2, 14, () => {
      ctx.beginPath();
      ctx.moveTo(s * (ex - R * 0.16), ey + R * 0.18);
      ctx.lineTo(s * (ex + R * 0.02), ey - R * 0.20);
      ctx.lineTo(s * (ex + R * 0.20), ey + R * 0.12);
    });
  });

  // eyes — blink occasionally; widen during frenzy
  const blink = (Math.sin(t / 1400) > 0.985) ? 0.12 : 1;
  const eyeY = -R * 0.10, eyeDX = R * 0.34, eyeR = R * 0.12 * (frenzy ? 1.25 : 1);
  [-1, 1].forEach(s => {
    neon("#57e6c9", 3, 12, () => {
      ctx.beginPath();
      ctx.ellipse(s * eyeDX, eyeY, eyeR * 0.72, eyeR * blink, 0, 0, Math.PI * 2);
    });
  });

  // nose + mouth (a soft neon 'w')
  neon("#ff5db1", 3, 12, () => {
    ctx.beginPath();
    ctx.moveTo(0, R * 0.12); ctx.lineTo(-R * 0.06, R * 0.20); ctx.lineTo(0, R * 0.16);
    ctx.lineTo(R * 0.06, R * 0.20); ctx.lineTo(0, R * 0.12);
  });
  neon("#ff5db1", 2.4, 9, () => {
    ctx.beginPath();
    ctx.moveTo(0, R * 0.20); ctx.lineTo(0, R * 0.30);
    ctx.moveTo(0, R * 0.30); ctx.quadraticCurveTo(-R * 0.10, R * 0.40, -R * 0.20, R * 0.34);
    ctx.moveTo(0, R * 0.30); ctx.quadraticCurveTo(R * 0.10, R * 0.40, R * 0.20, R * 0.34);
  });

  // whiskers
  neon("#9fe9d9", 1.8, 7, () => {
    ctx.beginPath();
    [-1, 1].forEach(s => {
      for (let k = -1; k <= 1; k++) {
        ctx.moveTo(s * R * 0.16, R * 0.22 + k * R * 0.07);
        ctx.lineTo(s * R * 0.62, R * 0.16 + k * R * 0.12);
      }
    });
  });
  ctx.restore();

  // decay squash
  if (squash > 0) squash = Math.max(0, squash - 0.08);
}

// ---------------------------------------------------------------------------
// MAIN LOOP
// ---------------------------------------------------------------------------
let last = performance.now(), hudTick = 0, saveTick = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;

  // income
  const inc = cps() * dt;
  if (inc > 0) { game.mice += inc; game.total += inc; }

  // frenzy pill countdown
  if (game.buffUntil > now) {
    const left = ((game.buffUntil - now) / 1000);
    buffEl.textContent = "⚡ ZOOMIES ×7 · " + left.toFixed(1) + "s";
    buffEl.style.display = "block";
  } else if (buffMsgUntil > now) {
    // a transient Lucky message is showing
  } else if (buffEl.style.display === "block" && game.buffUntil <= now && buffMsgUntil <= now) {
    buffEl.style.display = "none";
  }
  if (game.buffUntil <= now) game.buffMult = 1;

  moveGold(dt);
  if (!goldActive) { goldTimer -= dt; if (goldTimer <= 0) spawnGold(); }

  drawHex(now);

  // throttle HUD/shop updates to ~12fps (cheap, avoids layout thrash)
  hudTick += dt;
  if (hudTick > 0.08) { hudTick = 0; refreshHud(); refreshShop(); }

  saveTick += dt;
  if (saveTick > 8) { saveTick = 0; save(); }

  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------------------
// MENU / RESET
// ---------------------------------------------------------------------------
const sheet = $("#sheet");
$("#menuBtn").addEventListener("click", () => {
  $("#s_cps").textContent = fmt(cps());
  $("#s_total").textContent = fmt(game.total);
  $("#s_clicks").textContent = fmt(game.clicks);
  $("#s_gold").textContent = fmt(game.goldCaught);
  sheet.style.display = "flex";
});
$("#closeBtn").addEventListener("click", () => sheet.style.display = "none");
sheet.addEventListener("click", e => { if (e.target === sheet) sheet.style.display = "none"; });
$("#resetBtn").addEventListener("click", () => {
  if (!confirm("Reset all progress? This can't be undone.")) return;
  localStorage.removeItem(SAVE_KEY);
  game.mice = 0; game.total = 0; game.clicks = 0; game.goldCaught = 0;
  BUILDINGS.forEach(b => game.owned[b.id] = 0);
  game.buffUntil = 0; game.buffMult = 1;
  sheet.style.display = "none";
  refreshHud(); refreshShop();
});

// buy amount toggle
document.querySelectorAll("#buyToggle button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#buyToggle button").forEach(b => b.classList.remove("on"));
    btn.classList.add("on");
    game.buyN = +btn.dataset.n;
    refreshShop();
  });
});

document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });
window.addEventListener("pagehide", save);

// ---------------------------------------------------------------------------
// BOOT
// ---------------------------------------------------------------------------
load();
resize();
buildShop();
refreshHud();
refreshShop();
requestAnimationFrame(frame);
</script>
