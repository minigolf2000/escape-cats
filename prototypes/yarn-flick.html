<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Yarn Flick</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #24403f; }
  #c { position: fixed; inset: 0; touch-action: none; -webkit-tap-highlight-color: transparent; }
</style>
<canvas id="c"></canvas>
<script>
'use strict';
// ---------- Yarn Flick — flick Goomba's yarn ball, bonk the mice off the shelves ----------
// Physics space: x in "units" (1u = 1% screen width), y = height above the floor in units (y-up).
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

let W = 0, H = 0, u = 4, HU = 200;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  u = W / 100; HU = H / u;
}
window.addEventListener('resize', resize);
resize();
if (!ctx.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r); this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r); this.closePath();
  };
}
const gy = () => H * 0.87;                 // floor line in px
const sx = x => x * u;                     // unit x -> px
const sy = y => gy() - y * u;              // unit height -> px

const G = 260;                              // gravity, units/s^2
const ANCHOR = { x: 16, y: 30 };            // slingshot pouch
const MAX_PULL = 20, POWER = 8.5, YARN_R = 3;

// Levels: y = height of the *bottom* of the object above the floor.
// plat: static shelves {x (left), y (top surface height), w}
// crate: 9u wooden cubes; mouse: the villains of the living room.
const LEVELS = [
  { name: 'Warm-up', shots: 5, plats: [{ x: 60, y: 26, w: 32 }],
    crates: [{ x: 84, y: 26 }],
    mice: [{ x: 76, y: 0 }, { x: 68, y: 26 }] },
  { name: 'The Tower', shots: 5, plats: [{ x: 64, y: 38, w: 30 }],
    crates: [{ x: 78, y: 0 }, { x: 78, y: 9 }, { x: 70, y: 38 }],
    mice: [{ x: 78, y: 18 }, { x: 84, y: 38 }] },
  { name: 'Penthouse', shots: 6, plats: [{ x: 58, y: 22, w: 36 }, { x: 68, y: 46, w: 26 }],
    crates: [{ x: 63, y: 22 }, { x: 88, y: 22 }, { x: 74, y: 46 }],
    mice: [{ x: 76, y: 0 }, { x: 74, y: 22 }, { x: 84, y: 46 }] },
];

let level = 0, shots = 0, score = 0, state = 'title'; // title | aim | fly | clear | fail | win
let plats = [], crates = [], mice = [], bonked = [], trail = [], pops = [];
let yarn = null, aim = null, settle = 0, flyT = 0, tGlobal = 0, banner = 0;

function loadLevel(i) {
  const L = LEVELS[i];
  plats = L.plats.map(p => ({ ...p }));
  crates = L.crates.map(c => ({ x: c.x, y: c.y, w: 9, h: 9, vx: 0, vy: 0 }));
  mice = L.mice.map(m => ({ x: m.x, y: m.y, w: 5.5, h: 6.5, vx: 0, vy: 0, fear: 0 }));
  bonked = []; pops = []; trail = [];
  shots = L.shots; yarn = null; aim = null; state = 'aim'; banner = 2.2;
}

// ---------- physics helpers ----------
function surfacesUnder(b) {
  // highest support top below body bottom (within horizontal overlap)
  let top = 0; // floor
  for (const p of plats) if (b.x + b.w / 2 > p.x + 0.5 && b.x - b.w / 2 < p.x + p.w - 0.5 && b.y >= p.y - 0.4) top = Math.max(top, p.y);
  for (const c of crates) if (c !== b && Math.abs(c.x - b.x) < (c.w + b.w) / 2 - 0.5 && b.y >= c.y + c.h - 0.6) top = Math.max(top, c.y + c.h);
  return top;
}
function stepBody(b, dt) {
  b.vy -= G * dt;
  b.x += b.vx * dt; b.y += b.vy * dt;
  const floor = surfacesUnder(b);
  if (b.y <= floor) {
    const impact = -b.vy;
    b.y = floor; b.vy = 0;
    b.vx *= Math.pow(0.02, dt * 4); // ground friction
    if (Math.abs(b.vx) < 2) b.vx = 0;
    return impact;
  }
  return 0;
}
function circleHitsBox(cx, cy, r, b) {
  const nx = Math.max(b.x - b.w / 2, Math.min(cx, b.x + b.w / 2));
  const ny = Math.max(b.y, Math.min(cy, b.y + b.h));
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy < r * r ? { nx, ny } : null;
}
function bonk(m, vx, vy) {
  m.dead = true; score += 100;
  bonked.push({ x: m.x, y: m.y, vx: vx * 0.6 + (Math.random() * 10 - 5), vy: Math.max(30, vy * 0.4 + 40), rot: 0, vr: (Math.random() > 0.5 ? 1 : -1) * (4 + Math.random() * 4) });
  pops.push({ x: m.x, y: m.y + 6, t: 0, txt: '+100' });
}

function fireEnds() {
  yarn = null; trail = [];
  if (!mice.length) {
    if (level === LEVELS.length - 1) state = 'win'; else state = 'clear';
  } else if (shots <= 0) state = 'fail';
  else state = 'aim';
}

function step(dt) {
  tGlobal += dt;
  if (banner > 0) banner -= dt;
  for (const p of pops) p.t += dt;
  pops = pops.filter(p => p.t < 0.9);
  for (const b of bonked) { b.vy -= G * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt; }
  bonked = bonked.filter(b => b.y > -20);
  if (state !== 'fly' && state !== 'aim') return;

  // crates & mice settle under gravity
  for (const c of crates) stepBody(c, dt);
  for (const m of mice) {
    const impact = stepBody(m, dt);
    if (impact > 55) bonk(m, m.vx, impact * 0.3); // hard landing
  }

  // crate vs crate: crude horizontal separation
  for (let i = 0; i < crates.length; i++) for (let j = i + 1; j < crates.length; j++) {
    const a = crates[i], b = crates[j];
    const ox = (a.w + b.w) / 2 - Math.abs(a.x - b.x);
    const oy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
    if (ox > 0 && oy > 1) {
      const s = a.x < b.x ? -1 : 1;
      a.x += s * ox / 2; b.x -= s * ox / 2;
      const v = (a.vx + b.vx) / 2; a.vx = v; b.vx = v;
    }
  }

  if (yarn) {
    flyT += dt;
    yarn.vy -= G * dt;
    yarn.x += yarn.vx * dt; yarn.y += yarn.vy * dt;
    trail.push({ x: yarn.x, y: yarn.y });
    if (trail.length > 46) trail.shift();

    if (yarn.y <= YARN_R) { // floor bounce
      yarn.y = YARN_R; yarn.vy = -yarn.vy * 0.45; yarn.vx *= 0.8;
    }
    for (const p of plats) { // shelf: treat as thin slab, bounce off top only
      if (yarn.x > p.x && yarn.x < p.x + p.w && yarn.y < p.y + YARN_R && yarn.y > p.y - 3 && yarn.vy < 0) {
        yarn.y = p.y + YARN_R; yarn.vy = -yarn.vy * 0.45; yarn.vx *= 0.85;
      }
    }
    for (const c of crates) {
      const hit = circleHitsBox(yarn.x, yarn.y, YARN_R, c);
      if (hit) {
        const spd = Math.hypot(yarn.vx, yarn.vy);
        c.vx += yarn.vx * 0.65; c.vy += Math.max(0, yarn.vy * 0.25) + Math.min(20, spd * 0.1);
        let dx = yarn.x - hit.nx, dy = yarn.y - hit.ny;
        const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
        yarn.x = hit.nx + dx * (YARN_R + 0.1); yarn.y = hit.ny + dy * (YARN_R + 0.1);
        const dot = yarn.vx * dx + yarn.vy * dy;
        yarn.vx = (yarn.vx - 2 * dot * dx) * 0.42; yarn.vy = (yarn.vy - 2 * dot * dy) * 0.42;
      }
    }
    for (const m of mice) if (!m.dead && circleHitsBox(yarn.x, yarn.y, YARN_R + 0.6, m)) bonk(m, yarn.vx, yarn.vy);

    // crates slamming mice
    for (const m of mice) if (!m.dead) for (const c of crates) {
      const rel = Math.hypot(c.vx - m.vx, c.vy - m.vy);
      if (rel > 14 && Math.abs(c.x - m.x) < (c.w + m.w) / 2 && m.y < c.y + c.h && m.y + m.h > c.y) bonk(m, c.vx, 20);
    }

    // end of shot
    const slow = Math.hypot(yarn.vx, yarn.vy) < 7 && yarn.y <= YARN_R + 0.4;
    settle = slow ? settle + dt : 0;
    if (settle > 0.7 || yarn.x > 115 || yarn.x < -15 || flyT > 7) fireEnds();
  } else if (state === 'fly') {
    fireEnds();
  }
  mice = mice.filter(m => !m.dead);
  if (state === 'aim' && !mice.length) fireEnds();
}

// ---------- input ----------
let ptr = null;
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (state === 'title') { loadLevel(0); return; }
  if (state === 'clear') { level++; loadLevel(level); return; }
  if (state === 'fail') { loadLevel(level); return; }
  if (state === 'win') { level = 0; score = 0; loadLevel(0); return; }
  if (state === 'aim' && shots > 0) { ptr = { x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY }; }
}, { passive: false });
cv.addEventListener('pointermove', e => { if (ptr) { ptr.x = e.clientX; ptr.y = e.clientY; } });
window.addEventListener('pointerup', () => {
  if (!ptr) return;
  const p = pull();
  ptr = null;
  if (p.len > 2.5) {
    shots--;
    yarn = { x: ANCHOR.x, y: ANCHOR.y, vx: p.vx, vy: p.vy };
    trail = []; settle = 0; flyT = 0; state = 'fly';
  }
});
function pull() {
  // drag anywhere: pull vector is drag delta, launched opposite
  let px = (ptr.x0 - ptr.x) / u, py = (ptr.y - ptr.y0) / u; // py up-positive
  let len = Math.hypot(px, py);
  if (len > MAX_PULL) { px *= MAX_PULL / len; py *= MAX_PULL / len; len = MAX_PULL; }
  return { vx: px * POWER, vy: py * POWER, len, px, py };
}

// ---------- drawing ----------
function drawRoom() {
  // teal wall
  const g = ctx.createLinearGradient(0, 0, 0, gy());
  g.addColorStop(0, '#2a4a49'); g.addColorStop(1, '#1e3736');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, gy());
  // wainscot line
  ctx.fillStyle = 'rgba(0,0,0,0.14)'; ctx.fillRect(0, gy() - 26 * u, W, 1 * u);
  // window with moon
  const wx = W * 0.09, wy = H * 0.09, ww = W * 0.3, wh = H * 0.24;
  ctx.fillStyle = '#152a3d'; ctx.beginPath(); ctx.roundRect(wx, wy, ww, wh, 2 * u); ctx.fill();
  ctx.fillStyle = '#f4ead2'; ctx.beginPath(); ctx.arc(wx + ww * 0.68, wy + wh * 0.32, 3.4 * u, 0, 6.28); ctx.fill();
  ctx.fillStyle = 'rgba(244,234,210,0.8)';
  ctx.beginPath(); ctx.arc(wx + ww * 0.25, wy + wh * 0.6, 0.4 * u, 0, 6.28); ctx.arc(wx + ww * 0.45, wy + wh * 0.7, 0.3 * u, 0, 6.28); ctx.fill();
  ctx.strokeStyle = '#3d2c1e'; ctx.lineWidth = 1.2 * u;
  ctx.strokeRect(wx, wy, ww, wh);
  ctx.beginPath(); ctx.moveTo(wx + ww / 2, wy); ctx.lineTo(wx + ww / 2, wy + wh); ctx.moveTo(wx, wy + wh / 2); ctx.lineTo(wx + ww, wy + wh / 2); ctx.stroke();
  // floor
  const f = ctx.createLinearGradient(0, gy(), 0, H);
  f.addColorStop(0, '#7a5230'); f.addColorStop(1, '#5d3d22');
  ctx.fillStyle = f; ctx.fillRect(0, gy(), W, H - gy());
  ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.moveTo(0, gy() + (H - gy()) * i / 4); ctx.lineTo(W, gy() + (H - gy()) * i / 4); ctx.stroke(); }
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, gy(), W, 0.6 * u);
}
function drawShelf(p) {
  ctx.fillStyle = '#8a5a33';
  ctx.beginPath(); ctx.roundRect(sx(p.x), sy(p.y), p.w * u, 2.2 * u, 0.6 * u); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(sx(p.x), sy(p.y) + 1.6 * u, p.w * u, 0.6 * u);
  // brackets
  ctx.fillStyle = '#6e4527';
  ctx.fillRect(sx(p.x + 3), sy(p.y) + 2.2 * u, 1.4 * u, 4 * u);
  ctx.fillRect(sx(p.x + p.w - 4.4), sy(p.y) + 2.2 * u, 1.4 * u, 4 * u);
}
function drawCrate(c) {
  const x = sx(c.x - c.w / 2), y = sy(c.y + c.h);
  ctx.fillStyle = '#b98a4f';
  ctx.beginPath(); ctx.roundRect(x, y, c.w * u, c.h * u, 0.8 * u); ctx.fill();
  ctx.strokeStyle = '#8a5f30'; ctx.lineWidth = 0.7 * u;
  ctx.strokeRect(x + 0.9 * u, y + 0.9 * u, (c.w - 1.8) * u, (c.h - 1.8) * u);
  ctx.beginPath();
  ctx.moveTo(x + 0.9 * u, y + 0.9 * u); ctx.lineTo(x + (c.w - 0.9) * u, y + (c.h - 0.9) * u);
  ctx.moveTo(x + (c.w - 0.9) * u, y + 0.9 * u); ctx.lineTo(x + 0.9 * u, y + (c.h - 0.9) * u);
  ctx.stroke();
}
function drawMouse(x, y, rot, scared) {
  ctx.save();
  ctx.translate(sx(x), sy(y));
  if (rot) ctx.rotate(rot);
  // body
  ctx.fillStyle = '#9aa0b4';
  ctx.beginPath(); ctx.ellipse(0, -3 * u, 2.8 * u, 3.1 * u, 0, 0, 6.28); ctx.fill();
  // ears
  ctx.fillStyle = '#c9cede';
  ctx.beginPath(); ctx.arc(-1.6 * u, -5.6 * u, 1.15 * u, 0, 6.28); ctx.arc(1.6 * u, -5.6 * u, 1.15 * u, 0, 6.28); ctx.fill();
  // tail
  ctx.strokeStyle = '#848aa0'; ctx.lineWidth = 0.55 * u; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(2.2 * u, -1.4 * u); ctx.quadraticCurveTo(4.6 * u, -1 * u, 5 * u, -3.4 * u); ctx.stroke();
  // face
  ctx.fillStyle = '#2c2f3d';
  const blink = Math.sin(tGlobal * 2.2 + x) > 0.96 ? 0.15 : 1;
  ctx.beginPath();
  ctx.ellipse(-0.9 * u, -3.8 * u, 0.42 * u, 0.42 * u * blink, 0, 0, 6.28);
  ctx.ellipse(0.9 * u, -3.8 * u, 0.42 * u, 0.42 * u * blink, 0, 0, 6.28);
  ctx.fill();
  ctx.fillStyle = '#e08a9b';
  ctx.beginPath(); ctx.arc(0, -2.9 * u, 0.4 * u, 0, 6.28); ctx.fill();
  if (scared) {
    ctx.fillStyle = '#2c2f3d'; ctx.font = `700 ${2.2 * u}px system-ui, sans-serif`; ctx.textAlign = 'center';
    ctx.fillText('!', 0, -7.4 * u);
  }
  ctx.restore();
}
function drawYarnBall(px, py, r, rot) {
  ctx.save(); ctx.translate(px, py); ctx.rotate(rot || 0);
  ctx.fillStyle = '#e5484d';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.28); ctx.fill();
  ctx.strokeStyle = '#b93038'; ctx.lineWidth = r * 0.16;
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.72, 0.4, 2.6);
  ctx.moveTo(r * 0.7, -r * 0.5); ctx.arc(0, 0, r * 0.85, -0.5, 1.2);
  ctx.moveTo(-r * 0.2, -r * 0.75); ctx.arc(0, -r * 0.2, r * 0.6, 3.6, 5.6);
  ctx.stroke();
  ctx.restore();
}
function drawGoomba() {
  const x = sx(9), y = gy();
  ctx.fillStyle = '#e8853d';
  // tail
  ctx.strokeStyle = '#e8853d'; ctx.lineWidth = 2.4 * u; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x + 4 * u, y - 3 * u); ctx.quadraticCurveTo(x + 9 * u, y - 2 * u, x + 9.4 * u, y - 8 * u + Math.sin(tGlobal * 2) * u); ctx.stroke();
  // body
  ctx.beginPath(); ctx.ellipse(x, y - 6 * u, 5.2 * u, 6.2 * u, 0, 0, 6.28); ctx.fill();
  // head
  ctx.beginPath(); ctx.arc(x - 1 * u, y - 14 * u, 4.2 * u, 0, 6.28); ctx.fill();
  // ears
  ctx.beginPath();
  ctx.moveTo(x - 4.4 * u, y - 16.4 * u); ctx.lineTo(x - 3.4 * u, y - 20.2 * u); ctx.lineTo(x - 1.4 * u, y - 17.6 * u);
  ctx.moveTo(x + 0.6 * u, y - 17.8 * u); ctx.lineTo(x + 2.2 * u, y - 20.4 * u); ctx.lineTo(x + 3.2 * u, y - 16.6 * u);
  ctx.fill();
  // stripes
  ctx.strokeStyle = '#c96a24'; ctx.lineWidth = 0.8 * u;
  ctx.beginPath();
  ctx.moveTo(x - 3.4 * u, y - 19 * u + 1.4 * u); ctx.lineTo(x - 3.2 * u, y - 17.2 * u);
  ctx.moveTo(x + 2 * u, y - 19.2 * u + 1.4 * u); ctx.lineTo(x + 1.9 * u, y - 17 * u);
  ctx.stroke();
  // face — watching the yarn
  const look = yarn ? Math.max(-1, Math.min(1, (yarn.x - 16) / 60)) : (ptr ? -0.4 : 0.2);
  ctx.fillStyle = '#4d3319';
  ctx.beginPath();
  ctx.arc(x - 2.6 * u + look * 0.5 * u, y - 14.6 * u, 0.55 * u, 0, 6.28);
  ctx.arc(x + 0.8 * u + look * 0.5 * u, y - 14.6 * u, 0.55 * u, 0, 6.28);
  ctx.fill();
  ctx.strokeStyle = '#4d3319'; ctx.lineWidth = 0.4 * u;
  ctx.beginPath(); ctx.moveTo(x - 1.6 * u, y - 13.2 * u); ctx.lineTo(x - 0.9 * u, y - 12.6 * u); ctx.lineTo(x - 0.2 * u, y - 13.2 * u); ctx.stroke();
}
function drawSling() {
  const ax = sx(ANCHOR.x), ay = sy(ANCHOR.y);
  // cat-tree post
  ctx.fillStyle = '#6e4527';
  ctx.fillRect(ax - 1.6 * u, ay, 3.2 * u, gy() - ay);
  ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 0.5 * u;
  for (let yy = ay + 2 * u; yy < gy(); yy += 2.2 * u) { ctx.beginPath(); ctx.moveTo(ax - 1.6 * u, yy); ctx.lineTo(ax + 1.6 * u, yy); ctx.stroke(); }
  ctx.fillStyle = '#8a5a33';
  ctx.beginPath(); ctx.roundRect(ax - 4 * u, ay - 1.4 * u, 8 * u, 2 * u, u); ctx.fill();

  let bx = ax, by = ay - 2 * u, rot = 0;
  if (ptr && state === 'aim') {
    const p = pull();
    bx = ax - p.px * u; by = ay - 2 * u + p.py * u;
    // elastic band
    ctx.strokeStyle = '#d8c49a'; ctx.lineWidth = 0.9 * u; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ax - 3.4 * u, ay - 0.6 * u); ctx.lineTo(bx, by); ctx.lineTo(ax + 3.4 * u, ay - 0.6 * u); ctx.stroke();
    // trajectory preview
    let tx = ANCHOR.x, ty = ANCHOR.y, tvx = p.vx, tvy = p.vy;
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    for (let i = 0; i < 42; i++) {
      tvy -= G * (1 / 60); tx += tvx / 60; ty += tvy / 60;
      if (ty < 0) break;
      if (i % 4 === 2) { ctx.beginPath(); ctx.arc(sx(tx), sy(ty), 0.55 * u, 0, 6.28); ctx.fill(); }
    }
  }
  if (state === 'aim' && shots > 0) drawYarnBall(bx, by, YARN_R * u * 0.9, tGlobal * 0.5);
}

function render() {
  drawRoom();
  for (const p of plats) drawShelf(p);
  drawSling();
  drawGoomba();
  for (const c of crates) drawCrate(c);
  for (const m of mice) drawMouse(m.x, m.y, 0, ptr || yarn);
  for (const b of bonked) drawMouse(b.x, b.y, b.rot, false);
  // yarn trail (the unspooled string)
  if (trail.length > 1) {
    ctx.strokeStyle = 'rgba(229,72,77,0.55)'; ctx.lineWidth = 0.6 * u; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(sx(trail[0].x), sy(trail[0].y));
    for (const t of trail) ctx.lineTo(sx(t.x), sy(t.y));
    ctx.stroke();
  }
  if (yarn) drawYarnBall(sx(yarn.x), sy(yarn.y), YARN_R * u, yarn.x * 0.4);
  for (const p of pops) {
    ctx.globalAlpha = 1 - p.t / 0.9;
    ctx.fillStyle = '#ffd76b'; ctx.textAlign = 'center';
    ctx.font = `800 ${3.6 * u}px -apple-system, system-ui, sans-serif`;
    ctx.fillText(p.txt, sx(p.x), sy(p.y + p.t * 10));
    ctx.globalAlpha = 1;
  }

  // ---------- HUD ----------
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,243,224,0.92)';
  ctx.font = `800 ${4.2 * u}px -apple-system, system-ui, sans-serif`;
  ctx.fillText(score, 4 * u, 7 * u);
  ctx.font = `600 ${2.8 * u}px -apple-system, system-ui, sans-serif`;
  ctx.fillStyle = 'rgba(255,243,224,0.6)';
  if (state !== 'title') ctx.fillText(`${level + 1} · ${LEVELS[level].name}`, 4 * u, 11 * u);
  // remaining yarn
  for (let i = 0; i < shots; i++) drawYarnBall((5 + i * 5.4) * u, H - 5 * u, 2 * u, i);
  // remaining mice
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(255,243,224,0.85)';
  ctx.font = `700 ${3.4 * u}px -apple-system, system-ui, sans-serif`;
  if (state !== 'title') ctx.fillText(`${mice.length} 🐭`, W - 4 * u, 7 * u);

  if (banner > 0 && (state === 'aim' || state === 'fly') && level === 0 && shots === LEVELS[0].shots) {
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,243,224,0.85)';
    ctx.font = `600 ${3.4 * u}px -apple-system, system-ui, sans-serif`;
    ctx.fillText('drag anywhere, release to fling', W / 2, H * 0.32);
  }

  const overlay = (title, sub, cta) => {
    ctx.fillStyle = 'rgba(20,32,31,0.78)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff3e0';
    ctx.font = `800 ${7.5 * u}px -apple-system, system-ui, sans-serif`;
    ctx.fillText(title, W / 2, H * 0.34);
    ctx.fillStyle = '#ffd76b';
    ctx.font = `600 ${3.8 * u}px -apple-system, system-ui, sans-serif`;
    ctx.fillText(sub, W / 2, H * 0.41);
    if (Math.sin(tGlobal * 4) > -0.2) {
      ctx.fillStyle = '#fff3e0';
      ctx.font = `700 ${4 * u}px -apple-system, system-ui, sans-serif`;
      ctx.fillText(cta, W / 2, H * 0.55);
    }
  };
  if (state === 'title') {
    overlay('YARN FLICK', 'bonk every mouse off the shelves', 'tap to play');
    drawYarnBall(W / 2, H * 0.68, 7 * u, tGlobal);
  }
  if (state === 'clear') overlay('SHELF CLEARED!', `score ${score}`, 'tap for next level');
  if (state === 'fail') overlay('OUT OF YARN', 'the mice are still smug', 'tap to retry');
  if (state === 'win') overlay('MICE EVICTED!', `final score ${score}`, 'tap to play again');
}

let last = performance.now(), acc = 0;
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  acc += dt;
  while (acc > 1 / 120) { step(1 / 120); acc -= 1 / 120; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
