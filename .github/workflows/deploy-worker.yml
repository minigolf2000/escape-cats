# Deploy the Cloudflare Worker (the four Durable Objects). Wrangler has no git
# integration and Vercel deploys itself on every push; without this a client
# can speak a protocol the live Worker doesn't know.
#
# ORDER MATTERS: Worker BEFORE the Vercel deploy that depends on it. A push to
# main starts both at once and this job normally wins, but that is not a
# guarantee — for a breaking protocol/DO change, run this by hand
# (workflow_dispatch) against the branch FIRST, confirm it is live, then merge.
name: Deploy Worker

on:
  push:
    branches: [main]
    # The Worker bundles @escape-cats/shared, so a shared-only change MUST
    # redeploy it.
    paths:
      - "server/**"
      - "packages/shared/**"
      - "package-lock.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

# Never overlap, never cancel in flight: a half-applied migration is worse
# than a queued job.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `wrangler types` + tsc over the server workspace (covers shared). NOT
      # the root typecheck — a proctor type error must not block a room deploy.
      - name: Typecheck the Worker
        run: npm run typecheck -w server

      - name: Deploy
        run: npm run deploy:server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Only needed if the token can see more than one account, in which
          # case wrangler refuses to guess. Harmless when unset.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
