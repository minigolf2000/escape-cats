    // become the percentage they actually are.
    case "goldenFreq":   return Number.isInteger(e.mult)
      ? `Golden mice appear ${hl(multWord(e.mult))} as often`
      : `Golden mice appear ${hl(Math.round((e.mult - 1) * 100) + "%")} more often`;
    case "goldenLife":   return `Golden mice linger +${hl(e.add + "s")} longer`;
    case "zoomMult":     return `Zoomies pet ${hl("+×" + e.add)} harder`;
    case "zoomTime":     return `Zoomies lasts +${hl(e.add + "s")} longer`;
    // Must print e.add: the three sleep stages differ ONLY in trail length, so a
    // constant string rendered all of Deep Sleep / REM / Lucid identically.
    case "trail":        return `Dream mice leave ${hl("+" + e.add)} more trail`;
    case "neon":         return `The lights on the wall turn out to be mice`;
    case "wordMice":     return `Golden mice join the wall`;
    case "persist":      return `Dream trails stop fading`;
    case "speed":        return `The dream mice move quicker`;
    case "revealBuilding": return `Reveals ${hl(buildingName(e.building))}`;
    // THE twist, and the one row whose description is a QUESTION rather than a
    // statement of effect. Everything else here follows the rule that the row
    // tells you what you're buying and the NAME carries the joke; this one is
    // the exception the rule exists to allow, because what you're buying is the
    // thing the whole game has been withholding, and naming the mechanic
    // ("Hex falls asleep. The day ends") spends the reveal a purchase early.
    // Without a case at all it fell to `default` and rendered blank.
    case "night":        return `What is Hex dreaming about?`;
    case "crossBuilding": return `${buildingName(e.building)} gains +${hl(e.pct + "%")} per ${buildingName(e.per)}`;
    case "clickPerBuilding": return `+${hl(fmt(e.add))} per pet for every ${buildingName(e.per)}`;
    default:             return "";
  }
}

// ---------------------------------------------------------------------------
// NUMBER FORMATTING — full numbers, comma-grouped
// ---------------------------------------------------------------------------
// Deliberately NOT Cookie Clicker's short scale ("1.10K", "12.0M"). Counting
// real mice is the joke; "1.10K mice" reads as a spreadsheet, "1,103" reads as
// a hoard. One formatter feeds the bank, prices, rates and effect text, so the
// convention has to be the same everywhere — a "12,345" counter above a
// "1.10K" price is just two number systems in one screen.
//
// A trailing ".0" means the fraction did not survive rounding — drop it. This is
// Cookie Clicker's Beautify test (`Math.floor(fixed) != fixed`, main.js:270)
// stated directly: decide from the ROUNDED value, never the raw one. Testing the
// raw value is what turned every "+1" into "+1.0" the moment a single Robo-Cat
// made clickGain 1.002.
const dropDeadZeros = s => s.replace(/\.0+$/, "");

function fmt(n, floats = 1) {
  const neg = n < 0;
  n = Math.abs(n);
  // Under 10, the fraction is the whole signal (clickGain 1.002, a 0.5/s rate),
  // so it keeps its decimals and skips grouping — there's nothing to group.
  // At 10+ the integer part is the signal and the fraction is noise on a number
  // that's ticking many times a second anyway.
  //
  // toLocaleString (not a hand-rolled regex) so the grouping is the platform's:
  // it also keeps working past 2^53, where the value is already an approximation
  // and manual string surgery on "1e+21" would silently produce garbage.
  const out = n < 10
    ? dropDeadZeros(n.toFixed(floats))
    : Math.floor(n).toLocaleString("en-US");
  const signed = neg && out !== "0" ? "-" + out : out;
  // Night's numbers all read as MILLIONS. Pure presentation: the stored values are
  // untouched (the flip already hard-resets the economy, so night's numbers share no
  // surface with day's) — the dream is simply a place where you'd believe you have
  // 2,000M mice. Applied here, in the one formatter every player-facing count runs
  // through, rather than at each call site. The only fmt user that is NOT a mouse
  // count (secsText's "N seconds") renders on day-only zoom rows, which the night
  // shop hides.
  return nightActive() ? signed + "M" : signed;
}

// ---------------------------------------------------------------------------
// DOM refs
// ---------------------------------------------------------------------------
const $ = s => document.querySelector(s);
const countEl = $("#count"), countIconEl = $("#countIcon"), cpsEl = $("#cps"), shopEl = $("#shop"), stageEl = $("#stage");
const goldenEl = $("#golden"), buffEl = $("#buff");
const upgradesEl = $("#upgrades"), upgradeSecEl = $("#upgradeSec");
const shopScrollEl = $("#shopScroll"), newBadgeEl = $("#newBadge");
// Last touch anywhere in the shop, and how long a reveal will hold the list
// still afterwards. Read by refreshUpgrades() — see the long note there for why
// the hold is scoped to a tap burst instead of being always on. Capture phase
// and passive: this only observes, and must still fire for rows that stop
// propagation. 700ms outlasts the gap between taps in a mash (~250ms at 4/s)
// without keeping the list frozen once a player's hands are off it.
let lastShopTapAt = -Infinity;
const SHOP_HOLD_MS = 700;
shopScrollEl.addEventListener("pointerdown", () => { lastShopTapAt = performance.now(); },
                             { capture: true, passive: true });
// The last time the player SCROLLED the shop themselves, and how long that counts
// as "looking at it". Separate from lastShopTapAt on purpose: tapping a building
// row is not evidence you read the upgrade list above it, and the scroll hold
// writes scrollTop itself — so both have to be excluded from this one. See
// updSeen for what it gates.
let lastShopLookAt = -Infinity;
const SHOP_LOOK_MS = 1000;
// Raised across the hold's own write to scrollTop. Cleared on the next frame:
// scroll events fire before rAF, so a real scroll can't slip through the gap,
// and a write that doesn't move the scroller (no event at all) still clears it.
let programmaticScroll = false;
const buildingSecEl = $("#buildingSec"), dockEl = $("#dock"), hudEl = $("#hud");
const starsEl = $("#stars"), cutsceneVeilEl = $("#cutsceneVeil");

// Neither section knows about the other, so the dock's own visibility is
// resolved here from both. Called only when a section actually flips.
function syncDock() {
  dockEl.classList.toggle("show",
    upgradeSecEl.classList.contains("show") || buildingSecEl.classList.contains("show"));
}

// The shop still can't be dragged or resized, but a tap on the titled SHOP rail
// collapses/reopens it as a whole. That rail is the only toggle — the divider
// above Buildings is inert, so reaching for a row can't shut the shop by accident.
// Collapsed state is UI, not saved — the dock always opens fresh (matches the
// pre-static-redesign tray).
const shopToggleEl = $("#shopToggle");
function toggleShop() {
  const expanded = !dockEl.classList.toggle("collapsed");
  shopToggleEl.setAttribute("aria-expanded", String(expanded));
}
shopToggleEl.addEventListener("click", toggleShop);

// Does this row belong on the rail in the CURRENT phase? One definition, shared by
// the shop that renders rows and the badge that counts them — they had a copy each,
// and only the shop's knew about night.
//
// The bug that forced this out: `unlocked` is sticky and `seen` is only set when a
// row's midpoint scrolls into view, so at the flip every day upgrade that was
// unlocked-but-unbought stayed counted while no longer being drawn. The badge read
// 31 over a two-row night shop, and because the phantom rows could never be
// scrolled into view the count could never be discharged — a permanent unclearable
// notification pointing at content the phase had removed.
function onRailInPhase(u) {
  return !nightActive() || isStoryUpgrade(u) || nightOnlyUnlock(u);
}

// How many unlocked, unbought upgrades you have never had on screen. Every
// unbought upgrade is new — they're one-time purchases, so there's no "new since
// last visit" to compute; the only question is whether you've seen this one yet.
// Derived from game.seen rather than tracked incrementally, so it can't drift
// out of step with the rows that actually exist.
function refreshBadge() {
  let n = 0;
  for (const u of UPGRADES)
    if (!game.bought[u.key] && game.unlocked[u.key] && !game.seen[u.key] && onRailInPhase(u)) n++;
  if (n === badgeN) return;
  badgeN = n;
  if (n > 0) newBadgeEl.textContent = n;
  newBadgeEl.hidden = n === 0;
  // The rail's accessible name carries the count too — the badge itself is
  // aria-hidden, so without this a screen reader gets no hint at all. Rewritten
  // on every change of n, not just when the badge appears and disappears: gated
  // on the visibility flip it announced the count at first reveal and then never
  // corrected it, so the badge read 7 while the label still claimed 12.
  shopToggleEl.setAttribute("aria-label", n > 0 ? `Shop, ${n} new upgrades` : "Shop");
}
// Last value pushed to the DOM, so the common case (no change) costs one compare
// instead of a write — this runs off the scroll tick.
let badgeN = -1;

// Kiosk lockdown (see the html,body CSS note): swallow the long-press context
// menu so a held tap on Hex or a shop row never raises the browser's callout.
// This is a locked-in, proctored game — there's no in-game use for right-click
// or the copy/share menu, so blocking it document-wide is safe.
window.addEventListener("contextmenu", e => e.preventDefault());


// ---------------------------------------------------------------------------
// SHOP RENDER
// ---------------------------------------------------------------------------
// How often one of these earns a mouse, in words, from the rate the engine will
// actually pay: mps x INCOME_SCALE, before any upgrade multiplier (nothing that
// touches a building's rate is buyable while its blurb is still on screen — the
// CSS hides .fx the moment you own one). "second" rather than "1 second" when it
// lands on the nose, which is what INCOME_SCALE 2.5 is chosen to do for the
// Mouse Subscription; anything else prints the real figure, however untidy, so a
// changed dial shows up here instead of quietly making the blurb a lie.
function everyText(b) {
  const secs = 1 / (b.mps * INCOME_SCALE);
  return Math.abs(secs - 1) < 0.005 ? "second" : `${fmt(secs)} seconds`;
}

let shopRows = [];
function buildShop() {
  shopEl.innerHTML = "";
  shopRows = BUILDINGS.map((b, i) => {
    const el = document.createElement("button");
    el.className = "item";
    // Both the ??? and the real name live in the DOM permanently; the row's
    // `locked` class picks which one shows. Lifted from Cookie Clicker's
    // product row, where the per-frame loop writes only className and never
    // touches text. Price is deliberately NOT masked — it's the tease.
    el.innerHTML =
      `<div class="icon"><span class="ic">${b.icon}</span><span class="icLocked">?</span></div>
       <div class="body">
         <div class="lockedNm">???</div>
         <div class="titleRow">
           <div class="nm">${b.name}</div>
         </div>
         ${b.blurb ? `<div class="fx">${b.blurb.replace("{every}", everyText(b))}</div>` : ""}
         <div class="cost">${currencyIconSVG()}<span class="costNum"></span></div>
       </div>
       <div class="right"><div class="rate"></div><div class="own">0</div></div>`;
    el.addEventListener("click", () => buy(i));
    shopEl.appendChild(el);
    return {
      el, can: null, locked: null, gone: null, ownN: null, bought: null, rateEach: null,
      rate: el.querySelector(".rate"), cost: el.querySelector(".cost"),
      costNum: el.querySelector(".costNum"), own: el.querySelector(".own"),
    };
  });
}

// Cookie Clicker's rule, verbatim in spirit: a building reveals the moment your
// LIFETIME mice have ever reached its own base price. Keyed to its own cost, not
// the previous building's — so no i===0 special case. Naturally sticky, because
// game.total only ever grows; spending never re-hides what you've earned your way
// into knowing. `owned > 0` is just a guard for loading a save.
// Takes (building, state) rather than an index into the live game, so the
// pacing simulator can ask the real question about its own hypothetical state
// instead of keeping a copy of this rule that drifts.
// You don't keep your things in a dream. The flip wipes the day economy outright
// rather than leaving it owned-but-idle, which read as broken rather than surreal,
// and it wipes the BANK and the LIFETIME COUNT too so night is a genuine restart
// rather than a victory lap spending a day-sized fortune.
//
// The Lab goes with the rest. It used to be exempt — the building that caused the
// dream, still running inside it — but exempting one day building meant night opened
// on ~2750 mps of carried income and the seed holes were decorative. Night now opens
// on the holes alone.
//
// `bought` and `unlocked` survive: they are the record of what the room has figured
// out, and re-locking day research would read as losing progress. Shared with the
// pacing sim so both phases agree on what the reset costs.
//
// Nothing is granted. The reset leaves bank, lifetime and holdings at literal zero;
// the first Hole in the Wall being free is what un-deadlocks the phase.
function nightReset(s) {
  s.mice = 0;
  s.total = 0;
  for (const b of BUILDINGS) if (!b.night) s.owned[b.id] = 0;
}

function isRevealed(b, s) {
  // Day buildings are gone from the rail at night, and this is the one place that
  // decides it. Without it the day tiers reveal again as night lifetime climbs past
  // their bases — the pacing bot even re-bought the wiped Lab, chasing Catnap's
  // already-satisfied owned-a-Lab gate.
  if (!b.night && nightOf(s.bought)) return false;
  if (s.owned[b.id] > 0) return true;
  // Night tiers past the first appear when their research is bought, not when a
  // lifetime total quietly passes their base — which could not work anyway now that
  // the flip resets lifetime to zero and the bases are small enough that every tier
  // would land at once.
  if (b.gate) return !!s.bought[b.gate];
  // The seed tier is on the rail from the moment night starts. It cannot use the
  // lifetime rule either: lifetime is 0 at the flip and this is the only thing that
  // earns, so gating it on income would deadlock the phase.
  if (b.night) return nightOf(s.bought);
  return s.total >= b.base;
}

// Cookie Clicker shows 2 teasers past your frontier (`lastLocked > 2`); we show
// 1. With five buildings, 2 would put a permanent ??? on the lab for most of a
// run — a visible ceiling, which is the opposite of the trick.
const TEASE_WINDOW = 1;

function refreshShop() {
  let lockedRun = 0, anyRevealed = false;
  for (let i = 0; i < BUILDINGS.length; i++) {
    const b = BUILDINGS[i], r = shopRows[i], owned = game.owned[b.id];

    // Night buildings don't exist during the day — no row, no tease, and no
    // effect on the day list's lockedRun counting.
    if (b.night && !nightActive()) {
      if (r.gone !== true) { r.el.classList.add("gone"); r.gone = true; }
      continue;
    }
    // Mirror at night: the day mouse-industry vanishes from the shelf (the Lab
    // persists into the dream). Same `gone` skip, so these rows also drop out of
    // the tease counting once night falls.
    if (!b.night && nightActive()) {
      if (r.gone !== true) { r.el.classList.add("gone"); r.gone = true; }
      continue;
    }

    const revealed = isRevealed(b, game);

    if (revealed) { anyRevealed = true; lockedRun = 0; } else lockedRun++;
    const gone = lockedRun > TEASE_WINDOW;

    const price = costOf(b, owned);
    const affordable = revealed && game.mice >= price;

    const locked = !revealed;
    // The quoted rate moves when nothing else about the row does: buying an
    // UPGRADE leaves both `owned` and `locked` alone, so without this term the
    // row would keep advertising its pre-research number until the next time you
    // happened to buy that same building. Cookie Clicker sidesteps the question
    // by recomputing storedCps in CalculateGains() on every purchase of any kind.
    const rateEach = buildingMpsWith(mods, b);
    // captured before the toggle below overwrites r.locked — the text depends
    // on `revealed` too, and revealed flips on `total` with owned unchanged
    const textStale = r.ownN !== owned || r.locked !== locked || r.rateEach !== rateEach;

    if (r.gone !== gone) { r.el.classList.toggle("gone", gone); r.gone = gone; }
    if (gone) continue;
    if (r.locked !== locked) { r.el.classList.toggle("locked", locked); r.locked = locked; }
    if (r.can !== affordable) { r.el.classList.toggle("can", affordable); r.can = affordable; }
    // The blurb is a pre-purchase tease: once you own one, CSS hides .fx (see
    // .item.bought). Only Mouse Subscription has one, so in practice this class
    // does nothing on every other row — kept general because it's keyed to
    // owning, not to which building it is. Buildings can't be sold, so it flips
    // once 0->1 and stays; guarded like the others so it's not a per-tick write.
    const bought = owned > 0;
    if (r.bought !== bought) { r.el.classList.toggle("bought", bought); r.bought = bought; }

    // Every string below is a pure function of (owned, revealed), both of
    // which change only on a buy or a reveal — so they're written on change,
    // not on every 12fps tick. Unguarded this re-wrote ~360 text nodes/sec
    // with the strings they already held, and these rows sit inside a
    // backdrop-filter'd #dock, where invalidating content forces the blur to
    // re-composite. Only the affordability class runs per tick.
    // A ??? row shows its price and nothing else — CSS hides the name, rate,
    // blurb and owned count, so there's nothing to write.
    if (textStale) {
      r.ownN = owned;
      r.rateEach = rateEach;
      // A zero price renders as the word, not as "0M" — the free first Hole is a
      // beat, and a price of nothing should read as an invitation rather than a sum.
      r.costNum.textContent = price === 0 ? "free" : fmt(price);
      if (revealed) {
        r.own.textContent = owned;
        // Cookie Clicker's two tooltip lines, split by whether you own any yet:
        // "N producing X/s" once you do, "each produces X/s" as the pre-purchase
        // pitch. Both quote the post-research rate, so the rows sum to the HUD.
        // Keyed on `owned` rather than the rate being positive — a genuine zero
        // (a day building idling through the night) is a fact about your stock,
        // not a reason to fall back to the sales pitch.
        r.rate.innerHTML = owned > 0
          ? `${currencyIconSVG()}${fmt(rateEach * owned)}/s`
          : `+${currencyIconSVG()}${fmt(rateEach)}/s each`;
      }
    }
    r.cost.classList.toggle("no", !affordable);
  }

  // Revealed is keyed to lifetime mice, which only grows — so this flips on
  // once and stays. Unguarded: both of these are idempotent class toggles.
  buildingSecEl.classList.toggle("show", anyRevealed);
  syncDock();
}

function buy(i) {
  const b = BUILDINGS[i];
  if (!isRevealed(b, game)) return;
  const price = costOf(b, game.owned[b.id]);
  if (game.mice < price) return;
  game.mice -= price;
  game.owned[b.id] += 1;
  // REQUIRED, not defensive: the synergy effects (crossBuilding,
  // clickPerBuilding) read game.owned, so their multipliers are only correct
  // as of the last recalc(). Omit this and the bonus silently freezes at
  // whatever it was when you bought the upgrade — buying more Robo-Cats does
  // nothing, and the game looks entirely fine while the number is wrong.
  recalc();
  refreshHud(); refreshShop(); refreshUpgrades(); save();
}

// ---------------------------------------------------------------------------
// UPGRADE SHOP — rows are rebuilt only when the visible SET changes (an unlock
// or a purchase), not per frame; affordability restyles in place.
// ---------------------------------------------------------------------------
let upRows = new Map(); // key -> {el, can, cost}
let upSig = "";
function refreshUpgrades() {
  // At night the day research is off the rail entirely (see onRailInPhase). The day
  // economy has been wiped, so those rows would price improvements to buildings you
  // no longer own — and the twist reads as a fresh start only if the shop looks like
  // one. Mirrors refreshShop, which already drops the day BUILDINGS at night.
  const shown = UPGRADES.filter(u => !game.bought[u.key] && isUnlocked(u) && onRailInPhase(u));
  const sig = shown.map(u => u.key).join(",");

  if (sig !== upSig) {
    // While a purchase burst is in flight, hold the shop's scroll position
    // against the BOTTOM of its content across this rebuild, so the building
    // rows never move under a tapping thumb.
    //
    // Upgrades sit above Buildings in one scroller now, and a building purchase
    // routinely reveals a research — it crosses a lifetime-mice or owned-count
    // gate. scrollTop is measured from the TOP, so the browser holds it fixed
    // and everything below the insert drops by a row: the row you just tapped
    // and are about to tap again. In a game that buys on a single click with no
    // confirm, that's a mis-buy, and it was worth 75px here — most of a row.
    //
    // The browser's own scroll anchoring is meant to absorb exactly this and
    // can't, twice over: it is suppressed while scrollTop is 0 (the usual state
    // of a shop this length), and the rebuild below destroys every node it
    // could have anchored to.
    //
    // ONLY during a tap burst, though. This function runs ~12x/sec off the
    // frame loop, so an always-on hold fires for reveals nobody triggered — and
    // since the list only ever grows, holding the bottom every time walks the
    // scroller to the end and leaves it there. Measured: two upgrade rows on
    // screen for the rest of the run, every new research revealed above the
    // fold where it is never seen. A shop you can't be startled by is worth
    // less than one you can't misfire in, but not much less. Idle reveals get
    // the plain reflow, which puts the new row on screen.
    //
    // Distance-from-bottom rather than a scrollTop delta, so the case where the
    // list is SHORTER than the cap comes out right for free: #dock is fixed to
    // the bottom of the screen and simply grows upward, scrollTop clamps back
    // to 0 on its own, and this is a no-op. It equally covers a row LEAVING the
    // list when an upgrade is bought.
    const hold = performance.now() - lastShopTapAt < SHOP_HOLD_MS;
    // Guarded: reading scrollHeight forces layout, so don't pay for it when the
    // shop is reflowing untouched.
    const fromBottom = hold ? shopScrollEl.scrollHeight - shopScrollEl.scrollTop : 0;
    upSig = sig;
    upgradesEl.innerHTML = "";
    upRows = new Map();
    for (const u of shown) {
      const el = document.createElement("button");
      el.className = "item up";
      // u.cost is a table constant, so the price is rendered once here rather
      // than rewritten through the affordability change-detector below — which
      // only ever wrote the same string back and implied the cost could change.
      el.innerHTML =
        `<div class="icon">${u.icon}</div>
         <div class="body">
           <div class="nm">${u.name}</div>
           <div class="fx">${effectText(u)}</div>
           <div class="cost">${currencyIconSVG()}<span class="costNum">${fmt(u.cost)}</span></div>
         </div>`;
      el.addEventListener("click", () => buyUpgrade(u.key));
      upgradesEl.appendChild(el);
      upRows.set(u.key, { el, cost: el.querySelector(".cost") });
    }
    upgradeSecEl.classList.toggle("show", shown.length > 0);
    syncDock();
    // After the show/hide toggles above, so the layout being measured is final.
    // Assigning past the scrollable range is fine — the browser clamps it.
    if (hold) {
      programmaticScroll = true;
      shopScrollEl.scrollTop = shopScrollEl.scrollHeight - fromBottom;
      requestAnimationFrame(() => { programmaticScroll = false; });
    }
    // The set changed, so the unseen count did too. updSeen() only runs off the
    // scroll tick, and a reveal that nobody scrolls for would otherwise leave
    // the badge stale until the next 300ms poll.
    refreshBadge();
  }

  for (const u of shown) {
    const r = upRows.get(u.key);
    const affordable = game.mice >= u.cost;
    r.el.classList.toggle("can", affordable);
    r.cost.classList.toggle("no", !affordable);
  }
}

function buyUpgrade(key) {
  const u = UPGRADES.find(x => x.key === key);
  if (!u || game.bought[u.key] || !isUnlocked(u) || game.mice < u.cost) return;
  const nightBefore = nightActive();
  game.mice -= u.cost;
  game.bought[u.key] = 1;
  recalc();
  // Normalised defensively: night upgrades are singular today, so `.type`
  // happens to work — but it silently reads undefined the day one is authored
  // as an array, and the phase flip would just never fire.
  syncPhase(); // no special-casing the night effect — phase follows the fold
  // The twist just fired LIVE (a real purchase flipped day->night, not a load or
  // a dev preset — those call syncPhase directly). Take the screen for the beat.
  if (!nightBefore && nightActive()) {
    nightReset(game);
    recalc();
    runNightCutscene();
  }
  refreshHud(); refreshShop(); refreshUpgrades(); save();
}

// ---------------------------------------------------------------------------
// HUD
// ---------------------------------------------------------------------------
// The <b> is created once in the markup (which reads "per second: 0", CC's
// exact phrasing) and only its text is rewritten — innerHTML here meant an
// HTML parse and a destroyed/recreated <b> 12x/sec plus once per pet, from
// boot, in both phases, forever. The label is static text OUTSIDE the <b> for
// exactly that reason: it never changes, so it never needs to be written.
const cpsValEl = cpsEl.querySelector("b");
function refreshHud() {
  // The bank is a whole number of mice, always. It is a COUNT of things you can
  // spend, so a fractional tail is meaningless — you cannot buy with 0.4 of a
  // mouse — and fmt keeps one decimal below 10 by default, which is exactly the
  // range the opening minute lives in.
  //
  // Math.floor, not fmt(n, 0): toFixed ROUNDS, so 9.7 would print as "10" while
  // the first Mouse Subscription still costs 10 and buy() still refuses. Never
  // claim a bank you cannot spend. Above 10 fmt already floors, so this only
  // changes the opening.
  countEl.textContent = fmt(Math.floor(game.mice));
  // The top-of-screen rate is a headline number, not a precise readout: it
  // ticks constantly and a fractional tail ("7.4 per second") reads as noise.
  // floats=0 forces a whole number here only — fmt still keeps decimals for
  // prices, per-building rates and effect text everywhere else.
  cpsValEl.textContent = fmt(baseCps(), 0);
}

// ---------------------------------------------------------------------------
// CLICK / PET
// ---------------------------------------------------------------------------
function floatNum(x, y, text) {
  const f = document.createElement("div");
  f.className = "float"; f.textContent = text;
  f.style.left = x + "px"; f.style.top = y + "px";
  stageEl.appendChild(f);
  f.addEventListener("animationend", () => f.remove());
}

// ONE mouse design, shared by the click-pop particle and the night wall (see
// drawWallMouse) — was two separate systems (a plush-toy SVG here, a plain
// ellipse there) with two separate palettes; unified to a single shape and a
// single color table. The wall's usage is fixed-per-role (yellow always
// spells the word; each scenery element hardcodes one of the other four —
// see MOON_SCENE), so these are canonical hex values, not a random draw;
// click-pops draw from the same table uniformly at random for cosmetic
// variety. Chosen over the previous click-only "toy bin photo" palette
// because it reuses the game's existing accents instead of adding new hues:
// yellow == --gold (also the golden-mouse bonus's color), green sits close to
// --neon (the core UI teal). The two palettes were already near-identical —
// this just resolves the small deltas (a bluer green, a warmer pink) toward
// whichever hex already has a job to do elsewhere in the game.
const MOUSE_COLORS = { yellow: '#ffd44d', blue: '#5fb0ff', pink: '#ff6fa5', green: '#5fe0a0', purple: '#b48cff' };
const MOUSE_COLOR_LIST = Object.values(MOUSE_COLORS);

// The canonical mouse geometry, in a 54x28 box facing right. Named here rather
// than inlined into mouseSVG because there are now THREE renderers of this same
// animal — the click-pop particle, the golden mouse (goldenMouseSVG), and the
// night wall (drawWallMouse, which re-expresses these very numbers as canvas
// path calls). Anything that draws a mouse builds from these, so a tweak to the
// silhouette lands everywhere at once instead of in two places out of three.
const MOUSE_TAIL_D = "M12 17 C4 21 2 10 8 7";
const MOUSE_BODY_D = "M51 16 C46 8 37 4 27 5 C16 6 10 10 10 16 C10 21 17 24 27 24 C37 24 47 21 51 16 Z";
const MOUSE_EAR = { cx: 33, cy: 7, r: 4.6 };
const MOUSE_EYE = { cx: 42, cy: 12, r: 1.8 };
const MOUSE_KEYLINE = "#f4f4f2";

// The mouse as SVG markup. `fill` is any paint — a flat hex for the click-pops,
// a gradient url() for the golden one. `k` scales the keyline: the golden mouse
// draws its copy shrunk inside a saucer dome, where a 1.0 keyline would thin
// out to a hairline, so it asks for a heavier one to compensate.
const mouseParts = (fill, k = 1) =>
  `<path d="${MOUSE_TAIL_D}" fill="none" stroke="${fill}" stroke-width="${2.6 * k}" stroke-linecap="round"/>
   <path d="${MOUSE_BODY_D}" fill="${fill}" stroke="${MOUSE_KEYLINE}" stroke-width="${2 * k}" stroke-linejoin="round"/>
   <circle cx="${MOUSE_EAR.cx}" cy="${MOUSE_EAR.cy}" r="${MOUSE_EAR.r}" fill="${fill}" stroke="${MOUSE_KEYLINE}" stroke-width="${2 * k}"/>
   <circle cx="${MOUSE_EYE.cx}" cy="${MOUSE_EYE.cy}" r="${MOUSE_EYE.r}" fill="#0a0b10"/>`;

// Currency icon — the mouse-shaped coin next to every price. Checked Cookie
// Clicker's own live DOM for how they handle this: .price::before is a fixed
// 16x16 cookie sprite with NO ".disabled" variant anywhere in their CSS —
// only the price NUMBER'S color flips green/red on affordability, the icon
// never does. Same rule here: one constant color (--neon, the UI's existing
// teal accent — unclaimed by both day's green/red cost colors and night's
// gold/brown ones, so it can't be misread as an afford/can't-afford cue), and
// it's a literal `fill`, not `currentColor`, so .cost's color toggle can
// never touch it even by accident.
//
// Cropped to the head (nose/ear/eye), not the full 54x28 body — tested both at
// real size (~15-18px CSS): the full silhouette's tail-to-nose taper is too
// thin a shape to survive that small and just reads as a flat pill, where
// CC's cookie stays legible that tiny because it's already roughly circular.
// The head crop is closer to square, and its ear-ring + eye dot give it two
// distinguishing marks at a glance, the way the cookie's choc-chip flecks do.
const currencyIconSVG = () =>
  `<svg class="coin" viewBox="21 1 30 26" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${mouseParts("var(--neon)")}</svg>`;

// Per-click particle: a plush mouse pops out of the tap, arcs under gravity,
// spins, fades — Cookie Clicker's flying-cookie feedback, retoyed. Body keeps
// the sticker-style white keyline so it reads as the same art family as Hex.
const mouseSVG = c =>
  `<svg viewBox="0 0 54 28" xmlns="http://www.w3.org/2000/svg">${mouseParts(c)}</svg>`;

// Originally sized to match the wall mice's rendered footprint — the wall mouse
// measured ~15.2x7.2 CSS px against this particle's ~31x14.4 native tight-bbox,
// hence 0.5. That match no longer holds: WALL_MOUSE_R halved the wall mice to
// ~7.6px and this stayed put, so a night pop is now about twice a wall mouse.
// Deliberate. The pop is tap feedback in the foreground, spawned at the finger
// and gone in under a second, so it answers to legibility at arm's length
// rather than to the wall's camera distance; matching the wall would leave a
// ~7px smear that reads as nothing at all. Drop this to 0.25 if the two are
// ever meant to line up again.
const NIGHT_POP_SCALE = 0.5;

const pops = [];
const POP_MAX = 40; // hard cap so a Zoomies tap-storm can't flood the DOM on mobile
function spawnMousePop(x, y) {
  if (pops.length >= POP_MAX) pops.shift().el.remove();
  const el = document.createElement("div");
  el.className = "mousePop";
  el.innerHTML = mouseSVG(MOUSE_COLOR_LIST[(Math.random() * MOUSE_COLOR_LIST.length) | 0]);
  stageEl.appendChild(el);
  const dir = Math.random() < 0.5 ? -1 : 1; // flip the art to face its direction of travel
  pops.push({
    el, x, y,
    vx: dir * (30 + Math.random() * 100),
    vy: -(160 + Math.random() * 200),
    rot: (Math.random() - 0.5) * 40,
    vr: (Math.random() - 0.5) * 420,
    life: 0.9,
    flip: dir,
  });
}
function updatePops(dt) {
  // Read once per frame, not per particle — nightActive() re-derives from
  // game.bought every call, and there can be up to POP_MAX of these.
  const nightScale = nightActive() ? NIGHT_POP_SCALE : 1;
  for (let i = pops.length - 1; i >= 0; i--) {
    const p = pops[i];
    p.life -= dt;
    if (p.life <= 0) { p.el.remove(); pops.splice(i, 1); continue; }
    p.vy += 980 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.rot += p.vr * dt;
    p.el.style.opacity = Math.min(1, p.life / 0.35);
    // translate positions the (unscaled) box's center at (x,y); scale then
    // shrinks around that same center (the element's default transform-
    // origin), so the shrink doesn't need its own offset correction.
    p.el.style.transform =
      `translate(${p.x - 18}px, ${p.y - 14}px) rotate(${p.rot}deg) scale(${p.flip * nightScale}, ${nightScale})`;
  }
}

let squash = 0; // 0..1 pet animation
// Petting streak. Feeds two idle animations (the purr, and the slow blink she
// gives you for a sustained streak), so it lives here at the one place a pet is
// known — updateCat only ever reads it. Wall-clock, not frame count: the streak
// is about how you're touching her, which shouldn't change with framerate.
let lastPetAt = -1e9, petStreak = 0, slowBlinkStart = -1;
// Night-poke state: how many times you've prodded the sleeping cat in quick
// succession, so a fifth insistent tap can escalate from "Zzz" to a grumble.
let lastPokeAt = -1e9, nightPokes = 0;
const NIGHT_GRUMBLE_POKES = 5;
function pet(clientX, clientY) {
  const rect = stageEl.getBoundingClientRect();
  const x = clientX - rect.left, y = clientY - rect.top;

  // Night: Hex is asleep and petting is no longer a mechanic. Rather than mint
  // mice she gives a diegetic sleepy reaction — a small stir + a rising "Zzz",
  // with NO "+N" and NO mice. The absence of the number the player has floated
  // all day is the real signal ("that did nothing"); the stir just says asleep,
  // not misfired. Keep prodding and she grumbles. No nudge toward the wall —
  // the reveal earns the eye on its own.
  if (nightActive()) {
    const now = performance.now();
    if (now - lastPokeAt > PET_STREAK_WINDOW_MS) nightPokes = 0;
    nightPokes++; lastPokeAt = now;
    if (nightPokes >= NIGHT_GRUMBLE_POKES) {
      squash = 1;                       // a bigger, annoyed stir (longer bounce)
      floatNum(x, y, "grr…");
      nightPokes = 0;                   // reset so a sustained tap-storm re-grumbles
    } else {
      squash = 0.6;                     // a gentle half-stir
      floatNum(x, y, "Zzz");
    }
    return;                             // no mice, no mouse-pop, no HUD write
  }

  const gain = clickGain();
  game.mice += gain; game.total += gain; game.clicks++;
  squash = 1;

  const now = performance.now();
  // A gap longer than the window means you stopped petting and started again —
  // that's a new streak, not a continuation.
  if (now - lastPetAt > PET_STREAK_WINDOW_MS) petStreak = 0;
  petStreak++; lastPetAt = now;
  // Earned, not periodic: she only offers the slow blink after you've kept it
  // up. Streak resets on spend so it has to be earned again, and it can't
  // interrupt one already running (slowBlinkStart < 0), or a tap-storm would
  // restart it every frame and the lids would never actually open.
  if (IDLE.slowBlink && petStreak >= PET_STREAK_NEEDED && slowBlinkStart < 0 && !nightActive()) {
    slowBlinkStart = now;
    petStreak = 0;
  }

  floatNum(x, y, "+" + fmt(gain));
  spawnMousePop(x, y);
  refreshHud();
}

const catEl = $("#catWrap"), hexCatEl = $("#hexCat"), catMotionEl = $("#catMotion");
const catFaceEl = $("#catFace"), earLeftEl = $("#earLeft"), earRightEl = $("#earRight");
const irisLeftEl = $("#irisLeft"), irisRightEl = $("#irisRight");
const eyeLeftEl = $("#eyeLeft"), eyeRightEl = $("#eyeRight");
const whiskersEl = $("#whiskers"), mouthEl = $("#mouth");
// Listener lives on the svg, not #catWrap: hit-testing an SVG shape element
// defaults to its painted area (fill/stroke), not its bounding box, so this
// alone makes petting require an actual tap on Hex's silhouette — same as
// clicking the cookie in Cookie Clicker, not just anywhere on the stage.
hexCatEl.addEventListener("pointerdown", e => { e.preventDefault(); pet(e.clientX, e.clientY); }, { passive: false });

// ---------------------------------------------------------------------------
// The golden mouse's art. Was the 🐭 emoji, which put a stray third-party glyph
// next to our own hand-drawn mice — the one thing on the stage not in the game's
// art family. Cookie Clicker is the precedent worth copying here, but precisely:
// its golden cookie is NOT the big cookie recolored, nor the click particle —
// all three are separate assets (perfectCookie.png, an icons.png tile, and
// goldCookie.png). What they share is that a golden cookie is unmistakably a
// COOKIE. So: same rule, same animal — our exact mouse silhouette, gilded.
//
// Gold is a gradient rather than a flat fill because flat #ffd44d reads as "the
// yellow mouse" (a real click-pop color, MOUSE_COLORS.yellow) instead of "metal".
// The light-to-dark ramp plus the gleam is what sells it as a different material
// rather than a fifth palette entry.
// Day: the mouse, gilded. Same 54x28 box as the click-pop, so it sits in the
// same art family at a glance — only the material differs.
const goldenMouseSVG = () =>
  `<svg viewBox="0 0 54 28" xmlns="http://www.w3.org/2000/svg">
     <defs>
       <linearGradient id="gmBody" x1="0" y1="0" x2="0" y2="1">
         <stop offset="0" stop-color="#fff6c4"/><stop offset=".45" stop-color="#ffd44d"/><stop offset="1" stop-color="#c98a12"/>
       </linearGradient>
     </defs>
     ${mouseParts("url(#gmBody)")}
     <!-- Specular gleam. Confined to the upper-REAR flank (x<26): the ear is a
          circle at x 28.4-37.6, and a highlight long enough to reach past that
          reads as a scratch across the face rather than light on a curve. -->
     <path d="M14 14 C16 11 20 9.4 25 9" fill="none" stroke="#fffbe6" stroke-width="1.7" stroke-linecap="round" opacity=".8"/>
   </svg>`;

// Night: same mouse, now piloting. The saucer is night-mode-only, so it's built
// from the same gold the night UI already uses and the pilot is the SHARED
// silhouette (mouseParts) scaled down — not a redraw, so it can't drift from the
// mice on the wall below it.
//
// The pilot drives every other number here. It has to stay READABLE as our mouse
// inside a 78px box, which sets its scale; the dome then has to be big enough to
// contain it, and the hull wide enough to look like it's carrying the dome. So
// the dome is deliberately huge relative to a real flying saucer — a screen-
// accurate thin canopy would shrink the pilot to an unrecognizable speck, which
// would defeat the whole point of the redesign.
const SAUCER_MOUSE_SCALE = 0.58;
const SAUCER_DOME_R = 19, SAUCER_DOME_BASE = 32, SAUCER_CX = 32;
// The pilot is centered on its INK, not on its 54x28 box. The art doesn't fill
// that box — it spans x 2..51 (tail tip to nose) and y 2.4..24 (ear top to
// belly), so the box center (27,14) sits low and right of the drawing's actual
// middle. Centering by the box parked the tail outside the dome's left rim while
// leaving dead space on the right; these are that true visual center.
const SAUCER_PILOT_CX = 26.5, SAUCER_PILOT_CY = 13.2;
const goldenSaucerSVG = () => {
  // Cockpit center: above the dome's own center, since the dome's lower half is
  // swallowed by the hull and only the top reads as open space.
  const cy = 24;
  const tx = SAUCER_CX - SAUCER_PILOT_CX * SAUCER_MOUSE_SCALE, ty = cy - SAUCER_PILOT_CY * SAUCER_MOUSE_SCALE;
  return `<svg viewBox="0 0 64 54" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="gsBody" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff6c4"/><stop offset=".45" stop-color="#ffd44d"/><stop offset="1" stop-color="#c98a12"/>
      </linearGradient>
      <linearGradient id="gsHull" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffe9a3"/><stop offset=".5" stop-color="#eab52c"/><stop offset="1" stop-color="#a8730d"/>
      </linearGradient>
      <linearGradient id="gsBeam" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff3b0" stop-opacity=".5"/><stop offset="1" stop-color="#ffd44d" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="M24 42 L16 54 L48 54 L40 42 Z" fill="url(#gsBeam)"/>
    <g transform="translate(${tx.toFixed(2)},${ty.toFixed(2)}) scale(${SAUCER_MOUSE_SCALE})">
      ${mouseParts("url(#gsBody)", 1.6)}
    </g>
    <!-- Canopy, drawn OVER the pilot. Kept near-clear (.14) on purpose: an
         opaque enough tint to read as "glass" also greys out the gold behind it,
         and the pilot is the one thing here that must survive. The rim keyline
         and the top sheen do the work of saying "glass" instead. -->
    <path d="M${SAUCER_CX - SAUCER_DOME_R} ${SAUCER_DOME_BASE} A${SAUCER_DOME_R} ${SAUCER_DOME_R} 0 0 1 ${SAUCER_CX + SAUCER_DOME_R} ${SAUCER_DOME_BASE} Z"
          fill="#cfeaff" fill-opacity=".14" stroke="${MOUSE_KEYLINE}" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M20 26 C22 19 27 15 33 14.4" fill="none" stroke="#fffbe6" stroke-width="1.9" stroke-linecap="round" opacity=".7"/>
    <ellipse cx="${SAUCER_CX}" cy="37" rx="31" ry="6.2" fill="url(#gsHull)" stroke="${MOUSE_KEYLINE}" stroke-width="1.8"/>
    <circle cx="12" cy="37.5" r="1.8" fill="#fffbe6"/>
    <circle cx="32" cy="39.4" r="1.8" fill="#fffbe6"/>
    <circle cx="52" cy="37.5" r="1.8" fill="#fffbe6"/>
  </svg>`;
};

// GOLDEN MOUSE — the fun spike. Spawns every ~40–90s, drifts, must be tapped
// before it escapes. Catching it always triggers ZOOMIES: pet power x6 for 7s.
// ---------------------------------------------------------------------------
// Every catch gives the same buff — no roll, so a team meets the mechanic on
// its first golden rather than on a 30% chance, which matters in a 10-minute
// room. Zoomies multiplies PETS and nothing else: that makes a catch a
// 7-second all-hands tapping sprint the room can act on, where a buff on idle
// income would pay out the same whether anyone taps or not.
// Both knobs are named because the pacing simulator reads them too — retuning
// Zoomies here must not leave the sim reporting a stale timeline. They live up
// in the BALANCE block rather than here, because foldMods seeds mods.zoomMult /
// mods.zoomTime from them and runs long before this line — a `const` here would
// be in its temporal dead zone at that point and throw on load.
const GOLD_MARGIN = 10;         // px of stage edge the golden won't drift past
const GOLD_MIN_S = 40, GOLD_MAX_S = 90;              // spawn window
const GOLD_MEAN_S = (GOLD_MIN_S + GOLD_MAX_S) / 2;   // the sim's mean gap
// The FIRST golden of a run waits longer, landing ~1:50–2:40 — late in the
// opening era, "a taste" per the design doc. It is gated on a run rather than a
// page load: a save that has already caught one uses the normal window, so a
// mid-game reload doesn't re-serve the intro pause.
// The wait is what makes the catch worth anything. Pet power opens at 1
// mouse/pet and the first building costs 10, so a 7s sprint landing at 0:40 is
// worth ~10x the entire first purchase — it would erase the opening curve
// before the player has read the shop.
// Pulled in twice, 2:30–3:30 then 1:50–2:40, chasing a day that keeps getting
// shorter: it now finishes at 2:48 for a team of four mashing, so even the second
// window served a fast room its first golden with ~30s of daylight left. Goldens
// are day-only content in practice — Zoomies multiplies pets and pets earn
// nothing once Hex is asleep — and the whole golden line (three Window Perches,
// Pounce Reflex, Chin Scritch) has to pay for itself inside that window or it is
// rows nobody sensibly buys.
//
// This is also the strongest single lever on NIGHT length, which is not obvious
// from here: Lucky Number 6 is gated on catching six goldens, so how early the
// first one arrives sets when the night's ×6 lands. Cheapening the Cardboard
// Castle above shortened the day slightly, which cost a fast room a golden and
// pushed the 8-pets/s run from 7:12 to 8:42 — this window pulls it back to 7:04.
// It has to move with the length of the day; it is not an absolute.
const GOLD_FIRST_MIN_S = 90, GOLD_FIRST_MAX_S = 130;
let goldTimer = 0, goldActive = false, goldLifeLeft = 0, goldVx = 0, goldVy = 0, goldX = 0, goldY = 0;
// The reachable box, in #stage-local px. #stage is the full viewport height,
// but #hud (the score) and #dock (the shop) are position:fixed overlays ON TOP
// of it — so "inside the stage" is not the same as "tappable", and the golden
// must stay clear of both or it can't be caught. Both are measured per call
// rather than cached: the dock's height moves as the shop opens, collapses, and
// recedes for the night cutscene, and the golden has to react mid-flight. An
// overlay that's hidden or faded out isn't occluding anything, so it doesn't
// count against the box.
function goldBounds() {
  const sr = stageEl.getBoundingClientRect();
  const gw = goldenEl.offsetWidth || 62, gh = goldenEl.offsetHeight || 62;
  const occluderRect = el => {
    if (!el) return null;
    const cs = getComputedStyle(el);
    if (cs.display === "none" || cs.visibility === "hidden" || +cs.opacity === 0) return null;
    return el.getBoundingClientRect();
  };
  let minY = GOLD_MARGIN, maxY = sr.height - gh - GOLD_MARGIN;
  const hr = occluderRect(hudEl);
  if (hr) minY = Math.max(minY, hr.bottom - sr.top + GOLD_MARGIN);
  const dr = occluderRect(dockEl);
  if (dr) maxY = Math.min(maxY, dr.top - sr.top - gh - GOLD_MARGIN);
  const minX = GOLD_MARGIN, maxX = Math.max(GOLD_MARGIN, sr.width - gw - GOLD_MARGIN);
  // If the overlays leave no gap at all (very short viewport, shop wide open),
  // collapse to the midpoint of what's left instead of inverting the box — a
  // golden pinned to one line still beats one that bounces off nothing.
  if (maxY < minY) { const mid = (minY + maxY) / 2; minY = maxY = mid; }
  return { minX, minY, maxX, maxY };
}
function scheduleGold(first) {
  const lo = first ? GOLD_FIRST_MIN_S : GOLD_MIN_S;
  const hi = first ? GOLD_FIRST_MAX_S : GOLD_MAX_S;
  goldTimer = (lo + Math.random() * (hi - lo)) / mods.goldenFreq; // seconds
}

function spawnGold() {
  goldActive = true;
  goldLifeLeft = 9 + mods.goldenLife; // seconds on screen (goldenLife upgrades extend this)
  // Art is chosen per spawn, not once at boot: night unlocks mid-session, and a
  // golden that's already drifting when it flips would otherwise keep the wrong
  // vehicle until the next one. Per-spawn is also the only moment it can change
  // without visibly swapping under the player's cursor.
  const saucer = nightActive();
  goldenEl.classList.toggle("saucer", saucer);
  goldenEl.innerHTML = saucer ? goldenSaucerSVG() : goldenMouseSVG();
  goldenEl.setAttribute("aria-label", saucer ? "Golden mouse in a flying saucer" : "Golden mouse");
  // Spawn inside the reachable box (set AFTER the art swap above, so offsetWidth
  // reflects the mouse-vs-saucer size this spawn actually uses).
  const b = goldBounds();
  goldX = b.minX + Math.random() * (b.maxX - b.minX);
  goldY = b.minY + Math.random() * (b.maxY - b.minY);
  const ang = Math.random() * Math.PI * 2, sp = 22 + Math.random() * 18;
  goldVx = Math.cos(ang) * sp; goldVy = Math.sin(ang) * sp;
  // Position BEFORE revealing. moveGold() writes left/top too, but it runs
  // before the spawn check in the frame loop, so it can't touch this spawn
  // until the next frame — without seeding them here the element paints one
  // frame at the previous golden's spot (or 0,0 on the first spawn) and then
  // jumps. opacity is already reset by despawnGold(); set it here too so spawn
  // fully defines the visible state rather than trusting that cleanup.
  goldenEl.style.left = goldX + "px";
  goldenEl.style.top = goldY + "px";
  goldenEl.style.opacity = "1";
  goldenEl.style.display = "grid";
}
function moveGold(dt) {
  if (!goldActive) return;
  goldLifeLeft -= dt;
  if (goldLifeLeft <= 0) { despawnGold(); return; }
  goldX += goldVx * dt; goldY += goldVy * dt;
  // Bounce off the same reachable box the spawn used, re-measured each frame so
  // opening the shop mid-flight herds the golden up out of the way. The box is
  // derived from the element's real size (the night saucer differs from the day
  // mouse, and offsetWidth ignores the hover animation's transform, so it's
  // stable frame to frame).
  const { minX, minY, maxX, maxY } = goldBounds();
  if (goldX < minX || goldX > maxX) { goldVx *= -1; goldX = Math.max(minX, Math.min(maxX, goldX)); }
  if (goldY < minY || goldY > maxY) { goldVy *= -1; goldY = Math.max(minY, Math.min(maxY, goldY)); }
  goldenEl.style.left = goldX + "px"; goldenEl.style.top = goldY + "px";
  goldenEl.style.opacity = goldLifeLeft < 2 ? (goldLifeLeft / 2).toFixed(2) : "1";
}
function despawnGold() {
  goldActive = false; goldenEl.style.display = "none"; goldenEl.style.opacity = "1";
  scheduleGold();
}
goldenEl.addEventListener("pointerdown", e => {
  e.preventDefault(); e.stopPropagation();
  if (!goldActive) return;
  game.goldCaught++;
  const rect = stageEl.getBoundingClientRect();
  game.zoomUntil = performance.now() + mods.zoomTime * 1000;
  floatNum(goldX - rect.left + 30, goldY - rect.top + 20, "⚡ ×" + mods.zoomMult);
  despawnGold(); refreshHud(); save();
}, { passive: false });

// ---------------------------------------------------------------------------
// NIGHT WALL — the reveal, ported from reveal-lab.html (moon scene only; the
// dice scene is concept-art per the design doc). The word is drawn from the
// 1-stroke alphabet (see GLYPHS) and every mouse faces its direction of travel;
// both were settled in the lab and are locked here, not switchable. Position is
// still a pure function of (seed, mouse index, time) — no wall state to save —
// with one exception: each mouse carries a smoothed heading vector for its
// facing, which is cosmetic and re-converges within a few frames. Lab knobs map to game
// state — mice N = f(lifetime total) via the locked geometric accumulator,
// per-shape headcounts = WALL_COUNT (the word capped at one mouse per letter),
// noise = locked 0 (wander() dropped entirely), speed = one uniform wallSpeed(),
// trail = mods.trail from the sleep-stage upgrades, and whether ANY mice show
// look like is bought (mods.neon, the Counting Mice research).
// ---------------------------------------------------------------------------
// The nine letters' staffing order, and the per-shape headcounts the ramp climbs
// toward. Both are settled in the lab; see rebuildWallCast for how they combine.
//
// REVEAL_ORDER indexes the word's visible letters, spaces excluded. It is stored
// ZERO-based while it was chosen against 1-based positions, so both are written out

function mulberry32(seed) {
  let a = seed >>> 0;

    a |= 0; a = (a + 0x6d2b79f5) | 0;

    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

// 1-STROKE ALPHABET — the word source, settled in the Reveal Lab.

// the odd one out — and reads as clean lettering rather than scratchy hatching.
