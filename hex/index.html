const wallCv = $("#wall"), wctx = wallCv.getContext('2d');
let wW = 0, wH = 0;
// Scene->screen mapping is constant between resizes, so it's computed here
// rather than inside wallSceneMap — that ran ~400k times/sec at full night
// state (90 mice x 36 samples x 2 endpoints x 60fps), redoing the same
// Math.min and divisions every time.
let wallScale = 1, wallOffX = 0, wallOffY = 0;
function resizeWall() {
  const dpr = Math.min(devicePixelRatio || 1, 3);
  wW = wallCv.clientWidth; wH = wallCv.clientHeight;
  wallCv.width = Math.round(wW * dpr); wallCv.height = Math.round(wH * dpr);
  wctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  wallScale = Math.min(wW / 390, wH / 620);
  wallOffX = (wW - 390 * wallScale) / 2;
  wallOffY = (wH - 620 * wallScale) / 2;
}
window.addEventListener('resize', () => { if (nightActive()) resizeWall(); });

let WALL_CREWS = [], WALL_WORD_LEN = 0, wallCast = [];
function loadWallScene() {
  WALL_CREWS = []; WALL_WORD_LEN = 0;
  for (const ln of MOON_SCENE.lines) {
    const s = sampleLine(ln.text);
    const scale = ln.size / 190;
    for (const letterTour of s.letters) {
      const tour = letterTour.map(p => ({
        x: ln.cx + (p.x - s.w / 2) * scale,
        y: ln.cy + (p.y - s.h / 2) * scale,
      }));
      WALL_CREWS.push({ color: MOUSE_COLORS.yellow, tour, len: tour.length, kind: 'word' });
      WALL_WORD_LEN += tour.length;
    }
  }
  for (const e of MOON_SCENE.elements) {
    const tr = tracer(); e.draw(tr);
    const sampled = tr.polys.map(p => resamplePoly(p, 6)).filter(p => p.length > 1);
    for (const compTour of components(sampled)) {
      WALL_CREWS.push({ color: MOUSE_COLORS[e.color], tour: compTour, len: compTour.length, kind: 'scenery' });
    }
  }
  rebuildWallCast();
}

// Fixed 90-mouse cast; wallMiceCount() just draws the first N. Word% and seed
// are constants, so the cast never rebuilds after night begins.
function rebuildWallCast() {
  wallCast = [];
  const wordCrews = [], scenCrews = [];
  WALL_CREWS.forEach((c, idx) => (c.kind === 'word' ? wordCrews : scenCrews).push(idx));
  const PAD = 14;
  const weights = scenCrews.map(i => WALL_CREWS[i].len + PAD);
  const wSum = weights.reduce((a, b) => a + b, 0) || 1;
  const assigned = scenCrews.map(() => 0);
  let wordOrdinal = 0, scenOrdinal = 0;
  for (let i = 0; i < WALL.maxMice; i++) {
    const rng = mulberry32(WALL.seed + i * 7919);
    const m = { i, p01: rng() };
    if (rng() * 100 < WALL.wordPct && wordCrews.length) {
      m.crew = wordCrews[wordOrdinal++ % wordCrews.length];
    } else if (scenCrews.length) {
      scenOrdinal++;
      let bi = 0, bd = -Infinity;
      for (let k = 0; k < scenCrews.length; k++) {
        const deficit = scenOrdinal * (weights[k] / wSum) - assigned[k];
        if (deficit > bd) { bd = deficit; bi = k; }
      }
      assigned[bi]++;
      m.crew = scenCrews[bi];
    } else m.crew = 0;
    m.color = WALL_CREWS[m.crew].color;
    wallCast.push(m);
  }
  const byCrew = new Map();
  for (const m of wallCast) {
    if (!byCrew.has(m.crew)) byCrew.set(m.crew, []);
    byCrew.get(m.crew).push(m);
  }
  for (const members of byCrew.values())
    members.forEach((m, k) => { m.phase = k / members.length; });
}

// ping-pong along the crew's tour; noise is locked to 0 so no wander term.
// Writes into a caller-supplied point rather than allocating: this runs ~200k
// times/sec at full night state and every caller reads .x/.y immediately and
// never retains the result, so the ~600k short-lived {x,y} per second were
// pure GC pressure — the thing that shows up as periodic frame drops on a
// phone rather than a uniformly lower framerate. Lerp in scene space, map to
// screen once at the end (was mapping both endpoints, then lerping).
function wallPosAt(m, t, out) {
  const crew = WALL_CREWS[m.crew];
  const L = crew.len;
  let sx, sy;
  if (L < 2) {
    const p0 = crew.tour[0] || { x: 195, y: 310 };
    sx = p0.x; sy = p0.y;
  } else {
    const ppms = crew.kind === 'word' ? WORD_PPMS_FRAC * WALL_WORD_LEN : SCENE_PPMS;
    const cyc = 2 * (L - 1);
    let f = ((t * ppms + m.phase * cyc) % cyc + cyc) % cyc;
    if (f > L - 1) f = cyc - f;
    const idx = Math.min(L - 2, Math.floor(f)), frac = f - idx;
    const a = crew.tour[idx], b = crew.tour[idx + 1];
    sx = a.x + (b.x - a.x) * frac;
    sy = a.y + (b.y - a.y) * frac;
  }
  out.x = wallOffX + sx * wallScale;
  out.y = wallOffY + sy * wallScale;
  return out;
}
// Same silhouette as mouseSVG (the click-pop particle) — body blob with a
// white keyline, one ear, a dark eye dot, a curled tail — reproduced here as
// canvas path calls by scaling/translating mouseSVG's own 54x28 coordinate
// space, point for point, so the two can't visually drift apart. `r` plays
// the same role it did in the old shape (roughly the body's vertical half-
// size), so existing call sites don't need retuning.
function drawWallMouse(x, y, color, r) {
  const s = r / 10, cx = 30.5, cy = 14;
  const P = (px, py) => [x + (px - cx) * s, y + (py - cy) * s];
  const seg = (c1x, c1y, c2x, c2y, ex, ey) => {
    const [a, b] = P(c1x, c1y), [c, d] = P(c2x, c2y), [e, f] = P(ex, ey);
    wctx.bezierCurveTo(a, b, c, d, e, f);
  };

  // tail — a curled stroke off the rear
  const [tx0, ty0] = P(12, 17);
  wctx.strokeStyle = color; wctx.lineWidth = r * 0.16; wctx.lineCap = 'round';
  wctx.beginPath(); wctx.moveTo(tx0, ty0);
  seg(4, 21, 2, 10, 8, 7);
  wctx.stroke();

  // body
  const [bx0, by0] = P(51, 16);
  wctx.beginPath(); wctx.moveTo(bx0, by0);
  seg(46, 8, 37, 4, 27, 5);
  seg(16, 6, 10, 10, 10, 16);
  seg(10, 21, 17, 24, 27, 24);
  seg(37, 24, 47, 21, 51, 16);
  wctx.closePath();
  wctx.fillStyle = color; wctx.fill();
  wctx.strokeStyle = '#f4f4f2'; wctx.lineWidth = r * 0.14; wctx.stroke();

  // ear
  const [ex, ey] = P(33, 7);
  wctx.beginPath(); wctx.arc(ex, ey, 4.6 * s, 0, 6.283);
  wctx.fillStyle = color; wctx.fill();
  wctx.strokeStyle = '#f4f4f2'; wctx.lineWidth = r * 0.14; wctx.stroke();

  // eye
  const [ix, iy] = P(42, 12);
  wctx.beginPath(); wctx.arc(ix, iy, 1.8 * s, 0, 6.283);
  wctx.fillStyle = '#0a0b10'; wctx.fill();
}

// Reused scratch points for the per-frame position math (see wallPosAt).
const wallHead = { x: 0, y: 0 }, wallScratch = { x: 0, y: 0 };
function drawWall(now) {
  if (!wW) resizeWall();
  wctx.clearRect(0, 0, wW, wH);
  const N = wallMiceCount();
  if (!N || !WALL_CREWS.length) return;
  const trailN = mods.trail, maxSeg = 16;
  // Invariant across every mouse and segment — set once per frame, not per
  // segment (that was ~189k redundant assignments/sec at full state).
  wctx.lineWidth = 1.8; wctx.lineCap = 'round';
  for (let i = 0; i < N; i++) {
    const m = wallCast[i];
    // head position: computed once and reused for both the trail's first
    // sample and the mouse itself (drawWall used to compute it twice).
    wallPosAt(m, now, wallHead);
    if (trailN > 0) {
      wctx.strokeStyle = m.color; // invariant across this mouse's segments
      let px = wallHead.x, py = wallHead.y;
      for (let j = 1; j <= trailN; j++) {
        const p = wallPosAt(m, now - j * WALL.trailDt, wallScratch);
        const far = Math.abs(p.x - px) > maxSeg || Math.abs(p.y - py) > maxSeg;
        if (!far) {
          wctx.globalAlpha = 0.5 * (1 - j / trailN);
          wctx.beginPath(); wctx.moveTo(px, py); wctx.lineTo(p.x, p.y); wctx.stroke();
        }
        px = p.x; py = p.y;
      }
      wctx.globalAlpha = 1;
    }
    drawWallMouse(wallHead.x, wallHead.y, m.color, 3.1);
  }
  // NOTE: legibility detection lived here — cov = (word mice) x (trail ms) x
  // WORD_PPMS_FRAC, crossing 0.85 — and existed only to print the proctor
  // line. Removed with the text rather than left as dead code. The wall
  // simply becoming readable is the signal now. Re-add the same formula if
  // the design doc's "gentle one-time shimmer" gets built.
}

let nightInited = false;
// Phase is a PROJECTION of folded state, not an event: every caller just
// re-asserts it and this figures out the rest. Replaces an enterNight() that
// mutated the DOM from inside the buy path plus a hand-written devExitNight()
// inverse that had already drifted to a partial copy. Idempotent and cheap —
// safe to call after any state change, forward or backward.
function syncPhase() {
  const night = nightActive();
  document.body.classList.toggle('night', night);
  hexCatEl.classList.toggle('asleep', night);
  // one-way latch: the scene is expensive to build and never needs rebuilding
  if (night && !nightInited) {
    nightInited = true;
    makeStars();
    loadWallScene();
    resizeWall();
  }
}

// Starfield, built once when night first falls (from the latch above). Seeded so
// the sky is stable across reloads/reconnects rather than reshuffling each time —
// decorative, so it needn't match other clients, but a fixed layout reads calmer.
// % positions + px sizes so it scales with the stage without a resize hook.
function makeStars() {
  if (starsEl.childElementCount) return;   // idempotent — the latch only fires once, but be safe
  const rnd = mulberry32(0x5741 ^ WALL.seed);
  const N = 54, frag = document.createDocumentFragment();
  for (let i = 0; i < N; i++) {
    const s = document.createElement("i");
    const size = (0.8 + rnd() * 1.9).toFixed(2);      // 0.8–2.7px
    s.style.left = (rnd() * 100).toFixed(2) + "%";
    s.style.top = (rnd() * 100).toFixed(2) + "%";
    s.style.width = s.style.height = size + "px";
    s.style.setProperty("--o", (0.35 + rnd() * 0.5).toFixed(2));   // base brightness 0.35–0.85
    s.style.setProperty("--dur", (2.4 + rnd() * 3.6).toFixed(2) + "s"); // slow, varied twinkle
    s.style.setProperty("--delay", (-rnd() * 6).toFixed(2) + "s");  // negative → mid-cycle at start, no unison flash-on
    frag.appendChild(s);
  }
  starsEl.appendChild(frag);
}

// The night-transition CUTSCENE. Fired once, only on the live day->night edge (a
// player buying the twist) — never on load/reconnect or a dev preset, so a
// returning player drops straight into night without replaying the beat. It
// takes the screen: the whole static shop recedes, a transparent veil locks ALL
// input (petting included), the existing yawn->zoom->reveal plays, then input
// frees and the shop fades back in.
let cutsceneLock = false;
function runNightCutscene() {
  if (cutsceneLock) return;
  cutsceneLock = true;
  dockEl.classList.add("cutscene-hidden"); // recede the whole static shop for the reveal
  cutsceneVeilEl.classList.add("on"); // nothing selectable while the beat plays
  // Duration read here (not a top-level const) so it can reference YAWN_MS, which
  // is declared further down. Kept in sync with the CSS: YAWN_MS (1300) + the
  // #catPose zoom (1800ms) = the moment the camera settles.
  setTimeout(() => {
    cutsceneVeilEl.classList.remove("on");
    dockEl.classList.remove("cutscene-hidden");
    cutsceneLock = false;
  }, YAWN_MS + 1800);
}

// ---------------------------------------------------------------------------
// CAT rendering — the SVG (#hexCat) is static markup; this just toggles
// classes/state on it per frame (squash bounce, blink, frenzy recolor).
// ---------------------------------------------------------------------------
const IRIS_LOOK = 4; // svg user-units the iris can travel off-center before it'd clip the socket
// Pupil width — independent of the eyelid squash below, and on its own axis
// (X, not Y) so a blink never resets it. Real cats rest with a vertical slit
// and round out when aroused; a golden mouse on screen is the one thing this
// game has to be excited about, so it's the trigger. `#irisLeft`/`#irisRight`
// are the pupils, not the iris — see hex-cat.svg's header comment for why the
// ids still say "iris" after the coloring flipped.
const PUPIL_SLIT = 0.22;  // resting
const PUPIL_ROUND = 1;    // dilated

// ---------------------------------------------------------------------------
// IDLE ANIMATIONS — one flag each, all independent. These are cat behaviours
// picked to hang off game state that already exists, so none of them invent a
// new mechanic. Flip any to false to cut it; nothing else reads these, so a
// single word here is the whole removal.
// ---------------------------------------------------------------------------
const IDLE = {
  chatter: true,          // jaw quivers at a golden mouse she can't reach
  whiskersForward: true,  // whiskers fan toward that same golden mouse
  slowBlink: true,        // the "I trust you" blink, earned by a petting streak
  gazeDrift: true,        // eyes wander when there's nothing to look at
  purr: false,            // rumble while she's being petted
  yawn: true,             // one big yawn as she drops into the night phase
  dreamTwitch: true,      // rare whole-head jerk while dreaming
  headTilt: true,         // an occasional curious tip of the head
  earFlick: true,         // quick independent ear twitches
  earSwivel: true,        // ears orient toward a golden mouse
};

const SLOW_BLINK_MS = 1100;
const PET_STREAK_NEEDED = 6;      // pets, within...
const PET_STREAK_WINDOW_MS = 1200; // ...this gap of each other, or it resets
const PURR_MS = 900;              // purr keeps going this long after the last pet
const YAWN_MS = 1300;

const smoothstep = x => x * x * (3 - 2 * x);
const clamp01 = x => Math.min(1, Math.max(0, x));

// Lid 1 (wide) -> ~shut -> 1, with a deliberate HOLD at the bottom. The hold is
// the entire difference between a slow blink and a long blink: a cat's slow
// blink is a held gesture, not a slow motion. Without it this just reads as
// lag.
function slowBlinkLid(p) {
  const CLOSE = 0.30, HOLD = 0.34;
  if (p < CLOSE) return 1 - 0.95 * smoothstep(p / CLOSE);
  if (p < CLOSE + HOLD) return 0.05;
  return 0.05 + 0.95 * smoothstep((p - CLOSE - HOLD) / (1 - CLOSE - HOLD));
}
// Yawn: one 0->1->0 arc driving lids shut and jaw open together, peaking
// midway. Same envelope for both so the squeeze and the gape can't desync.
const yawnEnv = p => Math.sin(Math.PI * clamp01(p));

let wasAsleep = null, yawnStart = -1;
function updateCat(t) {
  catEl.classList.toggle("squash", squash > 0.15);
  if (squash > 0) squash = Math.max(0, squash - 0.08);

  const frenzy = currentCpsBuff() > 1 || currentClickBuff() > 1;
  catEl.classList.toggle("frenzy", frenzy);

  const asleep = nightActive();

  // Yawn fires on the day->night EDGE: she yawns herself to sleep, which is the
  // one story beat this game has. Edge-detected here rather than fired from the
  // Catnap purchase because night can also arrive by loading a save or a dev
  // preset jump — and `wasAsleep` starting null means the very first frame
  // establishes the baseline instead of yawning at you on boot.
  if (wasAsleep !== null && asleep && !wasAsleep && IDLE.yawn) yawnStart = t;
  wasAsleep = asleep;

  // --- Lid overrides: the yawn and the slow blink -------------------------
  // Both need a CONTINUOUS lid value, which .blink/.asleep can't express —
  // they're binary classes. So they take the lids by writing an inline
  // transform (which beats a class rule outright) and hand them back by
  // clearing it. #eyeLeft/#eyeRight's own .06s transition just smooths the
  // handoff at each end. Yawn outranks slow blink: it only happens once, and
  // it's the phase change.
  let lidOverride = null, yawnP = -1;
  if (yawnStart >= 0) {
    yawnP = (t - yawnStart) / YAWN_MS;
    if (yawnP >= 1) { yawnStart = -1; yawnP = -1; }
    else lidOverride = 1 - 0.93 * yawnEnv(yawnP);
  }
  if (lidOverride === null && slowBlinkStart >= 0) {
    const p = (t - slowBlinkStart) / SLOW_BLINK_MS;
    if (p >= 1) slowBlinkStart = -1;
    else lidOverride = slowBlinkLid(p);
  }
  const lidBusy = lidOverride !== null;

  // asleep at night — the .asleep class owns the eyelids, so never fight it.
  // Suppressed while a lid override is running too, or the class would snap the
  // lids the instant the override let go.
  const blink = !asleep && !lidBusy && Math.sin(t / 1400) > 0.985;
  hexCatEl.classList.toggle("blink", blink);

  const lidT = lidBusy ? `scaleY(${lidOverride.toFixed(3)})` : "";
  if (eyeLeftEl.style.transform !== lidT) {
    eyeLeftEl.style.transform = lidT;
    eyeRightEl.style.transform = lidT;
  }

  // Iris: look toward the golden mouse by day; shut with the lids at night.
  // Owned entirely by JS (not a CSS class) because it has to combine a
  // look-direction translate with the same squash the lids get via .blink/
  // .asleep — an inline transform always wins over a class rule's transform,
  // so splitting this across CSS classes + JS would just fight itself.
  let lookX = 0, lookY = 0, irisScaleY = 1;
  if (lidBusy) {
    // The pupil has to ride the lid down, or it sits there full-size behind a
    // shut eye — the exact bug this block's comment already warns about.
    irisScaleY = Math.max(lidOverride, 0.05);
  } else if (asleep) {
    // REM: the lids stay shut but the eyes rove underneath, and the eyelid
    // gap swells a hair. Deliberately thematic — she's dreaming the wall
    // you're watching. Two out-of-phase sines so it never reads as a clean
    // loop.
    irisScaleY = 0.07 + 0.045 * (0.5 + 0.5 * Math.sin(t / 2600));
    lookX = 1.6 * Math.sin(t / 3100) + 0.7 * Math.sin(t / 1130);
  } else if (blink) {
    irisScaleY = 0.14;
  } else if (goldActive) {
    const cx = stageEl.clientWidth / 2, cy = stageEl.clientHeight / 2;
    const dx = (goldX + 31) - cx, dy = (goldY + 31) - cy; // golden mouse's own center, stage-relative
    const mag = Math.hypot(dx, dy) || 1;
    lookX = (dx / mag) * IRIS_LOOK;
    lookY = (dy / mag) * IRIS_LOOK;
  } else if (IDLE.gazeDrift) {
    // Nothing to look at, so she looks at nothing in particular. Without this
    // she stares dead ahead for the ~40-90s between goldens, which is most of
    // the game. Sines are MULTIPLIED, not added: one sine is a metronome
    // sweeping at constant speed, but the product stalls near either factor's
    // zero-crossing, so she drifts, dwells, drifts — closer to looking at
    // things than scanning for them.
    lookX = IRIS_LOOK * 0.5 * Math.sin(t / 2300) * Math.sin(t / 5700);
    lookY = IRIS_LOOK * 0.3 * Math.sin(t / 3300) * Math.sin(t / 7100);
  }
  // Dilated while awake AND excited: either a golden is actually out there, or
  // a Click Frenzy is running (pets worth more) — the buff a caught golden
  // leaves behind, so her eyes stay blown wide through the frenzy instead of
  // snapping shut the instant the mouse is gone. Not during sleep even if a
  // saucer is drifting past, matching the branch above where asleep never looks
  // toward it either. #irisLeft/#irisRight's own CSS transition (.12s ease-out)
  // is what makes this a dilate rather than a snap.
  const clickFrenzy = currentClickBuff() > 1;
  const pupilScaleX = (!asleep && (goldActive || clickFrenzy)) ? PUPIL_ROUND : PUPIL_SLIT;
  const irisTransform = `translate(${lookX}px, ${lookY}px) scale(${pupilScaleX}, ${irisScaleY})`;
  irisLeftEl.style.transform = irisTransform;
  irisRightEl.style.transform = irisTransform;

  // --- Jaw: yawn, else chatter -------------------------------------------
  // "Alert" = awake with a golden actually on screen. It drives the chatter and
  // the whisker fan, and it's the same condition the pupil dilation above uses
  // — one idea (prey is out there), three tells.
  const alert = !asleep && goldActive;
  let mouthScaleY = 1, mouthScaleX = 1;
  if (yawnP >= 0) {
    // Ceiling of 2.2 is geometric, not taste: the mouth is a 13-unit lip line
    // topped at y=147 and scaled from its own top edge, while the head's inner
    // chin sits at ~182 — so anything past ~2.4 stretches the jaw straight
    // through her face and hangs it outside the silhouette. Measured, not
    // guessed (mouth.getBBox() vs head.getBBox()); re-measure if the art moves.
    // X widens too, because a gape is wide — scaling Y alone just draws a
    // longer squiggle, not an open mouth.
    mouthScaleY = 1 + 1.2 * yawnEnv(yawnP);
    mouthScaleX = 1 + 0.5 * yawnEnv(yawnP);
  } else if (IDLE.chatter && alert && !lidBusy) {
    // The "ekekek" chatter at prey behind glass — here, a golden mouse drifting
    // past a cat who is a head and can do nothing about it. ~11Hz: fast enough
    // to read as a quiver, slow enough to survive a 60fps sample (above ~15Hz
    // it aliases into a blur).
    mouthScaleY = 1 + 0.5 * (0.5 + 0.5 * Math.sin(t / 14));
  }
  const mouthT = (mouthScaleY === 1 && mouthScaleX === 1)
    ? "" : `scale(${mouthScaleX.toFixed(3)}, ${mouthScaleY.toFixed(3)})`;
  if (mouthEl.style.transform !== mouthT) mouthEl.style.transform = mouthT;

  // --- Whole-head micro-motion (#catMotion) ------------------------------
  // Purr keeps running briefly after the last pet, so a steady petting rhythm
  // reads as one continuous rumble rather than restarting on every tap.
  const purring = IDLE.purr && !asleep && (t - lastPetAt) < PURR_MS;
  // ~14Hz. A real purr is ~25Hz, which is past what 60fps can show — this is
  // the fastest rumble that still renders as motion instead of aliasing.
  const purrY = purring ? 0.8 * Math.sin(t / 11) : 0;
  const dreamY = dreamTwitchOffset(t, asleep);
  const motionT = (purrY || dreamY) ? `translateY(${(purrY + dreamY).toFixed(2)}px)` : "";
  if (catMotionEl.style.transform !== motionT) catMotionEl.style.transform = motionT;

  // --- Head tilt + ears --------------------------------------------------
  // All three rest at night (the wall-reveal pose owns Hex then).
  if (asleep) {
    if (catFaceEl.style.transform) catFaceEl.style.transform = "";
    if (earLeftEl.style.transform) earLeftEl.style.transform = "";
    if (earRightEl.style.transform) earRightEl.style.transform = "";
  } else {
    const tilt = headTiltDeg(t, !alert); // only tips her head when nothing's got her attention
    const faceT = tilt ? `rotate(${tilt.toFixed(2)}deg)` : "";
    if (catFaceEl.style.transform !== faceT) catFaceEl.style.transform = faceT;
    // ears orient toward a golden mouse (like the eyes/whiskers), with quick
    // independent flicks superimposed
    let swiv = 0;
    if (IDLE.earSwivel && alert) {
      const cx = stageEl.clientWidth / 2;
      swiv = Math.max(-1, Math.min(1, ((goldX + 31) - cx) / cx)) * 6;
    }
    const rotL = swiv + earFlickDeg(t, earStateL);
    const rotR = swiv + earFlickDeg(t, earStateR);
    const eLT = rotL ? `rotate(${rotL.toFixed(2)}deg)` : "";
    const eRT = rotR ? `rotate(${rotR.toFixed(2)}deg)` : "";
    if (earLeftEl.style.transform !== eLT) earLeftEl.style.transform = eLT;
    if (earRightEl.style.transform !== eRT) earRightEl.style.transform = eRT;
  }

  updateWhiskers(t, asleep, alert);
}

// Dream twitch: a single whole-head jerk every ~9-20s while asleep, the
// paw-running dream. Deliberately rarer and bigger than the whisker twitch so
// the two read as one animal at two intensities rather than a shared tic.
// Scheduled, not sine-driven, for the same reason as the whiskers.
let dreamAt = 0, dreamUntil = 0, dreamDir = 1;
const DREAM_MS = 220;
function dreamTwitchOffset(t, asleep) {
  if (!asleep || !IDLE.dreamTwitch) { dreamAt = 0; return 0; }
  if (!dreamAt) dreamAt = t + 6000 + Math.random() * 9000;
  if (t >= dreamAt) {
    dreamUntil = t + DREAM_MS;
    dreamDir = Math.random() < 0.5 ? -1 : 1;
    dreamAt = t + 9000 + Math.random() * 11000;
  }
  if (t >= dreamUntil) return 0;
  // One damped bounce over the twitch's life, not a loop — a twitch is a single
  // event that dies out, so amplitude has to decay to zero by the end or it
  // would cut off mid-motion.
  const p = 1 - (dreamUntil - t) / DREAM_MS;
  return dreamDir * 3.2 * Math.sin(p * Math.PI * 2) * (1 - p);
}

// Head tilt: an occasional curious tip of the head, pivoting at the neck. A
// discrete scheduled gesture (ease in -> hold -> ease out), like the dream
// twitch — she only offers it when nothing else has her attention (`calm`).
let tiltAt = 0, tiltStart = -1, tiltDir = 1;
const TILT_IN = 430, TILT_HOLD = 950, TILT_OUT = 640, TILT_MAX = 7;
function headTiltDeg(t, calm) {
  if (!IDLE.headTilt) return 0;
  if (!tiltAt) tiltAt = t + 6000 + Math.random() * 9000;
  if (tiltStart < 0 && calm && t >= tiltAt) {
    tiltStart = t; tiltDir = Math.random() < 0.5 ? -1 : 1;
    tiltAt = t + 9000 + Math.random() * 12000;
  }
  if (tiltStart < 0) return 0;
  const e = t - tiltStart, dur = TILT_IN + TILT_HOLD + TILT_OUT;
  if (e >= dur) { tiltStart = -1; return 0; }
  let a;
  if (e < TILT_IN) a = smoothstep(e / TILT_IN);
  else if (e < TILT_IN + TILT_HOLD) a = 1;
  else a = 1 - smoothstep((e - TILT_IN - TILT_HOLD) / TILT_OUT);
  return tiltDir * TILT_MAX * a;
}

// Ear flick: a quick 0 -> peak -> 0 twitch of one ear over a quarter-second.
// Each ear keeps its own schedule so they fire out of sync, the way a real
// cat's do; sign points each ear's flick outward.
const EAR_FLICK_MS = 240;
const earStateL = { at: 0, start: -1, sign: -1 };
const earStateR = { at: 0, start: -1, sign: 1 };
function earFlickDeg(t, ear) {
  if (!IDLE.earFlick) return 0;
  if (!ear.at) ear.at = t + 2500 + Math.random() * 6000;
  if (ear.start < 0 && t >= ear.at) { ear.start = t; ear.at = t + 3500 + Math.random() * 8000; }
  if (ear.start < 0) return 0;
  const e = t - ear.start;
  if (e >= EAR_FLICK_MS) { ear.start = -1; return 0; }
  return ear.sign * 11 * Math.sin(Math.PI * e / EAR_FLICK_MS);
}

// Whiskers have two behaviours and one element, so they get one owner:
//   asleep — a single flick every ~5-11s, chasing something in a dream.
//            Scheduled rather than sine-driven so it stays irregular; a
//            periodic twitch reads as a machine, not an animal.
//   awake  — fanned forward whenever prey is on screen (`alert`).
// They're mutually exclusive by construction (you can't be alert while asleep),
// which is why one function can hand back a single transform without blending.
let twitchAt = 0, twitchUntil = 0, twitchDir = 1;
function updateWhiskers(t, asleep, alert) {
  let w = "";
  if (!asleep) {
    twitchAt = 0;
    // Fanned forward at prey. A scale, not a rotate, and not per-whisker: all
    // six whiskers are one <path>, so they can only ever move together — the
    // same constraint that rules out independent ear flicks on this art.
    if (IDLE.whiskersForward && alert) w = "scale(1.07, 1.12)";
  } else {
    if (!twitchAt) twitchAt = t + 4000 + Math.random() * 6000;
    if (t >= twitchAt) {
      twitchUntil = t + 320;
      twitchDir = Math.random() < 0.5 ? -1 : 1;
      twitchAt = t + 5000 + Math.random() * 6000;
    }
    if (t < twitchUntil) w = `rotate(${twitchDir * 1.6}deg)`;
  }
  if (whiskersEl.style.transform !== w) whiskersEl.style.transform = w;
}

// ---------------------------------------------------------------------------
// MAIN LOOP
// ---------------------------------------------------------------------------
let last = performance.now(), hudTick = 0, saveTick = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;

  // income (DEV.speed is 1 outside ?debug — a pure pass-through)
  const inc = cps() * dt * DEV.speed;
  if (inc > 0) { game.mice += inc; game.total += inc; }

  // buff pill countdown — click buff takes priority display if both are somehow active
  if (game.clickBuffUntil > now) {
    const left = ((game.clickBuffUntil - now) / 1000);
    buffEl.textContent = "👆 CLICK FRENZY ×" + CLICK_BUFF_MULT + " · " + left.toFixed(1) + "s";
    buffEl.style.display = "block";
  } else if (game.buffUntil > now) {
    const left = ((game.buffUntil - now) / 1000);
    buffEl.textContent = "⚡ ZOOMIES ×" + GOLD_MULT + " · " + left.toFixed(1) + "s";
    buffEl.style.display = "block";
  } else if (buffEl.style.display === "block") {
    buffEl.style.display = "none";
  }

  moveGold(dt);
  if (!goldActive) { goldTimer -= dt * DEV.speed; if (goldTimer <= 0) spawnGold(); }

  updateCat(now);
  updatePops(dt);
  if (nightActive()) drawWall(now);

  // throttle HUD/shop updates to ~12fps (cheap, avoids layout thrash)
  hudTick += dt;
  if (hudTick > 0.08) { hudTick = 0; refreshHud(); refreshShop(); refreshUpgrades(); }

  saveTick += dt;
  if (saveTick > 8) { saveTick = 0; save(); }

  requestAnimationFrame(frame);
}

document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });
window.addEventListener("pagehide", save);

// ---------------------------------------------------------------------------
// DEV TOOLS — open the game with ?debug (or #debug) to get a floating panel:
// time-scale (accelerates income + golden cadence, never click feel), grant
// buttons (pay into mice AND total, like real earning), and state presets for
// jumping around the pacing curve. Presets can go BACKWARD, which real play
// never does — syncPhase() handles that for free by re-deriving the phase
// rather than needing a hand-written inverse of the forward transition.
// ---------------------------------------------------------------------------
const DEV = { speed: 1, teamMult: 1 };
const DEV_PRESETS = {
  "fresh":    { total: 0, mice: 0, clicks: 0 },
  "early":    { total: 600, mice: 350, clicks: 60,
                owned: { shopper: 5, farm: 3 } },
  "midday":   { total: 30000, mice: 12000, clicks: 220,
                owned: { shopper: 18, farm: 20 } },
  "pre-night":{ total: 140000, mice: 320000, clicks: 420,
                owned: { shopper: 25, farm: 40, factory: 4, lab: 1 } },
  "night":    { total: 450000, mice: 900000, clicks: 550, golden: 3,
                owned: { shopper: 25, farm: 40, factory: 5, lab: 2 },
                bought: ["catnap"] },
  "legible":  { total: LEGIBLE_TOTAL, mice: 6e6, clicks: 1000, golden: 6,
                owned: { shopper: 25, farm: 40, factory: 5, lab: 2, portal: 12, timemachine: 4 },
                bought: ["catnap", "countingmice", "deepsleep", "remsleep", "luciddreaming"] },
};
function devApply(name) {
  const p = DEV_PRESETS[name];
  game.mice = p.mice || 0; game.total = p.total || 0;
  game.clicks = p.clicks || 0; game.goldCaught = p.golden || 0;
  game.owned = {}; BUILDINGS.forEach(b => game.owned[b.id] = (p.owned && p.owned[b.id]) || 0);
  game.bought = {}; (p.bought || []).forEach(k => game.bought[k] = 1);
  game.unlocked = {}; // sticky unlocks re-derive from the new state
  game.buffUntil = 0; game.clickBuffUntil = 0;
  recalc();
  syncPhase();
  refreshHud(); refreshShop(); refreshUpgrades(); save();
}
// Human-readable unlock condition, for the dev content dump. Mirrors the
// AND-ed checks in isUnlocked() — keep the two in sync.
function unlockText(u) {
  const c = u.unlock, parts = [];
  if (c.owned) {
    for (const [id, n] of ownedPairs(c)) parts.push(`own ${n}x ${buildingName(id)}`);
  }
  if (c.total != null) parts.push(`${fmt(c.total)} lifetime`);
  if (c.clicks != null) parts.push(`${c.clicks} pets`);
  if (c.golden != null) parts.push(`${c.golden} golden`);
  if (c.requires) {
    const r = UPGRADES.find(x => x.key === c.requires);
    parts.push(`after ${r ? r.name : c.requires}`);
  }
  return parts.join(" + ") || "always";
}

// The full content table. Regenerated on each open so the state column
// (owned counts / bought / locked) reflects the moment you looked.
function devContentHTML() {
  const bRows = BUILDINGS.map(b => {
    const owned = game.owned[b.id] || 0;
    const state = b.night && !nightActive() ? "night-only" : (owned ? `owned ${owned}` : "—");
    return `<tr><td>${b.icon} ${b.name}</td><td class="n">${fmt(b.base)}</td><td class="n">${b.mps}</td>
            <td>${b.night ? "night" : "day"}</td><td class="s">${state}</td></tr>`;
  }).join("");
  const uRows = UPGRADES.map(u => {
    const state = game.bought[u.key] ? "BOUGHT" : (isUnlocked(u) ? "available" : "locked");
    return `<tr class="${game.bought[u.key] ? "done" : ""}"><td>${u.icon} ${u.name}</td>
            <td class="n">${fmt(u.cost)}</td><td>${unlockText(u)}</td>
            <td>${effectText(u)}</td><td class="s">${state}</td></tr>`;
  }).join("");
  return `<h4>Buildings (${BUILDINGS.length})</h4>
    <table><thead><tr><th>name</th><th>base</th><th>mps</th><th>phase</th><th>state</th></tr></thead>
    <tbody>${bRows}</tbody></table>
    <h4>Upgrades (${UPGRADES.length})</h4>
    <table><thead><tr><th>name</th><th>cost</th><th>unlock</th><th>effect</th><th>state</th></tr></thead>
    <tbody>${uRows}</tbody></table>`;
}

// ---------------------------------------------------------------------------
// PACING SIMULATOR — answers "how long is the game right now?" without playing
// it. A greedy bot plays the REAL rules (foldMods / unlockMet / costOf /
// wallMiceFor are shared, not copied — if the economy changes, the sim follows)
// at a fixed pets/sec and reports a timestamped milestone timeline up to
// legibility (isLegible: Counting Mice + all trail stages + LEGIBLE_TOTAL).
//
// What it models:
//   - income integrated at 0.25s steps; petting at a steady `pps` pets/sec
//   - golden mice as expected value: mean interval 65s / goldenFreq, 70%
//     Click Frenzy x7 for 7s, 30% Zoomies x7 for 12s, folded in as
//     steady-state rate multipliers. Assumes EVERY golden gets caught —
//     right for a motivated team of four, generous for solo.
//   - purchases: story items (night / trail effects) bought on sight — they're
//     the goal, motivated players don't optimize past them. Growth items picked
//     by minimizing (time-to-afford + payback), the standard clicker-bot
//     heuristic; while saving for a story item, a growth detour is only allowed
//     if it pays for itself before the story item would otherwise arrive.
// What it does NOT model: buff timing luck, human hesitation, shop discovery,
// tapping fatigue. Read the output as the floor set by the economy, not a
// prediction of a real team's clock — playtests calibrate the gap.
// ---------------------------------------------------------------------------
function simulateRun(opts = {}) {
  const pps = opts.pps != null ? opts.pps : 3;
  const useGold = opts.goldens !== false;
  const capS = opts.cap || 3600, dt = 0.25;
  const s = { mice: 0, total: 0, clicks: 0, goldCaught: 0, owned: {}, bought: {} };
  BUILDINGS.forEach(b => s.owned[b.id] = 0);
  const events = [];
  let t = 0, earnedPet = 0, earnedCps = 0, goldAcc = 0, lastWall = 0, legibleAt = null;

  // Buyable only if it's productive in the current phase: night buildings need
  // night; the day mouse-industry (non-Lab day buildings) is dead once night
  // falls, so the bot stops buying it then — mirrors the shop hiding those rows.
  const buyableB = b => {
    const night = nightOf(s.bought);
    if (b.night) return night && isRevealed(b, s);
    if (b.id !== "lab" && night) return false;
    return isRevealed(b, s);
  };
  const isStory = u => [].concat(u.effect).some(e => e.type === "night" || e.type === "trail" || e.type === "countMice");

  // Steady-state earn rates for an arbitrary hypothetical (bought, owned).
  // Composition comes from baseCpsWith/clickBaseWith — the same functions the
  // live game runs — so only the buff model below is the sim's own.
  const rates = (bought, owned) => {
    const m = foldMods(bought, owned);
    const base = baseCpsWith(m, owned);
    const I = GOLD_MEAN_S / m.goldenFreq;                   // mean spawn gap
    // Timed buffs as steady-state uptime EV, standing in for currentCpsBuff()/
    // currentClickBuff(), which the sim can't call (they read wall-clock).
    const gCps = useGold ? 1 + (GOLD_MULT - 1) * (ZOOM_MS / 1000) * (1 - FRENZY_CHANCE) / I : 1;
    const gClk = useGold ? 1 + (CLICK_BUFF_MULT - 1) * (CLICK_BUFF_MS / 1000) * FRENZY_CHANCE / I : 1;
    // Petting earns nothing at night (the sleepy reaction is not a mechanic), so
    // the pet term drops to zero once the twist fires — matches pet()'s gate.
    const pet = nightOf(bought) ? 0 : pps * clickBaseWith(m, owned) * gClk;
    return { cps: base * gCps, pet, all: base * gCps + pet, I };
  };
  const log = ev => events.push({ t, ev, total: s.total, rate: rates(s.bought, s.owned).all });

  while (t < capS) {
    const r = rates(s.bought, s.owned);
    s.mice += r.all * dt; s.total += r.all * dt;
    earnedCps += r.cps * dt; earnedPet += r.pet * dt;
    s.clicks += pps * dt;
    if (useGold) { goldAcc += dt / r.I; s.goldCaught = Math.floor(goldAcc); }
    t += dt;

    // Story purchases first; remember the gap if one is pending but unaffordable.
    let goalGap = 0;
    for (const u of UPGRADES) {
      if (s.bought[u.key] || !isStory(u) || !unlockMet(u, s)) continue;
      if (s.mice >= u.cost) {
        s.mice -= u.cost; s.bought[u.key] = 1; log(`★ ${u.name}`);
        // Match the live seed: the twist opens a few dream-holes to bootstrap night.
        if ([].concat(u.effect).some(e => e.type === "night")) s.owned[NIGHT_SEED_ID] += NIGHT_SEED_COUNT;
      }
      else goalGap = Math.max(goalGap, u.cost - s.mice);
    }

    // Growth purchases: repeatedly take the best-scoring affordable option.
    for (let guard = 0; guard < 40; guard++) {
      const r0 = rates(s.bought, s.owned);
      let best = null;
      for (const b of BUILDINGS) {
        if (!buyableB(b)) continue;
        const cost = costOf(b, s.owned[b.id]);
        s.owned[b.id]++; const gain = rates(s.bought, s.owned).all - r0.all; s.owned[b.id]--;
        if (gain <= 0) continue;
        const score = Math.max(0, (cost - s.mice) / r0.all) + cost / gain;
        if (!best || score < best.score) best = { cost, score, pay: cost / gain,
          buy: () => { s.owned[b.id]++; if (s.owned[b.id] === 1) log(`first ${b.name}`); } };
      }
      for (const u of UPGRADES) {
        if (s.bought[u.key] || isStory(u) || !unlockMet(u, s)) continue;
        s.bought[u.key] = 1; const gain = rates(s.bought, s.owned).all - r0.all; delete s.bought[u.key];
        if (gain <= 0) continue;  // e.g. click upgrades at pps=0
        const score = Math.max(0, (u.cost - s.mice) / r0.all) + u.cost / gain;
        if (!best || score < best.score) best = { cost: u.cost, score, pay: u.cost / gain,
          buy: () => { s.bought[u.key] = 1; log(`upgrade ${u.name}`); } };
      }
      if (!best || s.mice < best.cost) break;
      if (goalGap > 0 && best.pay > goalGap / r0.all) break;  // saving for the story
      s.mice -= best.cost; best.buy();
    }

    const w = wallMiceFor(s.total);
    if (w > lastWall && (w === 1 || Math.floor(w / 15) > Math.floor(lastWall / 15))) log(`wall: ${w} mice`);
    lastWall = Math.max(lastWall, w);

    if (isLegible(s)) { legibleAt = t; log("WORD LEGIBLE"); break; }
  }
  const petPct = (earnedPet + earnedCps) > 0 ? 100 * earnedPet / (earnedPet + earnedCps) : 0;
  return { events, legibleAt, capS, capped: legibleAt == null, petPct, pps, useGold, end: s };
}

const simMMSS = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
function simHTML(r) {
  const rows = r.events.map(e =>
    `<tr><td class="n">${simMMSS(e.t)}</td><td>${e.ev}</td><td class="n">${fmt(e.total)}</td><td class="n">${fmt(e.rate)}/s</td></tr>`).join("");
  const head = r.capped
    ? `word NOT legible within ${simMMSS(r.capS)} — economy stalls short`
    : `word legible at <b style="color:var(--gold)">${simMMSS(r.legibleAt)}</b>`;
  return `<h4>pacing sim — ${r.pps} pets/s · goldens ${r.useGold ? "all caught" : "off"}</h4>
    <div style="margin:4px 0 8px;color:#aeb6c6;">${head} · petting earned ${r.petPct.toFixed(0)}% of lifetime mice</div>
    <table><thead><tr><th>t</th><th>event</th><th>lifetime</th><th>rate</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function initDev() {
  if (!/debug/.test(location.search + location.hash)) return;
  const st = document.createElement("style");
  st.textContent = `
    #devbar { position: fixed; top: max(10px, env(safe-area-inset-top)); right: 10px; z-index: 40;
      background: rgba(6,8,12,.88); border: 1px solid #2a3140; border-radius: 10px; padding: 7px 8px;
      display: flex; flex-direction: column; gap: 5px; font: 600 10px ui-monospace, monospace; color: #77808f;
      max-width: 200px; }
    /* Widened + made scrollable only while the buildings/upgrades details is
       open, so that section stays part of the same panel instead of a
       separate overlay that can end up covering its own dismiss control. */
    #devbar.wide { max-width: min(760px, 94vw); max-height: 82vh; overflow-y: auto; }
    #devbar .r { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
    #devbar button { border: 1px solid #333c4e; background: #171c26; color: #aeb6c6;
      border-radius: 6px; padding: 3px 7px; font: inherit; cursor: pointer; }
    #devbar button.on { border-color: var(--neon); color: var(--neon); }
    #devbar summary { cursor: pointer; color: #aeb6c6; list-style: none; padding: 1px 0; }
    #devbar summary::-webkit-details-marker { display: none; }
    #devbar summary::before { content: "▸ "; }
    #devbar details[open] > summary::before { content: "▾ "; }
    /* Outer collapse: the whole panel folds down to a "🛠 debug" pill; the inner
       devList stays its own independent fold (the data tables). Two nested
       <details> give three tiers — pill / controls / controls+tables — and each
       open-state is persisted (see initDev). */
    #devPanel > summary { color: var(--neon); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    #devPanel > * + * { margin-top: 5px; }
    #devContent { margin-top: 4px; overflow-x: auto; }
    #devContent h4 { margin: 10px 0 5px; color: var(--gold); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
    #devContent h4:first-child { margin-top: 0; }
    #devContent table { border-collapse: collapse; width: 100%; }
    #devContent th, #devContent td { text-align: left; padding: 3px 7px; border-bottom: 1px solid #1b2130; vertical-align: top; }
    #devContent th { color: var(--neon); font-weight: 600; position: sticky; top: 0; background: #090c12; }
    #devContent td.n { text-align: right; font-variant-numeric: tabular-nums; color: var(--gold); white-space: nowrap; }
    #devContent td.s { color: #6f7a8c; white-space: nowrap; }
    #devContent tr.done td { opacity: .45; }`;
  document.head.appendChild(st);
  const bar = document.createElement("div");
  bar.id = "devbar";
  bar.innerHTML =
    `<details id="devPanel" open><summary>🛠 debug</summary>
     <div class="r">speed <button data-sp="1" class="on">×1</button><button data-sp="10">×10</button><button data-sp="50">×50</button></div>
     <div class="r">team <button data-team="1" class="on">×1</button><button data-team="4">×4</button></div>
     <div class="r">grant <button data-g="1e4">+10K</button><button data-g="1e6">+1M</button><button data-g="1e8">+100M</button></div>
     <div class="r">jump ${Object.keys(DEV_PRESETS).map(k => `<button data-p="${k}">${k}</button>`).join("")}</div>
     <div class="r">sim <button data-sim="0">idle</button><button data-sim="3">solo 3/s</button><button data-sim="10">team 10/s</button></div>
     <details id="devList"><summary>buildings &amp; upgrades</summary><div id="devContent"></div></details>
     </details>`;
  document.body.appendChild(bar);
  const list = bar.querySelector("#devList"), content = bar.querySelector("#devContent");
  // `toggle` fires as a queued task, so a sim click that opens the panel and
  // then writes results would get clobbered by this handler. pendingPane lets
  // the sim hand its HTML across that async gap; default stays the content dump.
  let pendingPane = null;
  list.addEventListener("toggle", () => {
    bar.classList.toggle("wide", list.open);
    if (!list.open) return;
    content.innerHTML = pendingPane || devContentHTML();
    pendingPane = null;
  });
  bar.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.sp) {
      DEV.speed = +b.dataset.sp;
      bar.querySelectorAll("[data-sp]").forEach(x => x.classList.toggle("on", x === b));
    } else if (b.dataset.team) {
      // Simulates a 4-player room: every pet counts as 4 (see clickGain).
      // Doesn't touch cps/buildings — this is purely "what does tapping feel
      // like with a team behind it," not a balance change.
      DEV.teamMult = +b.dataset.team;
      bar.querySelectorAll("[data-team]").forEach(x => x.classList.toggle("on", x === b));
    } else if (b.dataset.g) {
      const n = +b.dataset.g;
      game.mice += n; game.total += n; // grants earn, they don't counterfeit
      refreshHud(); refreshShop(); refreshUpgrades();
    } else if (b.dataset.sim != null) {
      pendingPane = simHTML(simulateRun({ pps: +b.dataset.sim }));
      if (list.open) { content.innerHTML = pendingPane; pendingPane = null; }
      else list.open = true;
    } else if (b.dataset.p) {
      devApply(b.dataset.p);
    }
  });

  // Tiered collapse, persisted: the outer panel (devPanel) and the data tables
  // (devList) each remember their open state across reloads, so a dev who keeps
  // it fully folded to the pill doesn't have to re-collapse it every load. Two
  // listeners on devList's `toggle` is fine — the existing one paints content,
  // this one just saves.
  const panel = bar.querySelector("#devPanel");
  const DEV_UI_KEY = "hexclicker.devui";
  const saveDevUi = () => {
    try { localStorage.setItem(DEV_UI_KEY, JSON.stringify({ panel: panel.open, list: list.open })); } catch {}
  };
  panel.addEventListener("toggle", saveDevUi);
  list.addEventListener("toggle", saveDevUi);
  let devUi = {};
  try { devUi = JSON.parse(localStorage.getItem(DEV_UI_KEY)) || {}; } catch {}
  // Markup default is panel-open / list-closed; only override from a saved state.
  if (typeof devUi.panel === "boolean") panel.open = devUi.panel;
  if (devUi.list === true) list.open = true; // fires the paint+widen toggle handler
}

// ---------------------------------------------------------------------------
// BOOT
// ---------------------------------------------------------------------------
load();
recalc();
buildShop();
syncPhase(); // saves restore the phase for free
initDev();
countIconEl.innerHTML = currencyIconSVG(); // static art, set once — not refreshHud()'s job

// Shop-skin runtime: drive the scroll shadows (.can-up / .can-down) and publish
// the dock/HUD heights so #catWrap can center Hex in the space above the static
// shop. (Icon sizing is pure CSS now — a fixed square per row.) All read-only
// measurement, so there's no layout feedback with the game's own row refresh.
(function () {
  const rootEl = document.documentElement;
  const hudEl = $("#hud");
  const scrollers = [shopEl, upgradesEl];
  function measure() {
    // Pin Hex as if the Upgrades drawer always holds ~2 upgrades, so unlocking or
    // buying upgrades never shifts her. Instead of the section's live height we
    // substitute the #upgrades cap (10vh * --ss) — the height ~2 tall upgrade
    // rows already reach — and only measure the Buildings section live. Only 0/1
    // upgrade then sits slightly off, which is fine.
    let dh = 0;
    if (getComputedStyle(dockEl).display !== "none") {
      const bh = getComputedStyle(buildingSecEl).display !== "none" ? buildingSecEl.offsetHeight : 0;
      const ss = parseFloat(getComputedStyle(rootEl).getPropertyValue("--ss")) || 1;
      const upPinned = Math.round(innerHeight * 0.10 * ss) + 1; // upgrades cap + section border
      dh = bh + upPinned;
    }
    rootEl.style.setProperty("--dock-h", dh + "px");
    rootEl.style.setProperty("--hud-h", (hudEl ? hudEl.offsetHeight : 0) + "px");
  }
  function updAff(el) {
    el.classList.toggle("can-up", el.scrollTop > 1);
    el.classList.toggle("can-down", el.scrollTop + el.clientHeight < el.scrollHeight - 1);
  }
  function tick() { measure(); scrollers.forEach(updAff); }
  scrollers.forEach(el => el.addEventListener("scroll", () => updAff(el), { passive: true }));
  if (window.ResizeObserver) { const ro = new ResizeObserver(tick); ro.observe(dockEl); if (hudEl) ro.observe(hudEl); }
  addEventListener("resize", tick);
  setInterval(tick, 300);
  tick();
})();
refreshHud();
refreshShop();
refreshUpgrades();
requestAnimationFrame(frame);
</script>
