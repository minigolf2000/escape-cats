<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Hex Clicker</title>
<!-- THE ONE FACE, started on the preload scanner's pass rather than after the
     stylesheet is parsed (never inline it in styles.css as a data URI).
     `crossorigin` is not optional on a font preload: fonts fetch in anonymous
     CORS mode, and without it the preload lands in the other pool and the font
     is fetched twice. -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/baloo2.woff2">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❓</text></svg>">
<!--
  Hex Clicker — the multiplayer client's markup. A Cookie Clicker homage: pet
  Hex the cat, collect MICE, spend them on buildings and upgrades. The room
  server owns the economy (packages/shared/src/hex/); src/README.md is the
  module map. THE TWIST: buying Catnap Hypnalysis flips the game into the NIGHT
  PHASE, where the reveal wall inks TO THE MOON (src/wall.js). Hex has no win
  screen of its own — the win is the proctor's press (see the root README).
-->
<body class="booting">

<div id="hud">
  <div id="bank">
    <!-- The coin REPLACES the word "mice", so it carries the unit's meaning and
         needs the label the text used to provide (its inner svg is aria-hidden). -->
    <div id="count">0</div><span id="countIcon" role="img" aria-label="mice"></span>
    <div id="cps">per second: <b>0</b></div>
  </div>
</div>

<!-- Night sky. Empty and fixed behind everything; see its CSS for why the night
     background is a fading layer instead of a --page-bg override. -->
<div id="nightSky" aria-hidden="true"></div>

<div id="stage">
  <!-- day-only sunburst (Cookie Clicker's spinning rays); sits under everything -->
  <div id="rays"></div>
  <!-- night sky: a static twinkling starfield (built by makeStars), behind the
       wall; the neon mice draw on the #wall canvas on top of this. -->
  <div id="stars"></div>
  <!-- night-phase reveal wall; sits under everything -->
  <canvas id="wall"></canvas>
  <!-- Hex herself. The art comes from the Figma file "Hexxxygon" (see
       src/README.md): WebP heads in public/art/, plus the traced eye rig below. -->
  <div id="catWrap">
   <div id="catMotion"><div id="catPose"><div id="catBreath">
    <!-- Idle sleep sign. aria-hidden: the night phase is announced elsewhere, and
         three drifting glyphs are decoration, not information a reader needs. -->
    <div id="sleepZ" aria-hidden="true"><span>z</span><span>z</span><span>z</span></div>
    <svg id="hexCat" role="button" aria-label="Pet Hex" width="828" height="652" viewBox="0 0 828 652" fill="none" xmlns="http://www.w3.org/2000/svg">
     <defs>
      <!-- THE SOCKET CLIP. The pupil is bounded by the socket the way a pupil is
           bounded by its iris: it can grow until it fills the eye, and a glance
           then slides it AGAINST the rim instead of through it — dilation and
           gaze always happen together (she widens exactly when she looks
           hardest). The clip is the socket's own INNER contour. It hangs on a
           wrapper OUTSIDE the look group, never on the pupil: a clip-path rides
           its element's own transform, so clipping the pupil directly would drag
           the socket around with the glance and clip nothing. -->
      <clipPath id="socketClipL"><path d="M280.5 429.5 307.5 435.5 322.5 446.5 328.5 454.5 330.5 461.5 334.5 467.5 336.5 477.5 335.5 479.5 336.5 494.5 334.5 501.5 333.5 514.5 325.5 533.5 321.5 538.5 319.5 538.5 310.5 546.5 301.5 550.5 289.5 553.5 265.5 552.5 258.5 550.5 257.5 551.5 247.5 546.5 243.5 546.5 236.5 543.5 229.5 537.5 218.5 523.5 213.5 513.5 209.5 497.5 209.5 480.5 214.5 470.5 215.5 465.5 224.5 449.5 226.5 449.5 234.5 441.5 247.5 434.5 257.5 433.5 259.5 431.5 270.5 431.5Z"/></clipPath>
      <clipPath id="socketClipR"><path d="M508.5 416.5 509.5 417.5 512.5 416.5 523.5 417.5 533.5 421.5 551.5 436.5 560.5 448.5 562.5 453.5 566.5 470.5 566.5 480.5 567.5 481.5 566.5 486.5 567.5 487.5 564.5 498.5 558.5 508.5 558.5 511.5 550.5 522.5 542.5 529.5 517.5 538.5 514.5 537.5 507.5 539.5 488.5 538.5 465.5 528.5 458.5 522.5 452.5 511.5 451.5 505.5 446.5 493.5 447.5 489.5 445.5 475.5 452.5 450.5 455.5 444.5 466.5 433.5 477.5 425.5 480.5 425.5 490.5 420.5 497.5 419.5 500.5 417.5Z"/></clipPath>
     </defs>
     <g id="catFace">
      <!-- HEAD: the artist's drawing, five poses on ONE 828x652 canvas,
           registered to each other by eye position — so swapping frames needs
           no offset table and the eye rig never chases the head. The eyes are
           painted OUT of these PNGs; leave them baked in and every blink shows
           a second eye underneath. href is a bare "/art/...": Vite rewrites
           attribute URLs through `base`, so a /hexxygon/ prefix would double. -->
      <!-- The DAY coat, in three pieces so the ears can move on their own. Only
           the EAR TIPS are lifted out. Masking the whole drawing by the ear
           opening instead is what ate her whiskers once — they are white, so
           they are not in the coat mask the opening is built from — and chewed
           her outline into lumps; everything below the tips here is the
           artist's file byte for byte. Where each tip sat the head keeps a
           collar of FLAT COAT at the artist's own alpha, so a perk reveals coat
           rather than a hole. Each ear box is anchored just under its own cut,
           because the perk is a scaleY about that box's BOTTOM edge: a deep
           base puts the join high above the anchor and swings it visibly.
           Only the day coat is split: she sleeps at night, ears at rest. -->
      <!-- THE SHADOW, lifted out of the coat into its own layer: it is painted
           as coat-coloured pixels OUTSIDE the drawn line at full opacity, which
           blocked the sunburst; here its strength is set once in CSS (.58).
           First in document order so it sits under her.
           SQUASH ONLY. The v2 day and night heads carry the artist's shading
           INSIDE the drawn line, where it cannot block anything, so they need
           no layer of their own — the three frames here are the v1 squash art,
           whose shading is still painted outside the line. -->
      <g id="catShadow">
       <image class="shadowFrame" id="shadowS1" data-href="art/hex-squash1-shadow.webp" x="0" y="0" width="828" height="652"/>
       <image class="shadowFrame" id="shadowS2" data-href="art/hex-squash2-shadow.webp" x="0" y="0" width="828" height="652"/>
       <image class="shadowFrame" id="shadowS3" data-href="art/hex-squash3-shadow.webp" x="0" y="0" width="828" height="652"/>
      </g>
      <g id="coatDay">
       <image id="headDay" href="/art/hex-day.webp" x="0" y="0" width="828" height="652"/>
       <g id="earLeft"><image href="/art/hex-day-earL.webp"
          x="175" y="32" width="162" height="177"/></g>
       <g id="earRight"><image href="/art/hex-day-earR.webp"
          x="451" y="3" width="178" height="160"/></g>
      </g>
      <image class="headFrame" id="headSquash1" data-href="art/hex-squash1.webp"
             x="0" y="0" width="828" height="652"/>
      <image class="headFrame" id="headSquash2" data-href="art/hex-squash2.webp"
             x="0" y="0" width="828" height="652"/>
      <image class="headFrame" id="headSquash3" data-href="art/hex-squash3.webp"
             x="0" y="0" width="828" height="652"/>
      <image class="headFrame" id="headNight" data-href="art/hex-night.webp"
             x="0" y="0" width="828" height="652"/>
      <!-- EYES: the one part kept as markup, because it has to move
           independently every frame. Sockets and shut-lash arcs are traced from
           the artist's own eyes, so they carry the same wobble as the coat.
           THREE nested channels, one job each, because they have to COMPOSE (a
           blink, a glance and a dilation all at once, and one transform can only
           say one of them):
             #eyeLeft/#eyeRight     — the LIDS (scaleY)
             .look (iris + lash)    — the LOOK (translate)
             #pupilLeft/#pupilRight — the DILATION (scale)
           The socket is the outline and holds still; the pupil is what looks at
           things, inside a clip that keeps it there however wide it opens. -->
      <g id="eyeLeft" class="eye">
       <!-- THE SOCKET. Fixed to the head: it is the eye's outline. Filled edge
            to edge, since a hollow ring is illegible at Hex's size on a phone. -->
       <path class="eyeOpen eyeDisc" d="M280.5 427.5 307.5 433.5 322.5 444.5 331.5 456.5 332.5 461.5 337.5 470.5 338.5 477.5 337.5 479.5 338.5 494.5 336.5 501.5 335.5 514.5 327.5 533.5 321.5 540.5 319.5 540.5 310.5 548.5 301.5 552.5 289.5 555.5 265.5 554.5 258.5 552.5 257.5 553.5 251.5 550.5 248.5 550.5 247.5 548.5 243.5 548.5 236.5 545.5 227.5 537.5 216.5 523.5 211.5 513.5 207.5 497.5 208.5 477.5 218.5 455.5 224.5 447.5 226.5 447.5 234.5 439.5 247.5 432.5 257.5 431.5 259.5 429.5 270.5 429.5Z"/>

        <g class="look" id="irisLeft">
         <!-- THE PUPIL: the socket's own inner contour scaled to 55% x 71%
              about its centre (every 2nd point kept), so it is registered to
              the socket by construction. Drawn at the artist's size — the
              resting slit scales it down, the saucer up (PUPIL_ROUND in cat.js). -->
         <path class="eyeOpen pupil" id="pupilLeft" d="M264.5 453.5 265.5 454.5 266.5 453.5 280.5 453.5 285.5 455.5 293.5 455.5 298.5 459.5 302.5 460.5 308.5 466.5 312.5 476.5 314.5 491.5 306.5 515.5 304.5 518.5 297.5 523.5 284.5 528.5 272.5 529.5 266.5 526.5 261.5 525.5 259.5 526.5 251.5 524.5 245.5 521.5 233.5 508.5 230.5 493.5 232.5 488.5 232.5 481.5 234.5 479.5 234.5 476.5 237.5 469.5 240.5 464.5 248.5 456.5 254.5 454.5 263.5 454.5Z"/>
        </g>
       </g>
       <!-- The sleeping lash arc drifts with the same look the pupil does (the
            REM tell) but is NOT in the clipped group: it is drawn wider than the
            socket, so the clip would shave its ends. Hence a second .look. -->
       <g class="look" id="lashLeft">
        <path class="eyeShut" d="M268.5 458.5 270.5 459.5 291.5 460.5 303.5 464.5 306.5 464.5 311.5 467.5 321.5 470.5 323.5 472.5 329.5 474.5 332.5 477.5 334.5 477.5 338.5 480.5 345.5 487.5 346.5 493.5 339.5 495.5 337.5 494.5 336.5 491.5 327.5 483.5 325.5 483.5 319.5 479.5 314.5 478.5 310.5 475.5 302.5 473.5 299.5 471.5 295.5 471.5 294.5 470.5 286.5 469.5 285.5 468.5 280.5 468.5 279.5 467.5 270.5 467.5 269.5 466.5 259.5 469.5 258.5 468.5 255.5 470.5 251.5 470.5 250.5 471.5 241.5 471.5 238.5 469.5 238.5 466.5 244.5 462.5 248.5 462.5 249.5 461.5 258.5 460.5 259.5 459.5 267.5 459.5Z"/>
       </g>
      </g>
      <g id="eyeRight" class="eye">
       <!-- THE SOCKET. Fixed to the head: it is the eye's outline. Filled edge
            to edge, since a hollow ring is illegible at Hex's size on a phone. -->
       <path class="eyeOpen eyeDisc" d="M508.5 414.5 509.5 415.5 512.5 414.5 523.5 415.5 535.5 420.5 557.5 440.5 557.5 442.5 562.5 448.5 564.5 453.5 568.5 470.5 568.5 480.5 569.5 481.5 568.5 486.5 569.5 487.5 566.5 498.5 564.5 500.5 563.5 505.5 560.5 508.5 560.5 512.5 558.5 513.5 552.5 522.5 542.5 531.5 517.5 540.5 514.5 539.5 507.5 541.5 488.5 540.5 465.5 530.5 460.5 527.5 456.5 522.5 450.5 511.5 449.5 505.5 444.5 493.5 445.5 489.5 443.5 475.5 450.5 450.5 457.5 439.5 477.5 423.5 480.5 423.5 490.5 418.5 497.5 417.5 500.5 415.5Z"/>
       <g clip-path="url(#socketClipR)">
        <g class="look" id="irisRight">
         <!-- THE PUPIL: the socket's own inner contour scaled to 55% x 71%

    </svg>
   </div></div></div>
  </div>
  <div id="buff"></div>
  <!-- Empty: spawnGold() fills this with the gilded mouse. -->
  <div id="golden" role="button" aria-label="Golden mouse"></div>
  <!-- No prose on the stage, ever — not onboarding, not the legibility payoff.
       The mystery IS the mechanic; the wall becoming readable is its own signal. -->
</div>

<div id="dock">
  <!-- The SHOP rail is the dock's one control: it names the panel and is the
       only thing that closes/reopens it. A direct child of #dock, not of
       #upgradeSec, so the title stays put whichever sections are on screen.
       aria-controls names the one scroller that collapses. -->
  <button type="button" id="shopToggle" class="shopHead"
          aria-expanded="true" aria-controls="shopScroll">
    <!-- The storefront from the art file, traced to one even-odd path. Inherits
         .shopHead's currentColor like .chev does, so it is the rail's own
         two-phase colour. Decorative: the button is named by .shopTitle. -->
    <span class="shopIcon" aria-hidden="true"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M8.31 2.38 9.69 2.38 9.85 2.54 10.46 2.54 10.62 2.38 10.77 2.54 12.62 2.54 12.77 2.69 13.54 2.69 13.69 2.54 14 2.69 19.08 2.54 19.85 3.15 20.46 6.08 20.92 6.38 21.38 6.38 22 6.85 23.08 8.08 23.69 9.46 23.85 11.62 22.77 13 22 13.46 20.62 13.46 20.46 13.62 20 20.54 19.54 21.31 18.62 21.31 18.46 21.15 16.62 21.15 16.46 21.31 15.08 21.15 14.92 21.31 14.15 21.31 13.85 21.15 12.46 21.46 11.85 21.46 11.69 21.31 10.92 21.31 10.77 21.46 9.54 21.46 9.38 21.31 9.08 21.46 8.46 21.31 7.54 21.31 7.38 21.46 3.54 21.46 3.08 21.31 2.62 21.46 2 21.15 1.85 20.38 2.15 19.92 2.15 17.46 2.31 17.31 2.62 13.31 1.23 12.85 0.15 11.92 0 11.46 0.15 11.15 0 10.54 0.15 10.38 0.15 9.77 1.38 7.77 2.62 7 2.92 6.54 4.46 6.08 4.15 5.46 4.31 5.31 4.15 5 4.46 4.38 4.46 3.46 4.92 2.85 6.15 2.54 8.15 2.54ZM4.77 12.69 6.15 14.08 7.85 14.85 10 14.69 11.38 14.08 12.15 13.15 14 14.38 15.69 14.54 15.85 14.69 16 14.54 16.77 14.54 17.54 14.23 18.77 13 18.92 13.31 18.77 13.46 18.77 15.31 18.62 15.46 18.46 19.46 17.23 19.77 16.46 19.62 16.31 19 16.46 17.92 15.54 15.77 14.46 14.69 13.69 14.38 12.31 14.38 12.15 14.54 11.08 14.54 10.46 14.85 9.69 15.62 9.23 16.38 9.08 17.31 8.77 17.77 8.77 19.62 8.62 19.77 8 19.92 6.77 19.62 6.46 19.77 3.69 19.77 3.85 17.31 4 17.15 3.85 16.69 4 16.54 3.85 16.08 4 15.92 4 14.69 4.15 14.54 4.31 13ZM7.85 4.08 9.08 4.08 9.23 4.23 9.69 4.08 14.31 4.23 14.62 4.08 15.23 4.38 16.15 4.38 16.31 4.23 16.46 4.38 17.08 4.38 17.23 4.23 17.54 4.38 18.62 4.08 18.62 6.23 18 6.38 17.23 6.23 17.08 6.38 15.54 6.54 15.38 6.38 12.46 6.38 12.31 6.23 10.31 6.23 10.15 6.08 9.54 6.23 8.92 6.08 8.77 6.23 8.15 6.08 7.54 6.23 6.15 6.08 5.85 6.23 5.54 6.08 6 5.15 6 4.38 6.15 4.23 7.69 4.23ZM7.85 7.92 12 8.08 11.85 9.77 11.38 11.15 10.62 12.38 9.85 12.85 9.38 13 8.15 13 8 12.85 7.85 13 6.62 12.08 6.62 11.15 7.08 10.08 7.23 9.15ZM15.85 8.08 17.08 8.08 17.38 8.69 17.38 9.62 17.54 9.     <span class="shopTitle">Shop</span>
    <!-- The closed sign. Permanently in the DOM, picked by #dock.sold-out like a
         building row's ??? (.lockedNm): a class swap, so no refresh path writes
         rail text and the sign cannot flash the wrong word for a frame. -->
    <span class="soldTitle">Sold Out</span><span class="chev" aria-hidden="true"></span>
    <!-- The unseen-upgrade count reads at the scroller's edges (.moreHint) — a
         fact about SCROLLING belongs where the scrolling is. The tab carries it
         only in its accessible name, the one place a number must still exist
         while the tray is shut. -->
  </button>
  <!-- ONE scroller for both lists, a plank between them, so one gesture runs
       from the top of the upgrades to the bottom of the buildings. -->
  <div id="shopScroll">
    <!-- "N MORE", one per edge. Permanently in the DOM and picked by [hidden],
         like the closed sign and the locked rows: no refresh path builds them,
         only writes the number. Direction is a CLASS (.up/.down in CSS), so the
         count is the only thing JS ever writes here. -->
    <div class="moreHint up" aria-hidden="true" hidden><span class="pill"></span></div>
    <div id="upgradeSec">
      <div id="upgrades"></div>
    </div>
    <div id="buildingSec">
      <div class="shopDivider"></div>
      <div id="shop"></div>
    </div>
    <div class="moreHint down" aria-hidden="true" hidden><span class="pill"></span></div>
  </div>
</div>

<!-- Input trap for the night-transition cutscene: transparent (the beat plays
     through it), but while .on it eats every tap so nothing is selectable. Sits
     above the dock so the whole static shop is locked during the reveal. -->
<div id="cutsceneVeil"></div>


<!-- ==== MULTIPLAYER SHELL: the join gate covers the stage until the player is
     in a room; the roster and reconnect toast are the only other additions. ==== -->

<!-- WHO IS HERE: one name per line, stacked above the shop tray (see #team in
     styles.css). A sibling of #dock, not a child, so it survives the tray being
     hidden before the shop unlocks and gone after it retires; it rides the
     tray's top edge by measurement (the ResizeObserver in main.js). aria-live
     off: four names changing a handful of times a session are not an announcement. -->
<div id="team" aria-live="off"></div>
<div id="connToast">reconnecting…</div>

<!-- The win splash and its toggle: after the shell so they paint over the game,
     before the gate/rotate covers, which outrank them (z-index note on #splash). -->
<div id="splash" aria-hidden="true">
  <div class="sky top"></div><img id="splashArt" alt=""><div class="sky bottom"></div>
</div>
<button id="wonPill" type="button">🏆 win screen</button>

<div id="gate">
  <h1>🐱 Hex Clicker</h1>
  <p id="gateStatus"></p>
  <p class="err" id="gateErr"></p>
</div>

<!-- Portrait gate. Hidden by default; only the media query in the stylesheet
     shows it. Last in the body so it paints over everything. -->
<div id="rotate">
  <div class="glyph">📱</div>
  <b>Turn your phone upright</b>
  <span>Hex Clicker is played in portrait.</span>
</div>

<script type="module" src="/src/main.js"></script>
