<!doctype html>
<!-- Explicit charset: the panel labels carry non-ASCII (×, —) and a static
     host that serves .html without a charset parameter would otherwise leave the
     browser to guess, which renders them as mojibake. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Reveal Lab</title>
<style>
  /* Deliberately single-theme: a dark observation room. This is a tuning instrument. */
  /* One height for the control deck, so the canvas inset can't drift out of sync
     with the panel when rows are added. --ph is the CONTENT height; the safe-area
     inset is added on top (rather than eating into it) so a home bar can't squeeze
     the bottom row off. */
  :root { --ph: 146px; --deck: calc(var(--ph) + env(safe-area-inset-bottom)); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101216; }
  #c { position: fixed; inset: 0 0 var(--deck) 0; width: 100%; height: calc(100% - var(--deck));
       touch-action: none; }
  #panel {
    position: fixed; left: 0; right: 0; bottom: 0; height: var(--deck);
    background: #181b22; border-top: 1px solid #262b36;
    font: 500 12px -apple-system, "Segoe UI", system-ui, sans-serif; color: #aeb6c6;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); box-sizing: border-box;
    display: flex; flex-direction: column; gap: 6px; user-select: none;
  }
  /* Rows never flex: without this the leftover height silently inflates whichever
     row can absorb it (the scene picker, which grew to 83px tall buttons when
     rows were added), so --ph and the rows' real heights have to be kept in step
     deliberately rather than by accident. */
  #panel > * { flex: none; }
  .row { display: flex; gap: 6px; align-items: center; }
  .sliders { display: grid; grid-template-columns: 54px 1fr 30px; gap: 2px 8px; align-items: center; }
  .sliders label { text-align: right; color: #77808f; font-size: 11px; }
  .sliders output { font-variant-numeric: tabular-nums; color: #cdd5e3; font-size: 11px; }
  input[type=range] { width: 100%; height: 22px; accent-color: #ffd44d; margin: 0; }
  .stat { font-size: 11px; color: #77808f; display: flex; align-items: center; gap: 6px; }
  .stat b { font-variant-numeric: tabular-nums; color: #cdd5e3; }
  .stat .tag { padding: 2px 7px; border-radius: 6px; font-weight: 700; font-size: 10px; }
  .mini { display: flex; gap: 6px; }
  .mini > * { flex: 1; }
  .tbtn { padding: 6px 2px; border: 0; border-radius: 7px; background: #232833;
          color: #8d96a8; font: 600 11px -apple-system, system-ui, sans-serif; }
  .tbtn.on { background: #3d63c9; color: #eef2ff; }
</style>
<canvas id="c"></canvas>
<div id="panel">
  <div class="sliders">
    <label>mice</label><input type="range" id="sN" min="1" max="90" value="60"><output id="oN">60</output>
    <label>word %</label><input type="range" id="sY" min="10" max="80" value="30"><output id="oY">30</output>
    <label>trail</label><input type="range" id="sT" min="0" max="60" value="35"><output id="oT">35</output>
  </div>
  <div class="row">
    <div class="stat" style="flex:1">word legibility <b id="cov">—</b><span class="tag" id="tag"></span></div>
    <button class="tbtn" id="reseed" style="flex:0 0 90px">reseed</button>
  </div>
</div>
<script>
'use strict';
// ---------- Reveal Lab v6 — one scene, one word layout ----------
// The committed design: every GEOMETRICALLY CONTINUOUS shape is a crew — each word
// letter, the orbit, each star. Mice never leave their shape (ping-pong patrol, so
// open strokes have no wrap-around jump either). Yellow crews spell the word; the
// other four colors crew the elements of a line-art scene about the word.
// The word source (1-stroke), its layout (wide), its typeface (the wide cut) and
// the trail width are all settled now, so the lab no longer offers them as
// choices — what's left is the scene art plus the sim knobs. Positions stay a
// pure function of (seed, index, simTime).
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0;
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 3);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize);

// Noise is settled at zero: mice ride their tour exactly. Any off-tour wobble
// blurs the very thing the trail is drawing, and the shapes are hairlines, so
// there is no width to hide it in.
const S = { N: 60, yellowPct: 30, trail: 35, seed: 7 };

// Every mouse inks the same hairline, word and scenery alike.
const TRAIL_W = 1.8;

function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- scene path tracer (canvas-like API that records polylines) ----------
function tracer() {
  const polys = [];
  let cur = null, tx = 0, ty = 0, rot = 0;
  const stack = [];
  const T = (x, y) => {
    const c = Math.cos(rot), s = Math.sin(rot);
    return { x: tx + x * c - y * s, y: ty + x * s + y * c };
  };
  const api = {
    polys,
    save() { stack.push([tx, ty, rot]); },
    restore() { [tx, ty, rot] = stack.pop(); },
    translate(x, y) { const p = T(x, y); tx = p.x; ty = p.y; },
    rotate(a) { rot += a; },
    moveTo(x, y) { cur = [T(x, y)]; polys.push(cur); },
    lineTo(x, y) { cur ? cur.push(T(x, y)) : api.moveTo(x, y); },
    closePath() { if (cur && cur.length) cur.push({ ...cur[0] }); },
    quadraticCurveTo(cx, cy, x, y) {
      const p0 = cur[cur.length - 1], p1 = T(cx, cy), p2 = T(x, y);
      for (let i = 1; i <= 12; i++) {
        const u = i / 12, v = 1 - u;
        cur.push({ x: v * v * p0.x + 2 * v * u * p1.x + u * u * p2.x,
                   y: v * v * p0.y + 2 * v * u * p1.y + u * u * p2.y });
      }
    },
    bezierCurveTo(ax, ay, bx, by, x, y) {
      const p0 = cur[cur.length - 1], p1 = T(ax, ay), p2 = T(bx, by), p3 = T(x, y);
      for (let i = 1; i <= 16; i++) {
        const u = i / 16, v = 1 - u;
        cur.push({ x: v ** 3 * p0.x + 3 * v * v * u * p1.x + 3 * v * u * u * p2.x + u ** 3 * p3.x,
                   y: v ** 3 * p0.y + 3 * v * v * u * p1.y + 3 * v * u * u * p2.y + u ** 3 * p3.y });
      }
    },
    arc(cx, cy, r, a0, a1, ccw) {
      let d = a1 - a0;
      if (ccw && d > 0) d -= Math.PI * 2;
      if (!ccw && d < 0) d += Math.PI * 2;
      const n = Math.max(6, Math.ceil(Math.abs(d) * r / 5));
      for (let i = 0; i <= n; i++) {
        const a = a0 + d * i / n;
        api.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
      }
    },
    ellipse(cx, cy, rx, ry, rota, a0, a1, ccw) {
      let d = a1 - a0;
      if (ccw && d > 0) d -= Math.PI * 2;
      if (!ccw && d < 0) d += Math.PI * 2;
      const n = Math.max(8, Math.ceil(Math.abs(d) * Math.max(rx, ry) / 5));
      const cr = Math.cos(rota || 0), sr = Math.sin(rota || 0);
      for (let i = 0; i <= n; i++) {
        const a = a0 + d * i / n, ex = Math.cos(a) * rx, ey = Math.sin(a) * ry;
        api.lineTo(cx + ex * cr - ey * sr, cy + ex * sr + ey * cr);
      }
    },
  };
  return api;
}
function resamplePoly(poly, sp) {
  const out = [];
  if (!poly.length) return out;
  out.push(poly[0]);
  let acc = 0;
  for (let i = 1; i < poly.length; i++) {
    const a = poly[i - 1], b = poly[i];
    const d = Math.hypot(b.x - a.x, b.y - a.y);
    if (d < 1e-6) continue;
    let pos = 0;
    while (acc + (d - pos) >= sp) {
      pos += sp - acc; acc = 0;
      out.push({ x: a.x + (b.x - a.x) * pos / d, y: a.y + (b.y - a.y) * pos / d });
    }
    acc += d - pos;
  }
  out.push(poly[poly.length - 1]);
  return out;
}
// Group an element's subpaths into GEOMETRICALLY CONTINUOUS shapes: two subpaths join
// if an endpoint of one sits within JOIN_R of any point of the other (fins touch the
// rocket body, the crescent's two strokes share tips). Each component becomes one crew.
const JOIN_R = 9;
function components(polys) {
  const n = polys.length;
  const parent = [...Array(n).keys()];
  const find = a => parent[a] === a ? a : (parent[a] = find(parent[a]));
  const touch = (a, b) => {
    const ends = [a[0], a[a.length - 1]];
    for (const e of ends) for (const p of b)
      if ((e.x - p.x) ** 2 + (e.y - p.y) ** 2 <= JOIN_R * JOIN_R) return true;
    return false;
  };
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++)
    if (find(i) !== find(j) && (touch(polys[i], polys[j]) || touch(polys[j], polys[i])))
      parent[find(j)] = find(i);
  const groups = new Map();
  for (let i = 0; i < n; i++) {
    const r = find(i);
    if (!groups.has(r)) groups.set(r, []);
    groups.get(r).push(polys[i]);
  }
  return [...groups.values()].map(chainPolys);
}
// Chain subpaths into ONE walkable tour. A mouse interpolates between
// consecutive tour points at a constant index rate, so any gap in the point
// sequence is walked as a straight line at whatever speed the gap demands — a
// visible jump across empty space. Concatenating subpaths end-to-nearest-end
// leaves exactly such a gap at every seam, and the seams can be enormous: the
// comet's tail strands all begin at the nucleus, so finishing one strand leaves
// the pen at the far end of the frame from where the next one starts.
//
// So a mouse BACKTRACKS instead. Before starting the next subpath, retrace back
// along the tour already emitted to whichever point sits closest to the new
// subpath's start. Retracing costs nothing visually — the mouse is re-walking a
// line the crew has already inked — and it leaves only a residual hop of at most
// about JOIN_R, which is the same threshold that decided these subpaths were one
// shape in the first place.
//
// The next subpath is chosen by distance to ANY emitted point rather than to the
// current pen position, since retracing makes every emitted point reachable.
// But the choice is SHORTEST-RETRACE-FIRST among the candidates that rejoin
// within JOIN_R, not nearest-overall: retracing to an arbitrary point re-walks
// everything between here and there, so picking purely by proximity compounds
// quadratically. On the Big Dipper — two polylines plus seven stars — that grew
// the tour from a few hundred points to over eight thousand, a 34-minute lap
// that never finishes drawing.
//
// Rejoin distance is a hard filter rather than a term in a cost function, on
// purpose. Trading a long retrace for a shorter leap is exactly the jump this
// function exists to remove, so a cheap leap must never win; only when nothing
// is within JOIN_R (which connectivity makes rare) does it fall back to the
// nearest rejoin. Shared with the 1-stroke glyphs, whose deliberate retraces
// arrive as separate subpaths whose endpoints coincide exactly — there both the
// retrace and the hop are zero-length and this reduces to plain concatenation.
function chainPolys(g) {
  const restList = [...g];
  let out = [...restList.shift()];
  const d2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
  while (restList.length) {
    let bi = 0, brev = false, bj = out.length - 1;
    let bBack = Infinity, bHop = Infinity;   // retrace length (in steps), rejoin gap
    restList.forEach((p, i) => {
      const heads = [p[0], p[p.length - 1]];
      for (let h = 0; h < 2; h++) {
        for (let j = 0; j < out.length; j++) {
          const hop = d2(heads[h], out[j]), back = out.length - 1 - j;
          const near = hop <= JOIN_R * JOIN_R, bestNear = bHop <= JOIN_R * JOIN_R;
          // A reachable rejoin always beats an unreachable one; among reachable
          // ones the shortest walk back wins, among unreachable ones the
          // smallest leap does.
          const better = near !== bestNear ? near
                       : near ? (back < bBack) : (hop < bHop);
          if (better) { bBack = back; bHop = hop; bi = i; brev = h === 1; bj = j; }
        }
      }
    });
    // Walk back over what we've drawn until we're beside the new subpath.
    for (let k = out.length - 2; k >= bj; k--) out.push(out[k]);
    const nxt = restList.splice(bi, 1)[0];
    out = out.concat(brev ? [...nxt].reverse() : nxt);
  }
  return out;
}
// Does this tour end where it started? Decides loop vs ping-pong in posAt().
// Threshold is relative to the tour's own mean sample spacing, since word tours
// are resampled several times finer than scenery ones.
function tourIsClosed(tour) {
  const L = tour.length;
  if (L < 4) return false;
  let sum = 0;
  for (let i = 1; i < L; i++) sum += Math.hypot(tour[i].x - tour[i - 1].x, tour[i].y - tour[i - 1].y);
  const step = sum / (L - 1);
  if (!(step > 0)) return false;
  return Math.hypot(tour[0].x - tour[L - 1].x, tour[0].y - tour[L - 1].y) <= step * 0.5;
}

function star4(x, cx, cy, r) {
  x.moveTo(cx, cy - r); x.quadraticCurveTo(cx, cy, cx + r, cy);
  x.quadraticCurveTo(cx, cy, cx, cy + r); x.quadraticCurveTo(cx, cy, cx - r, cy);
  x.quadraticCurveTo(cx, cy, cx, cy - r);
}
// ---------- 1-stroke alphabet ----------
// A single-stroke ("engraver's") font for exactly the letters the moon scene
// needs. Each glyph is ONE continuous pen path in a box `w` wide by 100 tall
// (y=0 cap height, y=100 baseline), authored through the same tracer() API the
// scenery uses — so a letter arrives as a smooth polyline with no lateral
// snaking, and a mouse walking it is literally writing the letter.
//
// Retracing is deliberate and normal for this kind of font: T doubles back
// along half its bar to reach the stem, E re-crosses its middle arm. The
// ping-pong patrol makes retraces free — the mouse was going to come back
// this way regardless.
//
// The WIDE cut, settled after trying it against narrower and squarer faces. It
// is a pure look choice: word mice run at WORD_PPMS_FRAC * WORD_LEN, so their
// speed scales with total ink and the legibility number comes out the same
// whatever the letters' width.
const GLYPHS = {
  'T': { w: 78, draw(x) { x.moveTo(0, 0); x.lineTo(78, 0); x.lineTo(39, 0); x.lineTo(39, 100); } },
  'O': { w: 88, draw(x) { x.moveTo(88, 50); x.ellipse(44, 50, 44, 50, 0, 0, 6.283); } },
  'H': { w: 80, draw(x) { x.moveTo(0, 0); x.lineTo(0, 100); x.lineTo(0, 50);
                          x.lineTo(80, 50); x.lineTo(80, 0); x.lineTo(80, 100); } },
  'E': { w: 72, draw(x) { x.moveTo(72, 0); x.lineTo(0, 0); x.lineTo(0, 50); x.lineTo(58, 50);
                          x.lineTo(0, 50); x.lineTo(0, 100); x.lineTo(72, 100); } },
  'M': { w: 96, draw(x) { x.moveTo(0, 100); x.lineTo(0, 0); x.lineTo(48, 56);
                          x.lineTo(96, 0); x.lineTo(96, 100); } },
  'N': { w: 82, draw(x) { x.moveTo(0, 100); x.lineTo(0, 0); x.lineTo(82, 100); x.lineTo(82, 0); } },
  ' ': { w: 40, draw() {} },
};
// Wider than a text font's tracking would be: these are single hairline strokes
// that the trail then inks to roughly a letter's stroke width, so adjacent glyphs
// close up by that much again once they're drawn.
const GLYPH_GAP = 17;
// Arial Black's cap height at the 190px reference size, so a 1-stroke word
// lands at the same optical size as the rasterized sources.
const REF_CAP_H = 137;

function sampleStrokeWord(word) {
  const letters = [];
  let pen = 0;
  for (const ch of word) {
    const g = GLYPHS[ch] || GLYPHS[' '];
    const tr = tracer();
    tr.translate(pen, 0);
    g.draw(tr);
    const polys = tr.polys.map(p => resamplePoly(p, 4)).filter(p => p.length > 1);
    if (polys.length) letters.push(chainPolys(polys));
    pen += g.w + GLYPH_GAP;
  }
  // Normalize into the 190px reference space: scale to REF_CAP_H tall, then
  // shift so the ink spans [0,w] x [0,h] (loadScene centres on w/2, h/2).
  const all = letters.flat();
  if (!all.length) return { letters, w: 1, h: 1 };
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of all) {
    if (p.x < x0) x0 = p.x; if (p.x > x1) x1 = p.x;
    if (p.y < y0) y0 = p.y; if (p.y > y1) y1 = p.y;
  }
  const k = REF_CAP_H / Math.max(1, y1 - y0);
  for (const p of all) { p.x = (p.x - x0) * k; p.y = (p.y - y0) * k; }
  return { letters, w: (x1 - x0) * k, h: (y1 - y0) * k };
}

// ---------- the moon scene ----------
// Every element is a LONG structure carrying a compact payload, so no crew
// resolves the instant a mouse laps it. Space is mostly empty and its bodies are
// localized, which fights the slow-reveal the game wants; drawing the path
// rather than only the body is the way out — an orbit, a comet's tail and a
// constellation's figure all genuinely cross the frame.

// The Big Dipper in a unit box, radii tracking real magnitudes so it reads as
// the asterism rather than as seven identical dots.
const DIPPER = {
  dubhe:  [0.00, 0.24, 6.5], merak: [0.07, 0.56, 5.5], phecda: [0.32, 0.60, 5],
  megrez: [0.31, 0.37, 4],   alioth: [0.55, 0.30, 6],  mizar:  [0.77, 0.21, 5.5],
  alkaid: [1.00, 0.00, 6.5],
};
function bigDipper(x, ox, oy, w, h, sc) {
  const P = k => [ox + DIPPER[k][0] * w, oy + DIPPER[k][1] * h];
  for (const run of [['dubhe', 'merak', 'phecda', 'megrez', 'dubhe'],
                     ['megrez', 'alioth', 'mizar', 'alkaid']]) {
    run.forEach((k, i) => { const [px, py] = P(k); i ? x.lineTo(px, py) : x.moveTo(px, py); });
  }
  for (const k of Object.keys(DIPPER)) { const [px, py] = P(k); star4(x, px, py, DIPPER[k][2] * sc); }
}
// Tail strands all leave the nucleus together and bow apart downstream; anchored
// far apart at both ends they'd just be parallel rails, which reads as track.
function cometSweep(x, hx, hy, r, dx, dy, bows) {
  x.moveTo(hx + r, hy); x.arc(hx, hy, r, 0, 6.283);
  const L = Math.hypot(dx, dy), px = -dy / L, py = dx / L;
  for (const b of bows) {
    x.moveTo(hx + dx * 0.06, hy + dy * 0.06);
    x.bezierCurveTo(hx + dx * 0.38 + px * b * 0.18, hy + dy * 0.38 + py * b * 0.18,
                    hx + dx * 0.72 + px * b * 0.62, hy + dy * 0.72 + py * b * 0.62,
                    hx + dx + px * b,               hy + dy + py * b);
  }
}
// Where the giant sits on its orbit. Body and path are DIFFERENT colors on
// purpose: same-color ellipses of similar weight read as one tangle instead of
// as a planet standing on a path.
const ORB = { cx: 196, cy: 458, rx: 186, ry: 76, rot: -0.08, at: 1.9 };
const GIANT = (() => {
  const c = Math.cos(ORB.rot), s = Math.sin(ORB.rot);
  const ex = Math.cos(ORB.at) * ORB.rx, ey = Math.sin(ORB.at) * ORB.ry;
  return { x: ORB.cx + ex * c - ey * s, y: ORB.cy + ex * s + ey * c };
})();

const MOON_ELEMENTS = [
  { color: 'pink', draw(x) { cometSweep(x, 348, 88, 8, -300, 452, [-46, -6, 40]); } },
  { color: 'blue', draw(x) {
    x.moveTo(ORB.cx + ORB.rx * Math.cos(ORB.rot), ORB.cy + ORB.rx * Math.sin(ORB.rot));
    x.ellipse(ORB.cx, ORB.cy, ORB.rx, ORB.ry, ORB.rot, 0, 6.283);
  } },
  { color: 'green', draw(x) {
    x.moveTo(GIANT.x + 46, GIANT.y); x.arc(GIANT.x, GIANT.y, 46, 0, 6.283);
    x.moveTo(GIANT.x + 108, GIANT.y); x.ellipse(GIANT.x, GIANT.y, 108, 28, -0.3, 0, 6.283);
  } },
  { color: 'purple', draw(x) { bigDipper(x, 30, 44, 262, 92, 1.05); } },
];

// The locked-in layout: TO THE letterspaced across the frame, MOON huge beneath
// it. `place(k, n)` positions the k-th VISIBLE letter (spaces yield no tour) of
// n at its own center/size/rotation.
const SCENE = {
  lines: [
    { text: 'TO THE', place(k, n) {
      const t = n < 2 ? 0 : k / (n - 1);
      return { x: 75 + t * 240, y: 218, size: 34, rot: 0 };
    } },
    { text: 'MOON', place(k, n) {
      const t = n < 2 ? 0 : k / (n - 1);
      return { x: 63 + t * 264, y: 330, size: 78, rot: 0 };
    } },
  ],
  elements: MOON_ELEMENTS,
};

const PALETTE = { yellow: '#ffd44d', blue: '#5fb0ff', pink: '#ff6fa5', green: '#5fe0a0', purple: '#b48cff' };
// Kept in step with the live game (hex/index.html), which raised this 2.2e-5 ->
// 3.3e-5 when it settled on the 1-stroke word source — a centreline tour draws a
// partial LETTER where the filled tour drew a partial patch, so it needs more
// coverage to be unambiguous. The lab is only a predictor of the game if the two
// agree, so change them together.
const WORD_PPMS_FRAC = 3.3e-5; // fraction of the whole word's ink per ms (legibility formula input)
const SCENE_PPMS = 0.004;      // scenery patrol speed, tour-points per ms
const HEADING_DT = 16;         // ms back-sample for facing direction (~1 frame at 60fps)
const HEADING_EASE = 0.25;     // per-frame lerp toward the new heading vector

// CREWS: [{ color, tour(scene-space pts), len, kind: 'word'|'scenery' }]
let CREWS = [], WORD_LEN = 0;
function loadScene() {
  CREWS = [];
  // word letters -> one crew each, placed per line
  WORD_LEN = 0;
  for (const ln of SCENE.lines) {
    const s = sampleStrokeWord(ln.text);
    s.letters.forEach((letterTour, k) => {
      // recenter the letter on its own bbox, then scale/rotate it into the
      // spot the layout chose for it
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (const p of letterTour) {
        if (p.x < x0) x0 = p.x; if (p.x > x1) x1 = p.x;
        if (p.y < y0) y0 = p.y; if (p.y > y1) y1 = p.y;
      }
      const pl = ln.place(k, s.letters.length);
      const sc = pl.size / 190, rot = pl.rot || 0;
      const cr = Math.cos(rot), sr = Math.sin(rot);
      const lcx = (x0 + x1) / 2, lcy = (y0 + y1) / 2;
      const tour = letterTour.map(p => {
        const dx = (p.x - lcx) * sc, dy = (p.y - lcy) * sc;
        return { x: pl.x + dx * cr - dy * sr, y: pl.y + dx * sr + dy * cr };
      });
      CREWS.push({ color: PALETTE.yellow, tour, len: tour.length,
                   kind: 'word', closed: tourIsClosed(tour) });
      WORD_LEN += tour.length;
    });
  }
  // scenery elements -> connected components -> one crew each
  for (const e of SCENE.elements) {
    const tr = tracer(); e.draw(tr);
    const sampled = tr.polys.map(p => resamplePoly(p, 6)).filter(p => p.length > 1);
    for (const compTour of components(sampled)) {
      CREWS.push({ color: PALETTE[e.color], tour: compTour, len: compTour.length,
                   kind: 'scenery', closed: tourIsClosed(compTour) });
    }
  }
  rebuildCast(); updateStat();
}

function sceneMap(p) {
  const s = Math.min(W / 390, H / 620);
  return { x: (W - 390 * s) / 2 + p.x * s, y: (H - 620 * s) / 2 + p.y * s };
}

// ---------- cast: every mouse belongs to exactly one crew, forever ----------
// Deterministic greedy allocation: word mice fill letter crews round-robin; scenery
// mice go to the scenery crew with the largest deficit vs its fair (length + pad)
// share, so every pip and star gets staffed before big shapes get seconds.
let cast = [];
function rebuildCast() {
  cast = [];
  const wordCrews = [], scenCrews = [];
  CREWS.forEach((c, idx) => (c.kind === 'word' ? wordCrews : scenCrews).push(idx));
  const PAD = 14;
  const weights = scenCrews.map(i => CREWS[i].len + PAD);
  const wSum = weights.reduce((a, b) => a + b, 0) || 1;
  const assigned = scenCrews.map(() => 0);
  let wordOrdinal = 0, scenOrdinal = 0;
  for (let i = 0; i < 90; i++) {
    const rng = mulberry32(S.seed + i * 7919);
    const m = { i, p01: rng() };
    if (rng() * 100 < S.yellowPct && wordCrews.length) {
      m.crew = wordCrews[wordOrdinal++ % wordCrews.length];
    } else if (scenCrews.length) {
      scenOrdinal++;
      let bi = 0, bd = -Infinity;
      for (let k = 0; k < scenCrews.length; k++) {
        const deficit = scenOrdinal * (weights[k] / wSum) - assigned[k];
        if (deficit > bd) { bd = deficit; bi = k; }
      }
      assigned[bi]++;
      m.crew = scenCrews[bi];
    } else m.crew = 0;
    m.color = CREWS[m.crew].color;
    cast.push(m);
  }
  // even phases within each crew
  const byCrew = new Map();
  for (const m of cast) {
    if (!byCrew.has(m.crew)) byCrew.set(m.crew, []);
    byCrew.get(m.crew).push(m);
  }
  for (const members of byCrew.values())
    members.forEach((m, k) => { m.phase = k / members.length; });
}

// Patrol the crew's tour. CLOSED tours (a glyph's O, a die pip, a free star, the
// ringed planet's disc) loop: tour[L-1] IS tour[0], so the wrap is continuous and
// the mouse just circles, with an unbroken heading and no 180-degree turnaround.
// OPEN strokes ping-pong, which is what covers them with no wrap-around jump.
// Coverage is identical either way — the cycles differ in length (L-1 vs 2(L-1))
// but a mouse still advances at `ppms` tour-points per ms, so the ink laid per
// second, and the legibility formula built on it, are unchanged.
function posAt(m, t) {
  const crew = CREWS[m.crew];
  const L = crew.len;
  if (L < 2) { const p = sceneMap(crew.tour[0] || { x: 195, y: 310 }); return p; }
  const ppms = crew.kind === 'word' ? WORD_PPMS_FRAC * WORD_LEN : SCENE_PPMS;
  const cyc = crew.closed ? L - 1 : 2 * (L - 1);
  let f = ((t * ppms + m.phase * cyc) % cyc + cyc) % cyc;
  if (!crew.closed && f > L - 1) f = cyc - f; // the return leg
  const idx = Math.min(L - 2, Math.floor(f)), frac = f - idx;
  const a = sceneMap(crew.tour[idx]), b = sceneMap(crew.tour[idx + 1]);
  return { x: a.x + (b.x - a.x) * frac, y: a.y + (b.y - a.y) * frac };
}

// Same silhouette as the live game's mouse (hex/index.html's drawWallMouse,
// itself synced to the MOUSE_TAIL_D/MOUSE_BODY_D/MOUSE_EAR/MOUSE_EYE SVG
// constants used everywhere else a mouse is drawn) — body blob with a white
// keyline, one ear, a dark eye dot, a curled tail. `r` keeps the old ellipse
// shape's meaning (roughly the body's vertical half-size) so callers/sliders
// didn't need retuning. The art faces +x at rest, so `angle` (radians, canvas
// convention) is the heading to rotate it toward — 0 keeps the old look.
function drawMouse(x, y, color, r, angle) {
  const s = r / 10, cx = 30.5, cy = 14;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle || 0);
  const P = (px, py) => [(px - cx) * s, (py - cy) * s];
  const seg = (c1x, c1y, c2x, c2y, ex, ey) => {
    const [a, b] = P(c1x, c1y), [c, d] = P(c2x, c2y), [e, f] = P(ex, ey);
    ctx.bezierCurveTo(a, b, c, d, e, f);
  };

  // tail — a curled stroke off the rear
  const [tx0, ty0] = P(12, 17);
  ctx.strokeStyle = color; ctx.lineWidth = r * 0.16; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(tx0, ty0);
  seg(4, 21, 2, 10, 8, 7);
  ctx.stroke();

  // body
  const [bx0, by0] = P(51, 16);
  ctx.beginPath(); ctx.moveTo(bx0, by0);
  seg(46, 8, 37, 4, 27, 5);
  seg(16, 6, 10, 10, 10, 16);
  seg(10, 21, 17, 24, 27, 24);
  seg(37, 24, 47, 21, 51, 16);
  ctx.closePath();
  ctx.fillStyle = color; ctx.fill();
  ctx.strokeStyle = '#f4f4f2'; ctx.lineWidth = r * 0.14; ctx.stroke();

  // ear
  const [erx, ery] = P(33, 7);
  ctx.beginPath(); ctx.arc(erx, ery, 4.6 * s, 0, 6.283);
  ctx.fillStyle = color; ctx.fill();
  ctx.strokeStyle = '#f4f4f2'; ctx.lineWidth = r * 0.14; ctx.stroke();

  // eye
  const [ix, iy] = P(42, 12);
  ctx.beginPath(); ctx.arc(ix, iy, 1.8 * s, 0, 6.283);
  ctx.fillStyle = '#0a0b10'; ctx.fill();
  ctx.restore();
}

let simT = 0, last = performance.now();
function frame(now) {
  const dt = now - last; last = now;
  simT += dt;
  if (!W) resize();
  const t = simT;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#14171d'; ctx.fillRect(0, 0, W, H);

  const trailN = S.trail, trailDt = 80;
  const maxSeg = 16; // a real patrol step is a few px per 80ms; longer = glide, no ink
  for (let i = 0; i < S.N; i++) {
    const m = cast[i];
    const isWord = CREWS[m.crew].kind === 'word';
    if (trailN > 0) {
      ctx.lineWidth = TRAIL_W; ctx.lineCap = 'round';
      let prev = posAt(m, t);
      for (let j = 1; j <= trailN; j++) {
        const p = posAt(m, t - j * trailDt);
        const far = Math.abs(p.x - prev.x) > maxSeg || Math.abs(p.y - prev.y) > maxSeg;
        if (!far) {
          ctx.globalAlpha = 0.5 * (1 - j / trailN);
          ctx.strokeStyle = m.color;
          ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(p.x, p.y); ctx.stroke();
        }
        prev = p;
      }
      ctx.globalAlpha = 1;
    }
    const p = posAt(m, t);
    // Facing: sample a step back and point along the displacement. Smoothed as a
    // unit VECTOR (not the raw angle) so it eases through the ping-pong
    // turnarounds instead of snapping, and wraps clean through ±π. Held at the
    // last heading when displacement is ~0 (a single-point crew), rather than
    // being pulled to atan2(0,0)'s spurious 0°.
    const prevP = posAt(m, t - HEADING_DT);
    const ddx = p.x - prevP.x, ddy = p.y - prevP.y;
    const dist = Math.hypot(ddx, ddy);
    if (dist > 0.02) {
      const ux = ddx / dist, uy = ddy / dist;
      if (m.dirX === undefined) { m.dirX = ux; m.dirY = uy; }
      else { m.dirX += (ux - m.dirX) * HEADING_EASE; m.dirY += (uy - m.dirY) * HEADING_EASE; }
    }
    const ang = m.dirX === undefined ? 0 : Math.atan2(m.dirY, m.dirX);
    drawMouse(p.x, p.y, m.color, 3.1, ang);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
resize();

// ---------- controls ----------
function slider(id, out, key, scale) {
  const el = document.getElementById(id), o = document.getElementById(out);
  el.addEventListener('input', () => {
    o.textContent = el.value;
    S[key] = scale ? el.value / 100 : +el.value;
    if (key === 'yellowPct') rebuildCast();
    updateStat();
  });
}
slider('sN', 'oN', 'N');
slider('sY', 'oY', 'yellowPct');
slider('sT', 'oT', 'trail');
document.getElementById('reseed').addEventListener('click', () => {
  S.seed = (S.seed * 1103515245 + 12345) >>> 0;
  rebuildCast();
});

// live word-legibility estimate (coverage ≈ 1 → the trails ink the word once)
const covEl = document.getElementById('cov'), tagEl = document.getElementById('tag');
function updateStat() {
  const trailMs = S.trail * 80;
  let n = 0;
  for (let i = 0; i < S.N; i++) if (CREWS[cast[i].crew].kind === 'word') n++;
  const cov = n * trailMs * WORD_PPMS_FRAC;
  covEl.textContent = cov.toFixed(2) + '×';
  // Bands recalibrated against the settled 1-stroke source by reading the live
  // wall at each mouse count, not against `filled`'s old 0.85: a centreline word
  // is still dropping whole letter strokes at 1.2x and only resolves near 1.7x.
  let label, color;
  if (cov < 1.0) { label = 'hidden'; color = '#5b6472'; }
  else if (cov < 1.6) { label = 'forming'; color = '#c9803a'; }
  else if (cov < 3.0) { label = 'legible'; color = '#3fa46b'; }
  else { label = 'saturated'; color = '#3d63c9'; }
  tagEl.textContent = label;
  tagEl.style.background = color; tagEl.style.color = '#fff';
}
loadScene();
</script>
