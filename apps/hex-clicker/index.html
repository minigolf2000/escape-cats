<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Hex Clicker</title>
<!-- THE ONE FACE, started on the preload scanner's pass rather than after the
     stylesheet is parsed (never inline it in styles.css as a data URI).
     `crossorigin` is not optional on a font preload: fonts fetch in anonymous
     CORS mode, and without it the preload lands in the other pool and the font
     is fetched twice. -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/baloo2.woff2">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❓</text></svg>">
<!--
  Hex Clicker — the multiplayer client's markup. A Cookie Clicker homage: pet
  Hex the cat, collect MICE, spend them on buildings and upgrades. The room
  server owns the economy (packages/shared/src/hex/); src/README.md is the
  module map. THE TWIST: buying Catnap Hypnalysis flips the game into the NIGHT
  PHASE, where the reveal wall inks TO THE MOON (src/wall.js). Hex has no win
  screen of its own — the win is the proctor's press (see the root README).
-->
<body class="booting">

<div id="hud">
  <div id="bank">
    <!-- The coin REPLACES the word "mice", so it carries the unit's meaning and
         needs the label the text used to provide (its inner svg is aria-hidden). -->
    <div id="count">0</div><span id="countIcon" role="img" aria-label="mice"></span>
    <div id="cps">per second: <b>0</b></div>
  </div>
</div>

<!-- Night sky. Empty and fixed behind everything; see its CSS for why the night
     background is a fading layer instead of a --page-bg override. -->
<div id="nightSky" aria-hidden="true"></div>

<div id="stage">
  <!-- day-only sunburst (Cookie Clicker's spinning rays); sits under everything -->
  <div id="rays"></div>
  <!-- night sky: a static twinkling starfield (built by makeStars), behind the
       wall; the neon mice draw on the #wall canvas on top of this. -->
  <div id="stars"></div>
  <!-- night-phase reveal wall; sits under everything -->
  <canvas id="wall"></canvas>
  <!-- Hex herself. The art comes from the Figma file "Hexxxygon" (see
       src/README.md): PNG heads in public/art/, plus the traced eye rig below. -->
  <div id="catWrap">
   <div id="catMotion"><div id="catPose"><div id="catBreath">
    <!-- Idle sleep sign. aria-hidden: the night phase is announced elsewhere, and
         three drifting glyphs are decoration, not information a reader needs. -->
    <div id="sleepZ" aria-hidden="true"><span>z</span><span>z</span><span>z</span></div>
    <svg id="hexCat" role="button" aria-label="Pet Hex" width="828" height="652" viewBox="0 0 828 652" fill="none" xmlns="http://www.w3.org/2000/svg">

  <div id="buff"></div>
  <!-- Empty: spawnGold() fills this with the gilded mouse. -->
  <div id="golden" role="button" aria-label="Golden mouse"></div>
  <!-- No prose on the stage, ever — not onboarding, not the legibility payoff.
       The mystery IS the mechanic; the wall becoming readable is its own signal. -->
</div>

<div id="dock">
  <!-- The SHOP rail is the dock's one control: it names the panel and is the
       only thing that closes/reopens it. A direct child of #dock, not of
       #upgradeSec, so the title stays put whichever sections are on screen.
       aria-controls names the one scroller that collapses. -->
  <button type="button" id="shopToggle" class="shopHead"
          aria-expanded="true" aria-controls="shopScroll">
    <!-- The storefront from the art file, traced to one even-odd path. Inherits
         .shopHead's currentColor like .chev does, so it is the rail's own
         two-phase colour. Decorative: the button is named by .shopTitle. -->
    <span class="shopIcon" aria-hidden="true"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M12.31 21.54 2.31 21.38 1.77 20.38 2.08 20.08 2.54 13.31 1.54 13.08 0.23 12.08 -0.08 10.54 0.08 9.77 0.85 8.38 2.77 6.62 3.54 6.15 4.54 6.08 4.08 5.0 4.38 4.38 4.38 3.46 5.23 2.62 8.46 2.31 12.15 2.62 19.08 2.46 19.92 3.31 20.54 6.23 21.38 6.31 23.15 8.08 23.92 10.23 23.92 11.62 22.46 13.23 21.85 13.54 20.54 13.62 20.08 20.54 19.54 21.38 13.69 21.23ZM15.92 6.54 18.62 6.31 18.62 4.0 16.92 4.31 15.23 4.31 14.77 4.0 6.0 4.15 5.77 5.62 5.31 6.08 5.85 6.31 10.0 6.15 14.15 6.62ZM2.69 11.62 3.54 11.54 4.69 10.69 5.77 8.54 5.85 7.85 4.31 7.69 1.92 9.62 1.62 11.15 2.0 11.54ZM9.46 13.0 10.62 12.46 11.46 11.31 11.92 9.92 12.0 8.0 7.85 7.85 7.62 8.08 6.54 11.0 6.54 12.08 7.85 13.08ZM20.69 11.92 21.69 11.85 22.23 11.31 22.38 10.38 22.08 9.31 20.77 7.85 19.23 7.85 18.85 8.08 18.85 8.38 19.15 9.0 19.31 10.54 19.62 11.31 20.31 12.0ZM16.23 12.85 16.77 12.62 17.46 11.77 17.46 8.69 17.08 8.0 14.0 8.15 13.31 11.0 13.46 12.08 14.0 12.77 14.46 12.62ZM8.23 19.92 9.0 19.77 8.85 17.92 9.46 16.08 10.77 14.77 12.46 14.46 14.0 14.62 15.46 15.77 16.38 17.92 16.23 19.0 16.62 19.85 18.46 19.69 19.0 13.15 18.62 12.92 17.38 14.15 16.62 14.46 14.92 14.46 13.54 14.0 12.31 12.92 10.77 14.31 10.0 14.62 8.0 14.77 6.15 14.0 4.77 12.62 4.08 13.15 4.23 13.46 3.77 15.92 3.92 17.0 3.62 19.77ZM14.38 19.77 14.69 19.46 14.69 17.62 14.08 16.54 13.23 16.15 11.38 16.31 10.54 17.46 10.54 19.62 11.85 19.85ZM13.38 18.92 12.54 18.54 12.69 17.62 13.23 17.38 13.92 18.08Z"/></svg></span>
    <span class="shopTitle">Shop</span>
    <!-- The closed sign. Permanently in the DOM, picked by #dock.sold-out like a
         building row's ??? (.lockedNm): a class swap, so no refresh path writes
         rail text and the sign cannot flash the wrong word for a frame. -->
    <span class="soldTitle">Sold Out</span><span class="chev" aria-hidden="true"></span>
    <!-- The unseen-upgrade count reads at the scroller's edges (.moreHint) — a
         fact about SCROLLING belongs where the scrolling is. The tab carries it
         only in its accessible name, the one place a number must still exist
         while the tray is shut. -->
  </button>
  <!-- ONE scroller for both lists, a plank between them, so one gesture runs
       from the top of the upgrades to the bottom of the buildings. -->
  <div id="shopScroll">
    <!-- "N MORE", one per edge. Permanently in the DOM and picked by [hidden],
         like the closed sign and the locked rows: no refresh path builds them,
         only writes the number. Direction is a CLASS (.up/.down in CSS), so the
         count is the only thing JS ever writes here. -->
    <div class="moreHint up" aria-hidden="true" hidden><span class="pill"></span></div>
    <div id="upgradeSec">
      <div id="upgrades"></div>
    </div>
    <div id="buildingSec">
      <div class="shopDivider"></div>
      <div id="shop"></div>
    </div>
    <div class="moreHint down" aria-hidden="true" hidden><span class="pill"></span></div>
  </div>
</div>

<!-- Input trap for the night-transition cutscene: transparent (the beat plays
     through it), but while .on it eats every tap so nothing is selectable. Sits
     above the dock so the whole static shop is locked during the reveal. -->
<div id="cutsceneVeil"></div>


<!-- ==== MULTIPLAYER SHELL: the join gate covers the stage until the player is
     in a room; the roster and reconnect toast are the only other additions. ==== -->

<!-- WHO IS HERE: one name per line, stacked above the shop tray (see #team in
     styles.css). A sibling of #dock, not a child, so it survives the tray being
     hidden before the shop unlocks and gone after it retires; it rides the
     tray's top edge by measurement (the ResizeObserver in main.js). aria-live
     off: four names changing a handful of times a session are not an announcement. -->
<div id="team" aria-live="off"></div>
<div id="connToast">reconnecting…</div>

<!-- The win splash and its toggle: after the shell so they paint over the game,
     before the gate/rotate covers, which outrank them (z-index note on #splash). -->
<div id="splash" aria-hidden="true">
  <div class="sky top"></div><img id="splashArt" alt=""><div class="sky bottom"></div>
</div>
<button id="wonPill" type="button">🏆 win screen</button>

<div id="gate">
  <h1>🐱 Hex Clicker</h1>
  <p id="gateStatus"></p>
  <p class="err" id="gateErr"></p>
</div>

<!-- Portrait gate. Hidden by default; only the media query in the stylesheet
     shows it. Last in the body so it paints over everything. -->
<div id="rotate">
  <div class="glyph">📱</div>
  <b>Turn your phone upright</b>
  <span>Hex Clicker is played in portrait.</span>
</div>

<script type="module" src="/src/main.js"></script>
